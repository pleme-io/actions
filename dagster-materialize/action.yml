name: 'pleme-io · dagster-materialize'
description: 'Materialize a Dagster asset via dagster CLI.'
branding: { icon: 'play', color: 'purple' }

inputs:
  asset-key:
    required: true
  workdir:
    required: false
    default: "."

outputs:
  materialized:
    value: ${{ steps.run.outputs.materialized }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/dagster-materialize.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        ASSET_KEY: ${{ inputs.asset-key }}
        WORKDIR: ${{ inputs.workdir }}
