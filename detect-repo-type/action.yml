name: 'pleme-io · detect-repo-type'
description: 'Auto-detect the repo type from manifest file presence at the root. Emits a typed identifier (rust-workspace / rust-single-crate / go / npm / python / helm / ansible-collection / ruby-gem / github-action / caixa / unknown) that downstream jobs route on.'
branding:
  icon: 'eye'
  color: 'blue'

# Detection is purely from file presence at repo root.
# All logic lives in run.tlisp; the runner just provides the FS view.

inputs:
  expect:
    description: >-
      Optional PRECONDITION. When set to a repo-type identifier, the action
      fails if the repo is not that type, naming both the expectation and
      what the manifest actually says. Empty (the default) keeps the
      detect-and-report behaviour unchanged for every existing consumer.
      Use it from a reusable workflow that only works on one repo shape, so
      the shape is asserted here rather than assumed of each consumer's shim.
    required: false
    default: ""

outputs:
  repo-type:
    description: "One of: rust-workspace, rust-single-crate, go, npm, python, helm, ansible-collection, ruby-gem, github-action, caixa, unknown"
    value: ${{ steps.detect.outputs.repo-type }}
  manifest-path:
    description: "Path of the manifest that drove the detection (for diagnostics)"
    value: ${{ steps.detect.outputs.manifest-path }}

runs:
  using: composite
  steps:
    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/detect-repo-type.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - name: Detect repo type
      id: detect
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        EXPECT: ${{ inputs.expect }}
