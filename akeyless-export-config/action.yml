name: 'pleme-io · akeyless-export-config'
description: 'Export an Akeyless gateway config snapshot (auth methods + roles + items) for audit / diff / backup.'
branding: { icon: 'archive', color: 'orange' }

inputs:
  output-path:
    required: false
    default: "akeyless-config.json"
  api-url:
    required: false
    default: "https://api.akeyless.io"

outputs:
  config-path:
    value: ${{ steps.exp.outputs.config-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/akeyless-export-config.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: exp
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        OUTPUT_PATH: ${{ inputs.output-path }}
        API_URL: ${{ inputs.api-url }}
