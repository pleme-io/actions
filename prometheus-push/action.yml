name: 'pleme-io · prometheus-push'
description: 'Push metrics to a Prometheus pushgateway. Useful for emitting deploy/release counters from CI.'
branding: { icon: 'bar-chart', color: 'orange' }

inputs:
  gateway-url:
    required: true
    description: "Pushgateway base URL"
  job:
    required: true
  metrics:
    required: true
    description: "Multi-line text in pushgateway exposition format"

outputs:
  pushed:
    value: ${{ steps.run.outputs.pushed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/prometheus-push.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        GATEWAY_URL: ${{ inputs.gateway-url }}
        JOB: ${{ inputs.job }}
        METRICS: ${{ inputs.metrics }}
