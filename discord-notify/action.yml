name: 'pleme-io · discord-notify'
description: 'Post a typed release event to a Discord webhook. Sibling of slack-notify.'
branding: { icon: 'message-circle', color: 'purple' }

inputs:
  webhook-url:
    description: "Discord incoming-webhook URL (read from secrets)"
    required: true
  title:
    description: "Embed title"
    required: true
  body:
    description: "Embed description (markdown)"
    required: false
    default: ""
  color:
    description: "Embed color (decimal int or hex like 0x00ff00)"
    required: false
    default: "3066993"

outputs:
  delivered:
    value: ${{ steps.notify.outputs.delivered }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/discord-notify.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: notify
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
        COLOR: ${{ inputs.color }}
