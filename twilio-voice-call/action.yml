name: 'pleme-io · twilio-voice-call'
description: 'Trigger a Twilio voice call via API for ops alerts.'
branding: { icon: 'phone', color: 'red' }

inputs:
  account-sid:
    required: true
  auth-token:
    required: true
  from:
    required: true
  to:
    required: true
  twiml-url:
    required: true

outputs:
  sid:
    value: ${{ steps.run.outputs.sid }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/twilio-voice-call.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        ACCOUNT_SID: ${{ inputs.account-sid }}
        AUTH_TOKEN: ${{ inputs.auth-token }}
        FROM_ARG: ${{ inputs.from }}
        TO_ARG: ${{ inputs.to }}
        TWIML_URL: ${{ inputs.twiml-url }}
