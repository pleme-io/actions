name: 'pleme-io · rust-cross-build'
description: 'cargo build --release for a target, stage binary + sha256 into ./dist'
branding:
  icon: 'box'
  color: 'orange'

inputs:
  binary-name:
    description: "Cargo binary name. Always passed as --bin <name>, so only that binary is built; also names target/<triple>/release/<name> and the staged artifact basename"
    required: true
  package:
    description: "Cargo package that owns the binary; empty = no -p flag. In a workspace, pass it to keep other members' dependency features out of this binary (--bin alone narrows targets, not resolver-2 feature unification)"
    required: false
    default: ""
  target:
    description: "Rust target triple (e.g. x86_64-unknown-linux-gnu)"
    required: true
  suffix:
    description: "Artifact suffix appended to <binary-name> (e.g. linux-x86_64)"
    required: true
  features:
    description: "Space-separated cargo features; empty = no --features flag"
    required: false
    default: ""
  no-default-features:
    description: "When 'true', pass --no-default-features"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/rust-cross-build.tlisp"
        {
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - name: Build + stage
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
        # run.tlisp calls `sha256-file` (dc70ad7, 2026-09-19), which the
        # action's frozen default v0.2.5 does not bind: every tatara-lisp
        # release-binaries run since v0.3.59 died with "unbound symbol
        # `sha256-file`", and since that workflow is what publishes new
        # tatara-script binaries, the failure could never fix itself. Pin the
        # newest published release that binds it, and require the symbol so a
        # runner-image binary without it is not taken on the PATH fast path.
        version: v0.3.58
        require-symbols: sha256-file
      env:
        BIN:         ${{ inputs.binary-name }}
        TARGET:      ${{ inputs.target }}
        SUFFIX:      ${{ inputs.suffix }}
        PACKAGE:     ${{ inputs.package }}
        FEATURES:    ${{ inputs.features }}
        NO_DEFAULTS: ${{ inputs.no-default-features }}
