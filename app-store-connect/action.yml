name: 'pleme-io · app-store-connect'
description: 'Upload an iOS build to App Store Connect via altool.'
branding: { icon: 'smartphone', color: 'red' }

inputs:
  ipa-path:
    required: true
  api-key-id:
    required: true
  issuer-id:
    required: true

outputs:
  uploaded:
    value: ${{ steps.run.outputs.uploaded }}

runs:
  using: composite
  steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with: { xcode-version: latest-stable }
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/app-store-connect.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        IPA_PATH: ${{ inputs.ipa-path }}
        API_KEY_ID: ${{ inputs.api-key-id }}
        ISSUER_ID: ${{ inputs.issuer-id }}
