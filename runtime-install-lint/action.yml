name: 'pleme-io · runtime-install-lint'
description: 'Fail on runtime tool installation (curl|tar, curl|sh, apt-get/apt/pip/npm/go/cargo install) in any action.yml or run.tlisp, AND per-job Nix installation (nix-installer-action / `nix shell nixpkgs#…`) in any .github/workflows/*.yml. The tool must ship as a Nix-hardened image / baked runner image instead — see theory/NIX-HARDENING.md §VI, §VI.1.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  paths:
    description: "Glob for files to scan (default: every action.yml + run.tlisp in the repo, excluding this action's own name and any _-prefixed shared dir)."
    required: false
    default: "*/action.yml */run.tlisp"
  fail-on-violation:
    description: "Fail the job on a NEW (not-yet-baselined) violation. Existing debt in baseline.txt is always reported, never silently accepted, but only fails the build once removed from the baseline without being fixed."
    required: false
    default: "true"
  baseline-path:
    description: "Path (relative to the checked-out repo root) of the tracked-debt baseline file. Defaults to this action's own convention; a CONSUMING repo (e.g. one invoking the lint over its own .github/workflows) sets it to its own baseline, e.g. .github/workflows/runtime-install-baseline.txt."
    required: false
    default: "runtime-install-lint/baseline.txt"

outputs:
  violations:
    description: "Count of NEW (non-baselined) violations found."
    value: ${{ steps.scan.outputs.violations }}
  baselined:
    description: "Count of already-tracked baseline violations found (reported, not failed)."
    value: ${{ steps.scan.outputs.baselined }}
  files-scanned:
    description: "Count of action.yml files the scan examined — a zero here means the gate proved nothing."
    value: ${{ steps.scan.outputs.files-scanned }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/runtime-install-lint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: scan
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PATHS: ${{ inputs.paths }}
        FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
        BASELINE_PATH: ${{ inputs.baseline-path }}
