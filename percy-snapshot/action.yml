name: 'pleme-io · percy-snapshot'
description: 'Capture Percy visual regression snapshots.'
branding: { icon: 'eye', color: 'purple' }

inputs:
  token:
    required: true
  script:
    required: true

outputs:
  snapshots-count:
    value: ${{ steps.run.outputs.snapshots-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/percy-snapshot.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        TOKEN: ${{ inputs.token }}
        SCRIPT: ${{ inputs.script }}
