name: 'pleme-io · cloudflare-kv-put'
description: 'Put a key/value into a Workers KV namespace.'
branding: { icon: 'upload', color: 'orange' }

inputs:
  namespace-id:
    required: true
  key:
    required: true
  value:
    required: true

outputs:
  put:
    value: ${{ steps.run.outputs.put }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/cloudflare-kv-put.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        NAMESPACE_ID: ${{ inputs.namespace-id }}
        KEY_ARG: ${{ inputs.key }}
        VALUE: ${{ inputs.value }}
