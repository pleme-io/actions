name: 'pleme-io · caixa-publish-to-git'
description: 'Tag the current commit with the caixa.lisp :version field — turns the repo into a git-as-package-repo that downstream caixas can :depends-on by tag.'
branding: { icon: 'tag', color: 'green' }

inputs:
  caixa-path:
    description: "Path to the .caixa.lisp source (default: auto-detect)"
    required: false
    default: ""
  tag-prefix:
    description: "Prefix for the tag (default: 'v')"
    required: false
    default: "v"
  push-tag:
    required: false
    default: "true"
  token-source:
    description: "github-token source: app (the runner host's App token, the default), pat (the pat input) or none. Without a token the checkout uses github.token."
    required: false
    default: "app"
  pat:
    description: "PAT presented only when token-source is pat."
    required: false
    default: ""

outputs:
  tag:
    value: ${{ steps.run.outputs.tag }}
  published:
    value: ${{ steps.run.outputs.published }}

runs:
  using: composite
  steps:
    - id: token
      uses: pleme-io/actions/github-token@main
      with:
        source: ${{ inputs.token-source }}
        pat: ${{ inputs.pat }}
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ steps.token.outputs.token || github.token }}
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/caixa-publish-to-git.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CAIXA_PATH: ${{ inputs.caixa-path }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        PUSH_TAG: ${{ inputs.push-tag }}
