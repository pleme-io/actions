name: 'pleme-io · dotnet-publish'
description: 'dotnet publish + push to NuGet.'
branding: { icon: 'upload', color: 'purple' }

inputs:
  project:
    required: true
  configuration:
    required: false
    default: "Release"
  nuget-key:
    required: true

outputs:
  published:
    value: ${{ steps.run.outputs.published }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/dotnet-publish.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PROJECT: ${{ inputs.project }}
        CONFIGURATION: ${{ inputs.configuration }}
        NUGET_KEY: ${{ inputs.nuget-key }}
