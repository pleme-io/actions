name: 'pleme-io · image-scan'
description: 'Scan a container image for vulnerabilities + secrets via Trivy. Emits typed severity + vuln-count outputs. Configurable fail-on-severity gate.'
branding:
  icon: 'eye'
  color: 'red'

inputs:
  image-ref:
    description: "Image to scan (e.g. ghcr.io/pleme-io/foo:latest). When local-archive is set, this is used only as a human-readable label in logs/outputs -- nothing is pulled from a registry."
    required: true
  local-archive:
    description: "Path to a local docker-archive: tarball (e.g. a Nix-built OCI image's ./result) to scan INSTEAD of pulling image-ref from a registry. This is the pre-publish gate shape: build locally, scan the local artifact, only push on a clean scan -- a scan of an already-registry-pushed image is a receipt, not a gate. Empty (default) = scan image-ref by pulling it, preserving existing callers' behavior exactly."
    required: false
    default: ""
  fail-on-severity:
    description: "Lowest severity that fails the build: UNKNOWN | LOW | MEDIUM | HIGH | CRITICAL | none"
    required: false
    default: "HIGH"
  ignore-unfixed:
    description: "Skip vulns without an available fix"
    required: false
    default: "false"
  vex:
    description: "Path to an OpenVEX/CSAF document passed to trivy as --vex. For a finding that is REAL in the SBOM but NOT REACHABLE in this artifact -- a published, machine-readable claim with a justification, which an auditor can read and dispute. NOT the same as ignore-file: an ignore hides a finding, a VEX answers it. Empty (default) keeps the prior behaviour exactly."
    required: false
    default: ""
  ignore-file:
    description: "Path to a .trivyignore-format file of named, tracked exceptions (never a blanket severity loosening — each entry should carry its own justification). Empty = none."
    required: false
    default: ""

outputs:
  severity:
    value: ${{ steps.scan.outputs.severity }}
  vuln-count:
    value: ${{ steps.scan.outputs.vuln-count }}
  scanned-targets:
    description: >-
      How many targets trivy actually examined (`.Results | length`), or
      "unknown" if that could not be parsed. THE DENOMINATOR for vuln-count:
      `vuln-count=0` with `scanned-targets=0` means NOTHING WAS MEASURED, which
      is a different fact from a clean image and used to print identically.
      Confirmed live in hardened-images run 30648147453, where
      release-clickhouse passed on `severity=none count=0` while trivy had
      examined zero targets (distroless C++: no OS package DB, no language
      manifest) and vulnix reported 11 findings on the same image in the same
      job. Advisory only -- it does not gate, because for those images the
      vulnix closure scan is the real coverage by design.
    value: ${{ steps.scan.outputs.scanned-targets }}

runs:
  using: composite
  steps:
    - name: Install Trivy
      shell: bash
      run: |
        # PINNED TWICE, deliberately: the SCRIPT at a tag, and the VERSION it
        # installs. Both were unpinned -- install.sh came from `main` and, per
        # its own usage text, "if tag is missing, then the latest will be
        # used". A scanner resolved that way makes its verdict irreproducible:
        # "0 CVE" asserted by a trivy nobody can name, from a script that can
        # change between two runs of the same commit.
        # Verified 2026-08-01: the tagged script URL is HTTP 200, and v0.72.0
        # is the current release (it is also the version hardened-images'
        # cve-gate.nix names as current, so this closes a real staleness gap
        # against the nixpkgs-pinned 0.52.0 it warns about).
        #
        # ── SCRIPT HASH PINNED TOO (added 2026-08-02) ─────────────────────
        # CORRECTION to an earlier note that called the fetched BINARY
        # unverified: it is not. install.sh verifies the release tarball's
        # sha256 against trivy's published checksums file (its own line 61,
        # `hash_sha256_verify`) -- 16 verification call sites in the script.
        # The binary was never the gap.
        #
        # THE SCRIPT was. `curl | sudo sh` executed it as ROOT with nothing
        # checking its bytes, and the URL is pinned to a TAG -- which a
        # publisher can move. So the one genuinely unverified link was the
        # thing running with the most privilege. install.sh even documents
        # the hazard itself (line 53: "if a curl|bash cuts off the end of the
        # script due to ..."), which is a truncation this pipe cannot detect
        # either: a short read yields a partial script that may still exit 0.
        #
        # Now: fetch to disk, verify against a pinned digest, THEN execute.
        # Measured 2026-08-02 at the pinned tag: 9945 bytes,
        # sha256 e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a
        # If upstream moves the tag, this fails LOUDLY naming both digests
        # instead of silently running different code as root.
        TRIVY_INSTALL_SHA256="e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a"
        curl -sfL -o /tmp/trivy-install.sh \
          https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh
        got="$(sha256sum /tmp/trivy-install.sh | awk '{print $1}')"
        if [ "$got" != "$TRIVY_INSTALL_SHA256" ]; then
          echo "::error::trivy install.sh checksum MISMATCH -- refusing to execute as root."
          echo "::error::  expected: $TRIVY_INSTALL_SHA256"
          echo "::error::  got:      $got"
          echo "::error::  The pinned tag may have been moved, or the fetch was truncated."
          exit 1
        fi
        echo "trivy install.sh verified ($got)"
        # NOTE the argv change: piping used `sh -s -- <args>` because `-s` tells
        # sh to read the SCRIPT from stdin. Running a FILE, `-s --` would be
        # passed to the script as arguments instead. Verified by running both
        # forms against the real installer: `-s -- -b DIR v0.72.0` exits 2 and
        # installs nothing; `-b DIR v0.72.0` exits 0 and installs the binary.
        sudo sh /tmp/trivy-install.sh -b /usr/local/bin v0.72.0

    # ── SENSITIVITY CANARY (added 2026-08-02) ──────────────────────────────
    # This action already reports scanned-targets, the DENOMINATOR: it proves
    # trivy ANALYSED something. It cannot prove trivy can still FIND anything.
    # A scan can present real targets to a real database and match nothing --
    # wrong package-type handling, an ecosystem the DB does not index, a
    # matcher regression -- and every existing diagnostic stays green. Checking
    # that a smoke detector has power is not the same as holding a match under
    # it, and this is the action every hardened image's trivy gate runs through.
    #
    # So: before the real scan, run a hand-written SPDX SBOM naming
    # log4j-core 2.14.1 through the SAME trivy binary and SAME DB just
    # installed above, and fail the step unless it comes back non-zero.
    #
    # An SBOM, not a known-vulnerable image: an image canary would pull a
    # deliberately-vulnerable third-party artifact into every release path to
    # test a scanner -- a real exposure and a HERMETIC SUPPLY CHAIN violation.
    # This is ~25 lines of local heredoc: no network subject, nothing to pin.
    #
    # Counts ALL severities, deliberately unfiltered by fail-on-severity. The
    # canary asks "can this scanner find anything at all", which is a different
    # question from "does this image breach our threshold". Filtering would make
    # the canary vacuous for any caller whose threshold excludes the canary's
    # severities -- a check that disables itself via unrelated configuration.
    #
    # Asserts count > 0, NEVER a specific CVE id. Measured 2026-08-01: grype
    # reports this package's Log4Shell as GHSA-jfh8-c2jp-5v3q, not
    # CVE-2021-44228, because maven data is GHSA-namespaced. An id-specific
    # assertion goes red on a CORRECT scanner whenever a namespace differs --
    # a false red on a security gate is what trains people to disable it.
    - name: Trivy sensitivity canary (prove the scanner can still find things)
      shell: bash
      run: |
        set -euo pipefail
        cat > /tmp/trivy-canary.spdx.json <<'CANARY_EOF'
        {
          "spdxVersion": "SPDX-2.3",
          "dataLicense": "CC0-1.0",
          "SPDXID": "SPDXRef-DOCUMENT",
          "name": "trivy-sensitivity-canary",
          "documentNamespace": "https://pleme.io/spdx/trivy-sensitivity-canary",
          "creationInfo": { "created": "2026-08-01T00:00:00Z", "creators": ["Tool: pleme-io-image-scan"] },
          "packages": [{
            "SPDXID": "SPDXRef-Package-log4j-core",
            "name": "log4j-core",
            "versionInfo": "2.14.1",
            "downloadLocation": "NOASSERTION",
            "filesAnalyzed": false,
            "licenseConcluded": "NOASSERTION",
            "licenseDeclared": "NOASSERTION",
            "copyrightText": "NOASSERTION",
            "externalRefs": [{
              "referenceCategory": "PACKAGE-MANAGER",
              "referenceType": "purl",
              "referenceLocator": "pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1"
            }]
          }]
        }
        CANARY_EOF
        rc=0
        trivy sbom /tmp/trivy-canary.spdx.json --format json --quiet > /tmp/trivy-canary.json 2>/dev/null || rc=$?
        n=""
        if [ "$rc" -eq 0 ] && [ -s /tmp/trivy-canary.json ]; then
          n=$(jq '[(.Results // [])[] | (.Vulnerabilities // []) | length] | add // 0' /tmp/trivy-canary.json 2>/dev/null || echo "")
        fi
        if [ -z "$n" ] || [ "$n" -eq 0 ]; then
          echo "::error::Trivy sensitivity canary returned ${n:-<error>} findings (expected > 0)."
          echo "::error::  The scanner did not flag a package with KNOWN vulnerabilities, so any"
          echo "::error::  'no findings' verdict from this run is UNPROVEN. Do not read it as clean."
          echo "::error::  This is the family=none failure mode: trivy skips what it cannot"
          echo "::error::  classify and still exits 0."
          exit 1
        fi
        echo "sensitivity canary OK: trivy found $n known vulnerabilities in the canary SBOM"

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

      # @main, not @v1 -- this action's own `severity`/`vuln-count`
      # output forwards don't exist on tatara-script/action.yml at the v1
      # tag (2026-05-22, predates them), so a @v1 pin here would come
      # back silently empty rather than erroring -- confirmed live
      # 2026-07-21 while chasing a downstream zot-pull-scan failure.
      # The fleet's primary CVE-gate consumers (nix-image-auto-release.yml,
      # image-push.yml, container-stack.yml, compliance-attest.yml) were
      # already correctly on @main; this action itself was the one stale
      # holdout.
      # TRIVY_USERNAME/TRIVY_PASSWORD, GHCR-scoped -- found live 2026-07-23:
      # this action never authenticated trivy's registry pull at all, so it
      # only ever worked by AMBIENT LUCK on self-hosted runners that happen
      # to carry pre-baked GHCR credentials out-of-band. Any GitHub-hosted
      # runner (e.g. the fleet's own `runnerOverride` on-demand escape
      # hatch) failed outright: trivy's "remote" registry backend returned
      # a real `401 UNAUTHORIZED` on `ghcr.io/token?...` -- confirmed via a
      # real failed scan job's raw log, not inferred. Every pleme-io image
      # this action scans publishes to ghcr.io/pleme-io (★★ TOOL
      # DISTRIBUTION), so scoping to that prefix covers the real fleet-wide
      # case without a false general-registry assumption. `github.token`
      # is the ambient per-job GITHUB_TOKEN -- always present, needs no new
      # secret and no caller-side change. Harmless when LOCAL_ARCHIVE is
      # set (trivy scans `--input <path>`, never touches a registry, so
      # these credentials are simply unused).
    - id: scan
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        LOCAL_ARCHIVE: ${{ inputs.local-archive }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        VEX_FILE: ${{ inputs.vex }}
        TRIVY_USERNAME: ${{ startsWith(inputs.image-ref, 'ghcr.io/') && github.actor || '' }}
        TRIVY_PASSWORD: ${{ startsWith(inputs.image-ref, 'ghcr.io/') && github.token || '' }}

    # Artifact names may only contain alphanumerics, `_`, `-`, `.` — strip
    # everything else from image-ref (which carries `:`, `/`) so the upload
    # step below always has a legal, still-human-readable name.
    - id: sanitize
      if: always()
      shell: bash
      run: |
        raw="${{ inputs.image-ref }}"
        clean=$(echo "$raw" | tr -c 'a-zA-Z0-9._-' '-')
        echo "name=$clean" >> "$GITHUB_OUTPUT"

    # Preserves the full trivy JSON regardless of the gate's verdict — the
    # scan step above only surfaces a severity + a coarse count; triaging
    # an actual finding (which package, which CVE) needs the real report.
    # if: always() so a hard-failed gate (the exact case someone needs to
    # triage) still uploads. Unique per matrix cell via image-ref (sanitized
    # for artifact-name legality) + run attempt, since this action runs
    # inside a matrix across services/archs and artifact names must be
    # unique within one workflow run.
    - name: Upload trivy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report-${{ steps.sanitize.outputs.name }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/image-scan-trivy-output.json
        retention-days: 14
        if-no-files-found: ignore
