name: 'pleme-io · image-scan'
description: 'Scan a container image for vulnerabilities + secrets via Trivy. Emits typed severity + vuln-count outputs. Configurable fail-on-severity gate.'
branding:
  icon: 'eye'
  color: 'red'

# ── "Install Trivy" IS GONE (2026-08-08) ────────────────────────────────
#
# The 79-line `run: |` body action-shell-lint's baseline named as "the
# remaining work, not a formality" is now install.tlisp. Six defects came
# out of that conversion, each named and closed at the line that closes it —
# read install.tlisp's header.
#
# What is left of bash here is the loader (exempt, and now ONE loop instead
# of two copied blocks) plus the two-line artifact-name sanitizer below,
# whose own two defects — a live script-injection site and a trailing dash
# on every artifact ever uploaded — are closed in place.
#
# ★ ONE THING THIS MOVE DID NOT FIX, and it must not read as fixed:
# runtime-install-lint tracks `./image-scan/action.yml` for fetching a tool
# at job time (★★ HERMETIC SUPPLY CHAIN). The fetch still happens — it just
# lives in install.tlisp now. That lint scans only `action.yml` and
# `run.tlisp`, so its entry for this action needs re-pointing, and its
# argv-blind patterns need extending: in shell the URL and the `curl` sit on
# one line and match; in tlisp they are separate expressions and match
# nothing. The deshellify campaign therefore erases that lint's subject set
# wherever it lands. Baselines are not this action's to edit — flagged here
# so the owner of runtime-install-lint/baseline.txt can act on it.
#
# ★ NO `actions/checkout` HERE, deliberately. The repo's usual loader shape
# opens with one; this action must not. A checkout inside a composite step
# resets the CALLER's workspace, which is where `local-archive` (a locally
# built, not-yet-pushed OCI tarball), `ignore-file` and `vex` all live. It
# is not needed either: every script is read via `github.action_path`.

inputs:
  image-ref:
    description: "Image to scan (e.g. ghcr.io/pleme-io/foo:latest). When local-archive is set, this is used only as a human-readable label in logs/outputs -- nothing is pulled from a registry."
    required: true
  local-archive:
    description: "Path to a local docker-archive: tarball (e.g. a Nix-built OCI image's ./result) to scan INSTEAD of pulling image-ref from a registry. This is the pre-publish gate shape: build locally, scan the local artifact, only push on a clean scan -- a scan of an already-registry-pushed image is a receipt, not a gate. Empty (default) = scan image-ref by pulling it, preserving existing callers' behavior exactly."
    required: false
    default: ""
  fail-on-severity:
    description: "Lowest severity that fails the build: UNKNOWN | LOW | MEDIUM | HIGH | CRITICAL | none"
    required: false
    default: "HIGH"
  ignore-unfixed:
    description: "Skip vulns without an available fix"
    required: false
    default: "false"
  vex:
    description: "Path to an OpenVEX/CSAF document passed to trivy as --vex. For a finding that is REAL in the SBOM but NOT REACHABLE in this artifact -- a published, machine-readable claim with a justification, which an auditor can read and dispute. NOT the same as ignore-file: an ignore hides a finding, a VEX answers it. Empty (default) keeps the prior behaviour exactly."
    required: false
    default: ""
  ignore-file:
    description: "Path to a .trivyignore-format file of named, tracked exceptions (never a blanket severity loosening — each entry should carry its own justification). Empty = none."
    required: false
    default: ""

outputs:
  severity:
    value: ${{ steps.scan.outputs.severity }}
  vuln-count:
    value: ${{ steps.scan.outputs.vuln-count }}
  scanned-targets:
    description: >-
      How many targets trivy actually examined (`.Results | length`), or
      "unknown" if that could not be parsed. THE DENOMINATOR for vuln-count:
      `vuln-count=0` with `scanned-targets=0` means NOTHING WAS MEASURED, which
      is a different fact from a clean image and used to print identically.
      Confirmed live in hardened-images run 30648147453, where
      release-clickhouse passed on `severity=none count=0` while trivy had
      examined zero targets (distroless C++: no OS package DB, no language
      manifest) and vulnix reported 11 findings on the same image in the same
      job. Advisory only -- it does not gate, because for those images the
      vulnix closure scan is the real coverage by design.
    value: ${{ steps.scan.outputs.scanned-targets }}

runs:
  using: composite
  steps:
    - name: Load stdlib + every tlisp unit this action runs
      # ── ONE loader for four scripts, not four loaders ──────────────────
      # This was two near-identical 14-line blocks and a third was about to
      # be copied for install.tlisp. Duplicating the loader in the one place
      # the shell lint exempts is how an exempt block grows into a program;
      # the loop is the same act the rest of this action just performed on
      # its own bodies.
      #
      # WRITES FILES, PASSES PATHS (migrated 2026-08-02, kept). Emitting the
      # concatenated source as a step OUTPUT made tatara-script carry it as
      # the env var TATARA_SCRIPT_SRC, and GitHub echoes every env value into
      # the step's log group — so each scan dumped ~1700 lines of tlisp into
      # the job log before running. That is not cosmetic: it makes every grep
      # for a message find the source line that WOULD print it rather than a
      # line that DID, and it produced four wrong diagnoses in this stack,
      # twice on the same fix, where `grep "0 store paths pushed"` matched an
      # echoed `(cond ((= pushed 0) …` branch and a WORKING change was judged
      # ineffective.
      #
      # The stdlib is read IN-CHECKOUT, at the SAME ref as each unit below —
      # never fetched.
      #
      # The emptiness check is the point of the `-s` test: a script that
      # parses to nothing exits 0, and a scan that ran no checks would look
      # exactly like a scan that found none.
      id: src
      shell: bash
      run: |
        set -euo pipefail
        for unit in install canary run; do
          f="$RUNNER_TEMP/image-scan-$unit-$GITHUB_RUN_ID-$RANDOM.tlisp"
          {
            cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
            echo
            cat "${{ github.action_path }}/$unit.tlisp"
          } > "$f"
          if [ ! -s "$f" ]; then
            echo "::error::image-scan: assembled $unit tlisp is empty at $f" >&2
            exit 1
          fi
          echo "$unit-path=$f" >> "$GITHUB_OUTPUT"
          echo "assembled $unit: $(wc -l < "$f") lines -> $f"
        done

    - name: Sanitize the image ref into a legal artifact name
      # Artifact names may only contain alphanumerics, `_`, `-`, `.` — strip
      # everything else from the image ref (which carries `:` and `/`) so the
      # upload step below always has a legal, still-human-readable name.
      #
      # ── TWO DEFECTS FIXED IN PLACE, both live before today ──────────────
      #
      # (1) SCRIPT INJECTION. This read `raw="${{ inputs.image-ref }}"` — the
      #     runner interpolated a caller-controlled value INTO the bash source
      #     before bash ever saw it, so a ref containing a quote and a
      #     semicolon executed as the runner. An image ref is routinely built
      #     from a matrix entry, a tag or an event payload, so "our callers
      #     pass literals" was never a property of this primitive. Now it
      #     arrives via `env:` and is read as DATA: there is no source text
      #     for it to become part of.
      #
      # (2) A TRAILING `-` ON EVERY NAME. `echo` appended a newline, the
      #     newline is outside the allowed class, and `tr -c` mapped it to
      #     `-` — so every artifact this action ever uploaded was named
      #     `…-foo-latest--<attempt>`, with a doubled dash nobody could
      #     place. Measured: `echo "ghcr.io/pleme-io/foo:latest" | tr -c …`
      #     -> `ghcr.io-pleme-io-foo-latest-`. `printf '%s'` emits no
      #     newline, so there is nothing left to map.
      #
      # `tr` also maps an embedded newline to `-`, so a ref cannot smuggle a
      # SECOND key=value line into $GITHUB_OUTPUT either.
      #
      # ── WHY THIS IS STILL BASH, and it is not "it is short" ─────────────
      #
      # It was converted to a tlisp step (sanitize.tlisp, 5 green unit tests)
      # and REVERTED, because that wiring is silently broken: a `uses:` step's
      # outputs resolve only against the called action's DECLARED `outputs:`,
      # and tatara-script declares 319 of them — `severity`, `image-ref`,
      # `artifact-path` — but no `name`. `steps.sanitize.outputs.name` would
      # have come back EMPTY on every run and named every artifact
      # `trivy-report--1`. That is the same silently-empty-forward class this
      # file already records against pinning tatara-script at @v1.
      # Two lines of glue that work beat a typed step that returns "".
      # Re-convert the day tatara-script declares an `artifact-name` output.
      if: always()
      id: sanitize
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        clean=$(printf '%s' "${IMAGE_REF:-unknown-image}" | tr -c 'a-zA-Z0-9._-' '-')
        printf 'name=%s\n' "$clean" >> "$GITHUB_OUTPUT"

    - name: Install Trivy (pinned script + pinned version, then verified)
      # PINNED TWICE, deliberately: the installer SCRIPT (tag + sha256) and
      # the scanner VERSION it installs. That dual pin is the only reason a
      # scan verdict from this action is reproducible at all — "0 CVE"
      # asserted by a trivy nobody can name is not a verdict.
      #
      # install.tlisp adds the assertion the shell body never made: that the
      # trivy the scan step will actually resolve IS the pinned one.
      # install.sh resolves the tag over the network and installs whatever
      # that yields, so "we passed v0.72.0" and "v0.72.0 is on PATH" were two
      # different facts and only the first was established. Read its header.
      #
      # COMMENT PLACEMENT IS LOAD-BEARING: this block sits INSIDE the step,
      # after `- name:`. action-shell-lint counts a `run: |` body until the
      # next `    - ` line, so a comment written BETWEEN two steps at
      # 4-space indent is charged to the PREVIOUS step's body — written
      # above the step, these 11 lines pushed the 2-line sanitizer to a
      # reported 13 of a 15 threshold. Measured, not theorised.
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.install-path }}

    # ── SENSITIVITY CANARY ─────────────────────────────────────────────────
    # `scanned-targets` reports the DENOMINATOR: it proves trivy ANALYSED
    # something. It cannot prove trivy can still FIND anything. A scan can
    # present real targets to a real database and match nothing — wrong
    # package-type handling, an ecosystem the DB does not index, a matcher
    # regression — and every existing diagnostic stays green. Checking that a
    # smoke detector has power is not the same as holding a match under it,
    # and this is the action every hardened image's trivy gate runs through.
    #
    # So: before the real scan, run a hand-written SPDX SBOM naming
    # log4j-core 2.14.1 through the SAME trivy binary and SAME DB installed
    # above, and fail unless it comes back non-zero.
    #
    # An SBOM, not a known-vulnerable image: an image canary would pull a
    # deliberately-vulnerable third-party artifact into every release path to
    # test a scanner — a real exposure and a HERMETIC SUPPLY CHAIN violation.
    #
    # Counts ALL severities, deliberately unfiltered by fail-on-severity. The
    # canary asks "can this scanner find anything at all", a different
    # question from "does this image breach our threshold"; filtering would
    # make it vacuous for any caller whose threshold excludes the canary's
    # severities — a check that disables itself via unrelated configuration.
    #
    # Asserts count > 0, NEVER a specific CVE id. Measured 2026-08-01: grype
    # reports this package's Log4Shell as GHSA-jfh8-c2jp-5v3q, not
    # CVE-2021-44228, because maven data is GHSA-namespaced. An id-specific
    # assertion goes red on a CORRECT scanner whenever a namespace differs —
    # a false red on a security gate is what trains people to disable it.
    - name: Trivy sensitivity canary (prove the scanner can still find things)
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.canary-path }}
      env:
        CANARY_FIXTURE: ${{ github.action_path }}/trivy-canary.spdx.json

      # @main, not @v1 -- this action's own `severity`/`vuln-count`
      # output forwards don't exist on tatara-script/action.yml at the v1
      # tag (2026-05-22, predates them), so a @v1 pin here would come
      # back silently empty rather than erroring -- confirmed live
      # 2026-07-21 while chasing a downstream zot-pull-scan failure.
      # The fleet's primary CVE-gate consumers (nix-image-auto-release.yml,
      # image-push.yml, container-stack.yml, compliance-attest.yml) were
      # already correctly on @main; this action itself was the one stale
      # holdout.
      # TRIVY_USERNAME/TRIVY_PASSWORD, GHCR-scoped -- found live 2026-07-23:
      # this action never authenticated trivy's registry pull at all, so it
      # only ever worked by AMBIENT LUCK on self-hosted runners that happen
      # to carry pre-baked GHCR credentials out-of-band. Any GitHub-hosted
      # runner (e.g. the fleet's own `runnerOverride` on-demand escape
      # hatch) failed outright: trivy's "remote" registry backend returned
      # a real `401 UNAUTHORIZED` on `ghcr.io/token?...` -- confirmed via a
      # real failed scan job's raw log, not inferred. Every pleme-io image
      # this action scans publishes to ghcr.io/pleme-io (★★ TOOL
      # DISTRIBUTION), so scoping to that prefix covers the real fleet-wide
      # case without a false general-registry assumption. `github.token`
      # is the ambient per-job GITHUB_TOKEN -- always present, needs no new
      # secret and no caller-side change. Harmless when LOCAL_ARCHIVE is
      # set (trivy scans `--input <path>`, never touches a registry, so
      # these credentials are simply unused).
    - id: scan
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.run-path }}
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        LOCAL_ARCHIVE: ${{ inputs.local-archive }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        VEX_FILE: ${{ inputs.vex }}
        TRIVY_USERNAME: ${{ startsWith(inputs.image-ref, 'ghcr.io/') && github.actor || '' }}
        TRIVY_PASSWORD: ${{ startsWith(inputs.image-ref, 'ghcr.io/') && github.token || '' }}

    - name: Upload trivy report
      # Preserves the full trivy JSON regardless of the gate's verdict — the
      # scan step above only surfaces a severity + a coarse count; triaging
      # an actual finding (which package, which CVE) needs the real report.
      # if: always() so a hard-failed gate (the exact case someone needs to
      # triage) still uploads. Unique per matrix cell via image-ref (sanitized
      # for artifact-name legality) + run attempt, since this action runs
      # inside a matrix across services/archs and artifact names must be
      # unique within one workflow run.
      #
      # NOTE ON COMMENT PLACEMENT: this block sits INSIDE the step, after
      # `- name:`, deliberately. action-shell-lint counts a `run: |` body by
      # scanning until the next `    - ` line, so a comment block written
      # BETWEEN two steps at 4-space indent is attributed to the PREVIOUS
      # step's body.
      #
      # ── PUBLIC REPOS ONLY, AND THAT IS A QUOTA INVARIANT ────────────────
      # Artifact storage is FREE AND UNLIMITED for public repositories, and
      # billed against ONE shared org-wide allowance for private ones (500 MB
      # on the free plan). pleme-io has 649 private repos against that single
      # allowance, so a private repo uploading a triage convenience artifact
      # spends a fleet-wide resource.
      #
      # Measured 2026-08-20, which is why this gate exists: the allowance was
      # exhausted and this exact step failed with
      #
      #   Failed to CreateArtifact: Artifact storage quota has been hit.
      #
      # in ensaio and hardened-images — turning the WHOLE JOB red while the
      # scan it belongs to had already reached a verdict. The gate's answer
      # was never in doubt; the upload of the report about it was.
      #
      # Counted, not inferred: exactly TWO repos showed this error that day,
      # ensaio and hardened-images, and both are private. `nix` and `kura` are
      # private too and were ALSO red, but for unrelated reasons (failing eval
      # checks; a failing test gate) — being private does not by itself put a
      # repo in this bucket, and grouping them there would have sent the next
      # reader looking for a quota problem that repo does not have.
      #
      # `visibility` is absent from payloads that carry no repository object,
      # in which case this evaluates false and the upload is SKIPPED. That is
      # the deliberate direction: losing a convenience artifact is recoverable,
      # spending the fleet's shared allowance is not.
      #
      # The report is NOT lost on a private repo — the scan writes it to
      # $RUNNER_TEMP and the step below prints where, and nothing anywhere
      # consumes this artifact programmatically (checked: no download-artifact
      # in the org's actions). It is for a human triaging a finding.
      if: always() && github.event.repository.visibility == 'public'
      uses: actions/upload-artifact@v4
      with:
        name: trivy-report-${{ steps.sanitize.outputs.name }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/image-scan-trivy-output.json
        retention-days: 14
        if-no-files-found: ignore

    - name: Say where the report is when the upload was skipped
      # No silent caps: a skipped upload must announce itself, or the next
      # person triaging a finding looks for an artifact that was never
      # created and concludes the scan did not run.
      if: always() && github.event.repository.visibility != 'public'
      shell: bash
      run: |
        echo "::notice title=trivy report not uploaded::Artifact upload is \
        public-repo-only (private uploads bill the org's shared storage \
        allowance). The full trivy JSON for this run is on the runner at \
        ${RUNNER_TEMP}/image-scan-trivy-output.json — the scan itself ran and \
        its verdict gated normally."
