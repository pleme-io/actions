name: 'pleme-io · asana-task-create'
description: 'Create an Asana task via the API.'
branding: { icon: 'check-circle', color: 'red' }

inputs:
  token:
    required: true
  project-id:
    required: true
  name:
    required: true

outputs:
  task-id:
    value: ${{ steps.run.outputs.task-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/asana-task-create.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        TOKEN: ${{ inputs.token }}
        PROJECT_ID: ${{ inputs.project-id }}
        NAME: ${{ inputs.name }}
