name: 'pleme-io · stale-issue-bot'
description: 'Mark stale issues + close after threshold.'
branding: { icon: 'clock', color: 'gray-dark' }

inputs:
  days-stale:
    required: false
    default: "60"
  days-close:
    required: false
    default: "14"
  exempt-labels:
    required: false
    default: "pinned"

outputs:
  closed-count:
    value: ${{ steps.run.outputs.closed-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/stale-issue-bot.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        DAYS_STALE: ${{ inputs.days-stale }}
        DAYS_CLOSE: ${{ inputs.days-close }}
        EXEMPT_LABELS: ${{ inputs.exempt-labels }}
        REPO: ${{ inputs. }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
