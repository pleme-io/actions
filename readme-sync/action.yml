name: 'pleme-io · readme-sync'
description: 'Sync ReadMe.io docs from a repo.'
branding: { icon: 'book', color: 'blue' }

inputs:
  api-key:
    required: true
  version:
    required: true
  workdir:
    required: false
    default: "docs/"

outputs:
  synced-count:
    value: ${{ steps.run.outputs.synced-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/readme-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        API_KEY: ${{ inputs.api-key }}
        VERSION_ARG: ${{ inputs.version }}
        WORKDIR: ${{ inputs.workdir }}
