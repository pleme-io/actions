name: 'pleme-io · flyway-migrate'
description: 'Run flyway migrate.'
branding: { icon: 'database', color: 'red' }

inputs:
  url:
    required: true
  user:
    required: true
  password:
    required: true

outputs:
  applied:
    value: ${{ steps.run.outputs.applied }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/flyway-migrate.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        URL_ARG: ${{ inputs.url }}
        USER_ARG: ${{ inputs.user }}
        PASSWORD: ${{ inputs.password }}
