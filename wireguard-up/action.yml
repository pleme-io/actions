name: 'pleme-io · wireguard-up'
description: 'Bring up a WireGuard tunnel for ephemeral runner access.'
branding: { icon: 'wifi', color: 'green' }

inputs:
  config:
    required: true

outputs:
  interface:
    value: ${{ steps.run.outputs.interface }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/wireguard-up.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CONFIG: ${{ inputs.config }}
