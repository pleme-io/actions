name: 'pleme-io · typesense-import'
description: 'Import documents to Typesense.'
branding: { icon: 'search', color: 'green' }

inputs:
  host:
    required: true
  api-key:
    required: true
  collection:
    required: true
  documents-file:
    required: true

outputs:
  imported:
    value: ${{ steps.run.outputs.imported }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/typesense-import.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        HOST_ARG: ${{ inputs.host }}
        API_KEY: ${{ inputs.api-key }}
        COLLECTION: ${{ inputs.collection }}
        DOCUMENTS_FILE: ${{ inputs.documents-file }}
