name: 'pleme-io · vault-fetch'
description: 'Fetch a secret from HashiCorp Vault via JWT-OIDC auth.'
branding: { icon: 'key', color: 'gray-dark' }

inputs:
  vault-url:
    required: true
  role:
    required: true
  secret-path:
    required: true
  output-env:
    required: false
    default: ""

outputs:
  value:
    value: ${{ steps.run.outputs.value }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/vault-fetch.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        VAULT_URL: ${{ inputs.vault-url }}
        ROLE: ${{ inputs.role }}
        SECRET_PATH: ${{ inputs.secret-path }}
        OUTPUT_ENV: ${{ inputs.output-env }}
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
