name: 'pleme-io · secrets-scan'
description: 'gitleaks-based secret scan across the repo. Emits typed finding count + severity. Configurable fail-on-found gate.'
branding: { icon: 'shield', color: 'red' }

inputs:
  config-path:
    description: "Path to .gitleaks.toml (optional)"
    required: false
    default: ""
  fail-on-found:
    description: "Fail when any secret is found"
    required: false
    default: "true"

outputs:
  found-count:
    # "0", a positive count, or the literal "unknown". A consumer must NOT read
    # this as a number without checking scan-outcome first: the old version
    # emitted 0 for a scan that never ran, which is the false-green this action
    # was fixed to eliminate.
    value: ${{ steps.scan.outputs.found-count }}
  scan-outcome:
    # clean | findings | scan-error | report-unparseable. The last two mean
    # "we do not know", and the action exits 1 for them regardless of
    # fail-on-found — a broken scanner is not a passing scan.
    value: ${{ steps.scan.outputs.scan-outcome }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with: { fetch-depth: 0 }
    # No runtime curl/tar install (theory/NIX-HARDENING.md §VI) -- gitleaks is
    # fetched via Nix's own hash-verified store mechanism (run.tlisp's own
    # `nix profile install`), exact-pinned to the nixos-24.05 channel. This
    # step only sets up Nix itself on the runner.
    - uses: DeterminateSystems/nix-installer-action@main
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/secrets-scan.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: scan
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        FAIL_ON_FOUND: ${{ inputs.fail-on-found }}
