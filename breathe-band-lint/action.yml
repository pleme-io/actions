name: 'pleme-io · breathe-band-lint'
description: 'Static coverage gate for breathe bands in a GitOps tree — every bandable workload has a MemoryBand, every band targetRef resolves, no BestEffort on stateful/control-plane, every band declares spec.mode. Parses committed YAML only; never contacts a cluster. The fourth baseline-debt sibling of action-shell-lint / runtime-install-lint / no-cve-suppression.'
branding:
  icon: 'wind'
  color: 'blue'

inputs:
  root:
    description: "Cluster tree to scan (e.g. clusters/camelot-eks). Config is read from <root>/.breathe-bands.yaml and tracked debt from <root>/.breathe-bands-baseline.txt, so each cluster carries its own."
    required: false
    default: "."
  fail-on-violation:
    description: "Fail the job on a NEW (not-yet-baselined) finding. Existing debt in the baseline is always reported, never silently accepted. Set false to adopt report-only first."
    required: false
    default: "true"

outputs:
  violations:
    description: "Count of NEW (non-baselined) findings."
    value: ${{ steps.scan.outputs.violations }}
  baselined:
    description: "Count of findings matched against the tracked-debt baseline (reported, not failed)."
    value: ${{ steps.scan.outputs.baselined }}
  workloads-scanned:
    description: "Count of Deployments/StatefulSets/DaemonSets found in the tree."
    value: ${{ steps.scan.outputs.workloads-scanned }}
  bands-scanned:
    description: "Count of Cpu/Memory/StorageBands found in the tree."
    value: ${{ steps.scan.outputs.bands-scanned }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/breathe-band-lint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: scan
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        ROOT: ${{ inputs.root }}
        FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
