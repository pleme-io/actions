name: 'pleme-io · fly-deploy'
description: 'Deploy a Fly.io app via flyctl. Uses fly.toml at repo root; honors $FLY_API_TOKEN env var.'
branding: { icon: 'cloud', color: 'purple' }

inputs:
  app:
    description: "Fly app name (defaults to fly.toml's [app])"
    required: false
    default: ""
  strategy:
    description: "Deploy strategy: rolling | immediate | canary | bluegreen"
    required: false
    default: "rolling"
  region:
    description: "Pin deploy to a region"
    required: false
    default: ""

outputs:
  deployed:
    value: ${{ steps.run.outputs.deployed }}

runs:
  using: composite
  steps:
    - uses: superfly/flyctl-actions/setup-flyctl@master
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/fly-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        APP: ${{ inputs.app }}
        STRATEGY: ${{ inputs.strategy }}
        REGION: ${{ inputs.region }}
        FLY_API_TOKEN: ${{ env.FLY_API_TOKEN }}
