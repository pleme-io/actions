name: 'pleme-io · security-audit'
description: 'Polymorphic dependency-vulnerability audit. Detects repo type + routes to cargo-audit / npm-audit / pip-audit / etc. Emits a typed severity summary.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  fail-on-severity:
    description: "Lowest severity that fails the build: low | medium | high | critical | none"
    required: false
    default: "medium"

outputs:
  outcome:
    # The closed vocabulary. Only `scanned` is a verdict about the code —
    # every other value means the gate did not run and exits 3, so a caller
    # can tell "found nothing" apart from "looked at nothing".
    description: "scanned | no-manifest | tool-absent | tool-error | unparseable"
    value: ${{ steps.audit.outputs.outcome }}
  severity:
    description: "Highest severity found (none / low / medium / high / critical), or 'unknown' when outcome != scanned"
    value: ${{ steps.audit.outputs.severity }}
  vuln-count:
    # A REAL count now. It used to be `(if (contains "vulnerability") 1 0)` —
    # a 0/1 proxy emitted as though it were a number.
    description: "Total number of vulnerabilities found, or 'unknown' when outcome != scanned"
    value: ${{ steps.audit.outputs.vuln-count }}
  ecosystem:
    description: "Which auditor ran (cargo-audit / npm-audit / pip-audit / none)"
    value: ${{ steps.audit.outputs.ecosystem }}

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@main

    - name: Install Rust (if needed)
      if: hashFiles('Cargo.toml') != ''
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit (if Rust)
      if: hashFiles('Cargo.toml') != ''
      shell: bash
      # Nix-installed, not `cargo install` (theory/NIX-HARDENING.md §VI) --
      # exact-pinned to nixos-24.05.
      run: nix profile install github:NixOS/nixpkgs/nixos-24.05#cargo-audit || true

    - name: Install Node (if needed)
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install uv + pip-audit (if Python)
      if: hashFiles('pyproject.toml') != ''
      uses: astral-sh/setup-uv@v3

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # READ IN-CHECKOUT, NOT FETCHED. This used to be
          #   curl -sL https://raw.githubusercontent.com/pleme-io/actions/main/_tlisp-stdlib/stdlib.tlisp
          # which defeated the consumer's own pin: `uses:
          # pleme-io/actions/security-audit@v1` checks this repo out at v1 and
          # run.tlisp below is read from that checkout via github.action_path --
          # but the stdlib came from `main`. Half the executed script honoured
          # the pin and half did not, so a consumer pinning for reproducibility
          # silently ran whatever main held at that moment. GitHub clones the
          # whole repo for a composite action, so the stdlib is already on disk
          # beside us at the SAME ref; there was never a reason to fetch it.
          #
          # It also removes a network dependency that could not fail loudly:
          # `curl -sL` carries no --fail, so an HTTP error yields an EMPTY body
          # and a zero exit, and the heredoc closes over a script missing its
          # entire stdlib. The failure then surfaces as an undefined-function
          # error inside run.tlisp, pointing at the wrong layer.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: audit
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
