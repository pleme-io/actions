name: 'pleme-io · nix-flake-check'
description: 'Run `nix flake check` with DeterminateSystems Nix'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  flake-args:
    description: "Extra arguments appended to `nix flake check` (e.g. --override-input)"
    required: false
    default: ""
  no-warn-dirty:
    description: "Pass --no-warn-dirty (default true)"
    required: false
    default: "true"
  github-token:
    description: >-
      Token written to nix.conf as `access-tokens = github.com=<token>`, so
      nix's OWN GitHub fetcher can read PRIVATE pleme-io repos. Leave unset
      for a flake with no private inputs — the rendered line is then empty
      and nix.conf is untouched. Needs a token that can read the OTHER repo:
      the auto-provided `GITHUB_TOKEN` is scoped to the running repo alone
      and will still 404, so pass an org-scoped PAT (`BOT_PAT`).
    required: false
    default: ""

runs:
  using: composite
  steps:
    # ── why this action needs a token at all ──────────────────────────────
    #
    # A `nix flake check` on a Rust repo with a PRIVATE pleme-io git crate
    # dep fails without one, and the failure names the wrong layer: it
    # surfaces as an ordinary HTTP 404 on `api.github.com/repos/<o>/<r>/
    # tarball/<rev>`, which reads like a bad rev rather than "you are
    # anonymous". Measured on mado 2026-08-01 (run 30681539821), on private
    # pleme-io/hayai reached through mado -> nami-core -> hayai.
    #
    # It is worth being precise about WHICH fetcher, because the fleet's two
    # git fetchers have OPPOSITE credential behavior and the wrong guess
    # sends you to the wrong fix:
    #
    #   pkgs.fetchgit          shells `git clone` inside a FOD. A FOD has
    #                          network but no credentials, and neither
    #                          `access-tokens` nor `netrc-file` reaches a git
    #                          process in a builder. A token CANNOT fix it.
    #   builtins.fetchTree     routes through nix's own GitHub fetcher, which
    #     { type = "github"; }  DOES honor `access-tokens`. A token IS the fix.
    #
    # substrate's lockfile-builder already moved every github git-crate source
    # onto the second one, precisely so this class became fixable (see
    # `lib/build/rust/lockfile-builder.nix` — 66 of the fleet's 111 pleme-io
    # git-crate deps are private). That whole-class fix was load-bearing and
    # still could not work here, because this action installed Nix with no
    # token at all. This step is the missing half.
    #
    # Backward compatible by construction: a caller that passes nothing
    # renders an empty `extra-conf` and gets the installer's default nix.conf,
    # byte-for-byte what it got before.
    #
    # CORRECTION (2026-08-01, same day): the commit that added this claimed
    # `tests/test.yml` "covers exactly that path" because it invokes the action
    # with no token. It does invoke it that way — but the file lives under
    # `nix-flake-check/tests/`, NOT `.github/workflows/`, so GitHub never
    # registers it and it has never run. The no-token path is therefore
    # argued-correct, not measured. It is not a one-off either: 18 such
    # `*/tests/*.yml` files exist across 53 action directories in this repo and
    # nothing runs any of them, which is the "a forcing function nobody runs is
    # a comment" trap one level up — the test file itself is the comment. Left
    # in place per MODULARIZE-DON'T-DELETE; wiring them is its own change.
    # `sandbox = relaxed` is REQUIRED, not a loosening for convenience.
    #
    # Every pleme-io Rust flake evaluates gen's `cargo-build-spec-ifd`, and
    # that derivation sets `__noChroot` (it must reach the network to resolve
    # crates during import-from-derivation). With the installer's Linux
    # default of `sandbox = true`, nix refuses it outright:
    #
    #   error: derivation '…-cargo-build-spec-ifd.drv' has '__noChroot' set,
    #   but that's not allowed when 'sandbox' is 'true'
    #
    # `relaxed` is the narrow fix: normal derivations stay sandboxed exactly
    # as before, and ONLY a derivation that explicitly opts in via
    # `__noChroot` is exempted. It is not `sandbox = false`.
    #
    # WHY THIS SURFACED ONLY NOW (2026-08-01): the repos hitting it were all
    # on hand-written `runs-on: macos-15` jobs, and macOS nix does not enforce
    # the sandbox the same way — so `__noChroot` was never rejected there.
    # Migrating those jobs onto Linux ARC runners is what exposed it. Real
    # consequence of the migration, so it is fixed HERE, in the shared action,
    # rather than in each consumer that trips over it.
    - name: Install Nix (DeterminateSystems)
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          sandbox = relaxed
          ${{ inputs.github-token && format('access-tokens = github.com={0}', inputs.github-token) || '' }}

    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/nix-flake-check.tlisp"
        {
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - name: Run nix flake check
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        FLAKE_ARGS: ${{ inputs.flake-args }}
        NO_WARN_DIRTY: ${{ inputs.no-warn-dirty }}
