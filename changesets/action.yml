name: 'pleme-io · changesets'
description: 'Run npm/changesets version + publish flow.'
branding: { icon: 'tag', color: 'purple' }

inputs:
  publish:
    required: false
    default: "true"

outputs:
  published-count:
    value: ${{ steps.run.outputs.published-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/changesets.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PUBLISH: ${{ inputs.publish }}
