name: 'pleme-io · conftest'
description: 'Run conftest OPA-based policy check.'
branding: { icon: 'shield', color: 'orange' }

inputs:
  policy-dir:
    required: false
    default: "policy/"
  input-dir:
    required: false
    default: "."

outputs:
  violations:
    value: ${{ steps.run.outputs.violations }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/conftest.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        POLICY_DIR: ${{ inputs.policy-dir }}
        INPUT_DIR: ${{ inputs.input-dir }}
