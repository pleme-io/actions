name: 'pleme-io · super-cache-save'
description: 'Persist a build''s outputs to the durable super-cache tiers, write-if-absent, content-addressed, no lock (the eliminate-the-shared-cell pattern; concurrent-runner coherence is free). TIER-HONEST: the durable Postgres/object tiers are a named LiveTODO behind sui''s shipped Store/StorageBackend traits; the now-path persists to a local content-addressed object tier and is an honest no-op when no tier is configured.'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  endpoint:
    description: "The sui-cache binary-cache endpoint (e.g. http://sui.camelot-build.svc). CORRECTED 2026-08-05: this is NOT `sui-service-up`'s output — that action resolves sui-daemon-graph, whose default endpoint is a UDS path, and `nix copy --to <path>` writes into a LOCAL CHROOT STORE rather than the cache. It is also no longer a LiveTODO: a real `nix copy --to` lands in the durable Postgres tier (measured 2026-08-05, ~25 MB/s). Optional."
    required: false
    default: ""
  key:
    description: "Content-addressed cache key (from super-cache-restore). Empty => computed as sha256 over spec-path."
    required: false
    default: ""
  spec-path:
    description: "Path to the typed build-spec. Used to compute the key when key is empty."
    required: false
    default: ""
  outputs:
    description: "Space-separated build output list (store paths / files) to persist under the key."
    required: false
    default: ""
  cache-dir:
    description: "Directory backing the local content-addressed object tier (the now-path). Empty => the durable Pg/object tiers (LiveTODO) and an honest no-op otherwise."
    required: false
    default: ""
  flake-lock:
    description: "Path to the flake.lock whose locked narHash pins the flake-input source FODs (the WARM lever push half). Empty => no flake-input push."
    required: false
    default: ""
  flake-inputs:
    description: "Space/comma list of flake-input NODE names whose SOURCE FODs to also push to the endpoint (e.g. 'big-monorepo'), so a warm build preseeds them instead of re-git-cloning. Empty => outputs-only push."
    required: false
    default: ""
  result-link:
    description: "Path to a `result` symlink to resolve to its store path. Preferred over `outputs`: consumers were each hand-rolling the same readlink step, and one sibling workflow still passes a workspace path with no readlink at all, so its push has been an exit-0 no-op forever. Empty => fall back to `outputs`."
    required: false
    default: ""
  scope:
    description: "What to push. `build-closure-minus-upstream` (default) pushes the DERIVER's requisites minus everything cache.nixos.org already serves — the set a future build can actually reuse. `build-closure` skips the subtraction (tens of GB; diagnostics only). Anything else pushes just the output path, which is the pre-2026-08-05 behaviour and is why the cache held 10 objects, all per-commit tarballs, after weeks of green pushes."
    required: false
    default: "build-closure-minus-upstream"
  on-empty:
    description: "`warn` (default, byte-unchanged for every existing consumer) or `fail`. `nix copy` is best-effort PER PATH, so a 100%-failing push otherwise exits 0 and the job is green. `fail` is what a presence=required consumer sets."
    required: false
    default: "warn"

outputs:
  saved:
    description: "true if the outputs were newly persisted."
    value: ${{ steps.run.outputs.saved }}
  skipped:
    description: "true if the key was already present (idempotent write-if-absent skip)."
    value: ${{ steps.run.outputs.skipped }}
  key:
    description: "The content-addressed key that was persisted (or skipped)."
    value: ${{ steps.run.outputs.key }}
  tier:
    description: "sui | object | none — which durable tier accepted the write."
    value: ${{ steps.run.outputs.tier }}
  reason:
    description: "written | already-present | no-key | no-durable-tier | write-failed."
    value: ${{ steps.run.outputs.reason }}
  inputs-pushed:
    description: "Number of flake-input SOURCE FODs pushed to the endpoint (the WARM lever push half; 0 unless flake-lock + flake-inputs are set)."
    value: ${{ steps.run.outputs.inputs-pushed }}
  paths-pushed:
    description: "Number of store paths pushed to the endpoint. The leverage receipt: the founding 0-substituted/688-upstream measurement had to be taken by hand, and this makes 'did the cache do anything' a number in the run instead."
    value: ${{ steps.run.outputs.paths-pushed }}

runs:
  using: composite
  steps:
    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        # Writes a FILE and passes its PATH (migrated 2026-08-02). Emitting the
        # assembled stdlib+script as a step OUTPUT made tatara-script carry it as
        # the env var TATARA_SCRIPT_SRC, and GitHub echoes env values into the log
        # group -- so every invocation printed the whole source before running,
        # and any grep for a message matched the line that WOULD print it.
        f="$RUNNER_TEMP/super-cache-save-$GITHUB_RUN_ID-$RANDOM.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$f"
        # An empty assembly parses to nothing and exits 0 -- refuse it rather than
        # let a no-op look like a pass.
        if [ ! -s "$f" ]; then echo "::error::super-cache-save: assembled tlisp is empty" >&2; exit 1; fi
        echo "path=$f" >> "$GITHUB_OUTPUT"
        echo "assembled $(wc -l < "$f") lines -> $f"

    - name: Run super-cache-save
      id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.path }}
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        KEY: ${{ inputs.key }}
        SPEC_PATH: ${{ inputs.spec-path }}
        OUTPUTS: ${{ inputs.outputs }}
        SUI_CACHE_DIR: ${{ inputs.cache-dir }}
        FLAKE_LOCK: ${{ inputs.flake-lock }}
        FLAKE_INPUTS: ${{ inputs.flake-inputs }}
        RESULT_LINK: ${{ inputs.result-link }}
        SCOPE: ${{ inputs.scope }}
        ON_EMPTY: ${{ inputs.on-empty }}
