name: 'pleme-io · git-cliff'
description: 'Run git-cliff to generate a changelog from conventional commits.'
branding: { icon: 'tag', color: 'blue' }

inputs:
  config:
    required: false
    default: "cliff.toml"
  output:
    required: false
    default: "CHANGELOG.md"

outputs:
  generated:
    value: ${{ steps.run.outputs.generated }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/git-cliff.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CONFIG: ${{ inputs.config }}
        OUTPUT_ARG: ${{ inputs.output }}
