name: 'pleme-io · ollama-pull'
description: 'Pull an Ollama model.'
branding: { icon: 'download', color: 'purple' }

inputs:
  model:
    required: true
  host:
    required: false
    default: "http://localhost:11434"

outputs:
  pulled:
    value: ${{ steps.run.outputs.pulled }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/ollama-pull.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        MODEL: ${{ inputs.model }}
        HOST: ${{ inputs.host }}
