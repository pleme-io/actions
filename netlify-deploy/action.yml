name: 'pleme-io · netlify-deploy'
description: 'Deploy to Netlify via netlify CLI.'
branding: { icon: 'cloud', color: 'green' }

inputs:
  site-id:
    required: true
  dir:
    required: false
    default: "dist/"
  prod:
    required: false
    default: "false"

outputs:
  url:
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/netlify-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SITE_ID: ${{ inputs.site-id }}
        DIR: ${{ inputs.dir }}
        PROD: ${{ inputs.prod }}
