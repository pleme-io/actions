name: 'pleme-io · woocommerce-product-sync'
description: 'Sync products to WooCommerce REST API.'
branding: { icon: 'refresh-cw', color: 'purple' }

inputs:
  base-url:
    required: true
  consumer-key:
    required: true
  consumer-secret:
    required: true
  products-file:
    required: true

outputs:
  synced:
    value: ${{ steps.run.outputs.synced }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/woocommerce-product-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        BASE_URL: ${{ inputs.base-url }}
        CONSUMER_KEY: ${{ inputs.consumer-key }}
        CONSUMER_SECRET: ${{ inputs.consumer-secret }}
        PRODUCTS_FILE: ${{ inputs.products-file }}
