name: 'pleme-io · redis-flush'
description: 'Flush a Redis DB (use with extreme care).'
branding: { icon: 'trash', color: 'red' }

inputs:
  url:
    required: true
  db:
    required: false
    default: "0"

outputs:
  flushed:
    value: ${{ steps.run.outputs.flushed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/redis-flush.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        URL_ARG: ${{ inputs.url }}
        DB: ${{ inputs.db }}
