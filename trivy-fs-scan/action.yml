name: 'pleme-io · trivy-fs-scan'
description: >-
  Run a trivy filesystem vulnerability scan over the repo source. Judges the
  result by the REPORT FILE, never by trivy's exit code: trivy exits non-zero
  for operational failure exactly as it may for findings, so "scanned and found
  nothing" and "did not scan" are otherwise indistinguishable. A scan that did
  not run FAILS THE BUILD even when fail-on-found is false — findings are a
  finding, but not knowing is not a clean result.
branding: { icon: 'shield', color: 'red' }

inputs:
  workdir:
    required: false
    default: "."
  severity:
    description: "Comma-separated severities to report, e.g. HIGH,CRITICAL."
    required: false
    default: "HIGH,CRITICAL"
  fail-on-found:
    description: >-
      Fail the job when vulnerabilities are found. Default false: this action
      was a stub until 2026-08-17, so nothing downstream has ever seen a real
      result, and failing the first honest run on a pre-existing backlog is how
      a step gets disabled. A BROKEN scan fails regardless of this setting.
    required: false
    default: "false"

outputs:
  findings:
    description: "Count of vulnerabilities at or above `severity`."
    value: ${{ steps.run.outputs.findings }}
  scanned:
    description: >-
      "true" only when a report was produced and read. Gate on THIS, not on the
      step succeeding — a zero `findings` with `scanned: false` means nothing
      was examined.
    value: ${{ steps.run.outputs.scanned }}
  outcome:
    description: "clean | findings | scan-error | report-unparseable."
    value: ${{ steps.run.outputs.outcome }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/trivy-fs-scan.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WORKDIR: ${{ inputs.workdir }}
        SEVERITY: ${{ inputs.severity }}
        FAIL_ON_FOUND: ${{ inputs.fail-on-found }}
