name: 'pleme-io · zot-push'
description: 'Push a nix OCI image tarball to the PRIVATE in-cluster Zot registry (zot.zot-system.svc.cluster.local:5000/akeyless-<svc>) under the AUTOBUMP exact tag <arch>-r<run>-<sha>, and report the pushed repository digest (the exact deploy coordinate). FedRAMP-sensitive images NEVER go to ghcr.io.'
branding:
  icon: 'lock'
  color: 'purple'

inputs:
  registry:
    description: "Cluster Zot host:port (used when repo is empty)"
    required: false
    default: "zot.zot-system.svc.cluster.local:5000"
  repo:
    description: "Full base override '<host>/<repo>' (no tag). Wins when set."
    required: false
    default: ""
  image:
    description: "Repo path override '<repo>' (composed with registry when repo empty)"
    required: false
    default: ""
  svc:
    description: "Service slug (e.g. service-a); composes 'akeyless-<svc>'"
    required: false
    default: ""
  arch:
    description: "Image architecture for the tag prefix"
    required: false
    default: "amd64"
  run-number:
    description: "github.run_number — the numeric sort key r<n>"
    required: true
  sha:
    description: "github.sha — the trace suffix"
    required: true
  tarball:
    description: "docker-archive path produced by nix-image"
    required: false
    default: "./result"
  moving-latest:
    description: "Also push the moving <arch>-latest human pointer (never a deploy source)"
    required: false
    default: "false"
  dest-user:
    description: "Zot push credential username (e.g. the registry's builder admin user)"
    required: true
  dest-pass:
    description: "Zot push credential password"
    required: true
  ca-cert-url:
    description: "Raw URL of the pinned CA/leaf cert (PEM) to trust for TLS -- point it at the cert YOUR GitOps repo commits beside its Zot release. No default: a cert is a property of the caller's cluster, so an unset value fails closed with reason=no-ca-cert rather than pinning somebody else's. Set insecure=true to accept plain HTTP instead, explicitly."
    required: false
    default: ""
  insecure:
    description: "Fall back to plain HTTP if the CA cert fetch fails (real degradation, logged loudly -- never the default path when the cert is reachable)"
    required: false
    default: "false"
  ca-cert-path:
    description: "Local path the fetched CA cert is written to -- override if a single job invokes this action more than once against DIFFERENT certs"
    required: false
    default: "/tmp/zot-push-ca.crt"
  ca-cert-token:
    description: "GitHub token with read access to ca-cert-url's repo -- REQUIRED when that repo is private (an unauthenticated raw.githubusercontent.com fetch 404s). Empty (default) keeps the unauthenticated path for a public cert URL."
    required: false
    default: ""
  doca-ref:
    description: "The doca (oci-push) flake ref `nix run` resolves -- pin to a tagged/commit ref for build-reproducibility, or point at a fork"
    required: false
    default: "github:pleme-io/substrate#oci-push"
  backend:
    description: "doca push backend. Only `native` (pure-Rust) exists; the skopeo fallback was deleted 2026-07-31 because it was the last thing putting skopeo into every doca consumer's closure. Any other value is now an error."
    required: false
    default: "native"

outputs:
  tag:
    description: "The exact AUTOBUMP tag pushed (<arch>-r<run>-<sha>)"
    value: ${{ steps.run.outputs.tag }}
  ref:
    description: "Full pushed ref <base>:<tag>"
    value: ${{ steps.run.outputs.ref }}
  ref-amd64:
    description: "Full pushed ref when arch=amd64 (empty otherwise)"
    value: ${{ steps.run.outputs.ref-amd64 }}
  ref-arm64:
    description: "Full pushed ref when arch=arm64 (empty otherwise)"
    value: ${{ steps.run.outputs.ref-arm64 }}
  # The key is built as "ref-" + arch at runtime, and `arch` is an unvalidated
  # input, so the alias spellings are reachable and were dropped here. Domain is
  # declared in output-contract-sync/dynamic-keys.tsv.
  ref-aarch64:
    description: "Full pushed ref when arch=aarch64 (the arm64 alias; empty otherwise)"
    value: ${{ steps.run.outputs.ref-aarch64 }}
  ref-x86_64:
    description: "Full pushed ref when arch=x86_64 (the amd64 alias; empty otherwise)"
    value: ${{ steps.run.outputs.ref-x86_64 }}
  digest:
    description: "The pushed repository digest (sha256:…) — the exact deploy coordinate"
    value: ${{ steps.run.outputs.digest }}
  pushed:
    description: "'true' iff the exact tag pushed successfully"
    value: ${{ steps.run.outputs.pushed }}
  reason:
    description: "Typed discriminant: pushed | need-target | push-fail"
    value: ${{ steps.run.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/zot-push.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        # nix run needs the same feature gate nix build does on a self-hosted
        # runner whose baked nix.conf predates flakes (matches substrate's
        # image-push.yml doca step, the proven precedent this action follows).
        NIX_CONFIG: "experimental-features = nix-command flakes"
        REGISTRY: ${{ inputs.registry }}
        REPO: ${{ inputs.repo }}
        IMAGE: ${{ inputs.image }}
        SVC: ${{ inputs.svc }}
        ARCH: ${{ inputs.arch }}
        RUN_NUMBER: ${{ inputs.run-number }}
        SHA: ${{ inputs.sha }}
        TARBALL: ${{ inputs.tarball }}
        MOVING_LATEST: ${{ inputs.moving-latest }}
        DEST_USER: ${{ inputs.dest-user }}
        DEST_PASS: ${{ inputs.dest-pass }}
        CA_CERT_URL: ${{ inputs.ca-cert-url }}
        CA_CERT_PATH: ${{ inputs.ca-cert-path }}
        CA_CERT_TOKEN: ${{ inputs.ca-cert-token }}
        INSECURE: ${{ inputs.insecure }}
        DOCA_REF: ${{ inputs.doca-ref }}
        BACKEND: ${{ inputs.backend }}
