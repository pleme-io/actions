name: 'pleme-io · turbo-build'
description: 'Run turbo build across a monorepo.'
branding: { icon: 'package', color: 'blue' }

inputs:
  workdir:
    required: false
    default: "."
  filter:
    required: false
    default: ""

outputs:
  built:
    value: ${{ steps.run.outputs.built }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/turbo-build.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WORKDIR: ${{ inputs.workdir }}
        FILTER: ${{ inputs.filter }}
