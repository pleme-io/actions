name: 'pleme-io · cargo-publish-crate'
description: 'Publish a single Rust crate to crates.io; skips if (name, version) already exists; sleeps + retries on 429 rate-limit. Sibling of rust-workspace-publish for non-workspace Rust repos.'
branding:
  icon: 'upload'
  color: 'blue'

inputs:
  dry-run:
    description: "Run as --dry-run only (no upload)"
    required: false
    default: "false"
  no-verify:
    description: "Skip the verification compile step"
    required: false
    default: "true"
  crate-path:
    description: >-
      Directory containing the crate's Cargo.toml, relative to the repo
      root. Defaults to "." so every existing caller is unaffected.

      Mirrors cargo-bump's input of the same name, and must be set to the
      SAME value: run.tlisp reads ./Cargo.toml to learn the crate name and
      version, so without this it published from the repo root no matter
      what the caller asked for. For a repo whose crate is not at the root
      — e.g. forge, whose CLI is at cli/ — that meant the bump succeeded
      and the ship silently skipped, reporting a green run either way.
    required: false
    default: "."

outputs:
  shipped:
    description: "'true' on success (including skip-when-already), 'false' on failure"
    value: ${{ steps.ship.outputs.shipped }}
  deferred:
    description: >-
      'true' when publish was deferred because a dependency is not yet on
      crates.io (a GREEN outcome — the crate publishes once the dep lands).
      Was emitted by run.tlisp but undeclared here; declared now so the
      contract matches what the action actually returns.
    value: ${{ steps.ship.outputs.deferred }}
  conflict:
    description: >-
      'true' when crates.io refused the crate NAME (403 not-an-owner / name
      taken). Terminal: retrying cannot succeed. The remedy is a rename to
      `pleme-<name>`, which is an operator decision, so the action fails
      RED with that remedy named rather than renaming automatically.
    value: ${{ steps.ship.outputs.conflict }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable

    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          curl -sL https://raw.githubusercontent.com/pleme-io/actions/main/_tlisp-stdlib/stdlib.tlisp
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Publish crate
      id: ship
      uses: pleme-io/actions/tatara-script@main
      with:
        working-directory: ${{ inputs.crate-path }}
        script: ${{ steps.src.outputs.script }}
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        NO_VERIFY: ${{ inputs.no-verify }}
