name: 'pleme-io · cargo-publish-crate'
description: 'Publish a single Rust crate to crates.io; skips if (name, version) already exists; sleeps + retries on 429 rate-limit. Sibling of rust-workspace-publish for non-workspace Rust repos.'
branding:
  icon: 'upload'
  color: 'blue'

inputs:
  dry-run:
    description: "Run as --dry-run only (no upload)"
    required: false
    default: "false"
  no-verify:
    description: "Skip the verification compile step"
    required: false
    default: "true"
  crate-path:
    description: >-
      Directory containing the crate's Cargo.toml, relative to the repo
      root. Defaults to "." so every existing caller is unaffected.

      Mirrors cargo-bump's input of the same name, and must be set to the
      SAME value: run.tlisp reads ./Cargo.toml to learn the crate name and
      version, so without this it published from the repo root no matter
      what the caller asked for. For a repo whose crate is not at the root
      — e.g. forge, whose CLI is at cli/ — that meant the bump succeeded
      and the ship silently skipped, reporting a green run either way.
    required: false
    default: "."

outputs:
  shipped:
    description: "'true' on success (including skip-when-already), 'false' on failure"
    value: ${{ steps.ship.outputs.shipped }}
  deferred:
    description: >-
      'true' when publish stopped because a dependency is not yet on
      crates.io. This is a RED outcome, and the wording here used to say the
      opposite ("a GREEN outcome — the crate publishes once the dep lands").

      That promise had no mechanism. This action publishes ONE crate in ONE
      pass — unlike rust-workspace-publish, which loops over members and can
      genuinely pick a sibling up on a later pass — and cargo-auto-release.yml
      is `on: workflow_call` with no schedule, so nothing re-runs the repo
      when the dep lands. Exiting green meant the run stayed green forever
      while the crate never reached the registry.

      Kept as an output rather than removed: a caller that wants to tell
      "blocked on an upstream" apart from "publish itself failed" still can,
      it just no longer inherits a green run for it.
    value: ${{ steps.ship.outputs.deferred }}
  skipped-no-publish:
    description: >-
      'true' when the crate's [package] declares `publish = false`, so there
      was no registry claim to make. A GREEN outcome. Declared because an
      undeclared output does not forward out of a composite action at all —
      it would emit into the void and the caller could never tell this skip
      apart from a real publish.
    value: ${{ steps.ship.outputs.skipped-no-publish }}
  conflict:
    description: >-
      'true' when crates.io refused the crate NAME (403 not-an-owner / name
      taken). Terminal: retrying cannot succeed. The remedy is a rename to
      `pleme-<name>`, which is an operator decision, so the action fails
      RED with that remedy named rather than renaming automatically.
    value: ${{ steps.ship.outputs.conflict }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable

    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/cargo-publish-crate.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - name: Publish crate
      id: ship
      uses: pleme-io/actions/tatara-script@main
      with:
        working-directory: ${{ inputs.crate-path }}
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        NO_VERIFY: ${{ inputs.no-verify }}
