name: 'pleme-io · s3-mirror'
description: 'Mirror a local directory tree to S3 with --delete semantics (aws s3 sync).'
branding: { icon: 'upload', color: 'orange' }

inputs:
  source:
    required: true
  bucket:
    required: true
  key:
    required: true
  delete:
    required: false
    default: "false"

outputs:
  synced:
    value: ${{ steps.run.outputs.synced }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/s3-mirror.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SOURCE: ${{ inputs.source }}
        BUCKET: ${{ inputs.bucket }}
        KEY_ARG: ${{ inputs.key }}
        DELETE_FLAG: ${{ inputs.delete }}
