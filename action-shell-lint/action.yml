name: 'pleme-io · action-shell-lint'
description: 'Enforce the ★★ NO-SHELL directive on pleme-io/actions/* — scans every action.yml + counts shell-line bodies outside the canonical loader; rejects PRs that exceed threshold.'
branding: { icon: 'shield', color: 'red' }

inputs:
  threshold:
    description: "Max shell lines per action.yml outside the canonical loader block"
    required: false
    default: "10"
  paths:
    description: "Glob of action.yml files to scan"
    required: false
    default: "*/action.yml"
  fail-on-violation:
    required: false
    default: "true"

outputs:
  violations:
    value: ${{ steps.run.outputs.violations }}
  files-scanned:
    value: ${{ steps.run.outputs.files-scanned }}
  baseline-violations:
    description: "Count of already-tracked baseline violations found (reported, never failed)."
    value: ${{ steps.run.outputs.baseline-violations }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/action-shell-lint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        THRESHOLD: ${{ inputs.threshold }}
        PATHS: ${{ inputs.paths }}
        FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
