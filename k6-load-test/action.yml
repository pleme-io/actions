name: 'pleme-io · k6-load-test'
description: 'Run a k6 load test script + emit summary JSON. Pairs with thresholds for PR-time perf regression gating.'
branding: { icon: 'activity', color: 'red' }

inputs:
  script:
    required: true
    description: "Path to k6 .js script"
  vus:
    required: false
    default: "10"
  duration:
    required: false
    default: "30s"

outputs:
  passed:
    value: ${{ steps.run.outputs.passed }}
  summary-path:
    value: ${{ steps.run.outputs.summary-path }}

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@main
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/k6-load-test.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SCRIPT: ${{ inputs.script }}
        VUS: ${{ inputs.vus }}
        DURATION: ${{ inputs.duration }}
