name: 'pleme-io · ffmpeg-transcode'
description: 'Run ffmpeg transcode on input file(s).'
branding: { icon: 'video', color: 'purple' }

inputs:
  input:
    required: true
  output:
    required: true
  args:
    required: false
    default: "-c:v libx264 -preset fast"

outputs:
  output-path:
    value: ${{ steps.run.outputs.output-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/ffmpeg-transcode.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        INPUT_ARG: ${{ inputs.input }}
        OUTPUT_ARG: ${{ inputs.output }}
        ARGS: ${{ inputs.args }}
