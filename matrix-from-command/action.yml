name: 'pleme-io · matrix-from-command'
description: >-
  Run a command that prints a JSON array and expose it as a job matrix. The
  command is argv (program + newline-separated args), never a shell string.
  Outputs the rows as canonical JSON, a strategy.matrix object
  {"include": rows}, and the row count. Fails when the command fails, its
  stdout is not a JSON array, or the array is empty (unless allowed).
branding: { icon: 'grid', color: 'blue' }

inputs:
  program:
    description: 'The executable. Passed as argv[0]; a shell is never used.'
    required: true
  args:
    description: 'Newline-separated arguments, so an argument containing a space needs no quoting.'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run the command in.'
    required: false
    default: '.'
  require-nonempty:
    description: 'true fails on an empty array (an empty include fails the consuming job anyway). false emits it with reason empty.'
    required: false
    default: 'true'
  blue:
    description: 'The blue flake blue-setup installs when blue is not on PATH.'
    required: false
    default: 'github:pleme-io/blue'
  github-token:
    description: 'Passed to blue-setup for private flakes.'
    required: false
    default: ''

outputs:
  rows:
    description: 'The array as canonical JSON. Use fromJSON(rows) as one matrix axis when rows are scalars.'
    value: ${{ steps.run.outputs.rows }}
  matrix:
    description: 'The strategy.matrix object {"include": rows}, for rows that are objects; consume with fromJSON.'
    value: ${{ steps.run.outputs.matrix }}
  count:
    description: 'Number of rows.'
    value: ${{ steps.run.outputs.count }}
  reason:
    description: 'ok | empty | command-failed | not-json | not-array | no-program'
    value: ${{ steps.run.outputs.reason }}

runs:
  using: composite
  steps:
    - id: has
      shell: bash
      run: if command -v blue >/dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.has.outputs.found != 'true'
      uses: pleme-io/actions/blue-setup@main
      with:
        blue: ${{ inputs.blue }}
        github-token: ${{ inputs.github-token }}
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PROGRAM: ${{ inputs.program }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_REQUIRE_NONEMPTY: ${{ inputs.require-nonempty }}
      run: blue run "${{ github.action_path }}/run.b"
