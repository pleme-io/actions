name: 'pleme-io · nx-affected-test'
description: 'Run nx affected:test for incremental CI.'
branding: { icon: 'check-circle', color: 'blue' }

inputs:
  base:
    required: false
    default: "main"
  workdir:
    required: false
    default: "."

outputs:
  passed:
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/nx-affected-test.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        BASE: ${{ inputs.base }}
        WORKDIR: ${{ inputs.workdir }}
