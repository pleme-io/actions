name: 'pleme-io · commitlint'
description: 'Validate commit messages against Conventional Commits over a git range.'
branding: { icon: 'check-circle', color: 'gray-dark' }

inputs:
  from-ref:
    required: false
    default: "main"
  to-ref:
    required: false
    default: "HEAD"
  types:
    description: 'Comma-separated allowed types. Empty = the config-conventional set.'
    required: false
    default: ""
  scopes:
    description: 'Comma-separated allowed scopes. Empty = any scope.'
    required: false
    default: ""
  max-subject-length:
    description: 'header-max-length. Default matches config-conventional.'
    required: false
    default: "100"
  require-commits:
    description: 'Fail when the range yields zero lintable commits. A gate that examined nothing has not passed.'
    required: false
    default: "true"

outputs:
  violations:
    description: 'Violation count, or "unknown" when the scan itself failed. Never 0 on a broken run.'
    value: ${{ steps.run.outputs.violations }}
  commits-scanned:
    description: 'Lintable commits examined (merge/revert subjects excluded).'
    value: ${{ steps.run.outputs.commits-scanned }}

runs:
  using: composite
  steps:
    # NO `actions/checkout` step here, deliberately — the template
    # (branch-protect-sync) has one because it reads a spec FILE, and this
    # action reads the CALLER'S git history. A composite action that
    # re-checks-out silently discards the caller's ref, depth, submodules and
    # token, so the gate would lint a different range than the workflow chose.
    # The caller owns the checkout and needs `fetch-depth: 0` on it, since the
    # default depth-1 does not fetch the base branch; run.tlisp refuses an
    # unresolvable range with that exact diagnostic rather than reporting the
    # missing base ref as "no commits, clean".
    - id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/commitlint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        FROM_REF: ${{ inputs.from-ref }}
        TO_REF: ${{ inputs.to-ref }}
        TYPES: ${{ inputs.types }}
        SCOPES: ${{ inputs.scopes }}
        MAX_SUBJECT_LENGTH: ${{ inputs.max-subject-length }}
        REQUIRE_COMMITS: ${{ inputs.require-commits }}
