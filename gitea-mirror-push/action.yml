name: 'pleme-io · gitea-mirror-push'
description: 'Mirror push the repo to a Gitea instance.'
branding: { icon: 'upload', color: 'green' }

inputs:
  gitea-url:
    required: true
  token:
    required: true
  repo-path:
    required: true

outputs:
  pushed:
    value: ${{ steps.run.outputs.pushed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/gitea-mirror-push.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        GITEA_URL: ${{ inputs.gitea-url }}
        TOKEN: ${{ inputs.token }}
        REPO_PATH: ${{ inputs.repo-path }}
