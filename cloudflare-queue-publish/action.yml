name: 'pleme-io · cloudflare-queue-publish'
description: 'Publish a message to a Cloudflare Queue.'
branding: { icon: 'message-circle', color: 'orange' }

inputs:
  queue-name:
    required: true
  message:
    required: true

outputs:
  published:
    value: ${{ steps.run.outputs.published }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        QUEUE_NAME: ${{ inputs.queue-name }}
        MESSAGE: ${{ inputs.message }}
