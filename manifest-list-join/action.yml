name: 'pleme-io · manifest-list-join'
description: 'Compose separately-pushed per-arch images (amd64=<ref>,arm64=<ref>) into one multi-arch OCI image index and push it under the multi-arch deploy coordinate r<run>-<sha>; report the index digest — the single exact coordinate an environment pins.'
branding:
  icon: 'layers'
  color: 'purple'

inputs:
  registry:
    description: "Cluster Zot host:port (used when repo is empty)"
    required: false
    default: "zot.zot-system.svc.cluster.local:5000"
  repo:
    description: "Full base override '<host>/<repo>' (no tag). Wins when set."
    required: false
    default: ""
  image:
    description: "Repo path override '<repo>' (composed with registry when repo empty)"
    required: false
    default: ""
  svc:
    description: "Akeyless service name (auth|uam|…); composes 'akeyless-<svc>'"
    required: false
    default: ""
  arch-refs:
    description: "Per-arch refs to join: 'amd64=<ref>,arm64=<ref>' (from zot-push outputs)"
    required: true
  tag:
    description: "Explicit index tag; else composed r<run>-<sha>"
    required: false
    default: ""
  run-number:
    description: "github.run_number (for the composed r<run>-<sha> index tag)"
    required: false
    default: ""
  sha:
    description: "github.sha (for the composed r<run>-<sha> index tag)"
    required: false
    default: ""
  insecure:
    description: "Cluster-internal Zot is http/self-signed (default 'true'). For regctl this is the CA-cert-fetch-failed fallback (real, logged degradation); for buildah/podman a real --tls-verify=false; a documented no-op for docker."
    required: false
    default: "true"
  dest-user:
    description: "Registry push credential username (required — Zot's authz rejects anonymous manifest-index writes the same way it rejects anonymous blob pushes; same input shape as zot-push's dest-user)"
    required: true
  dest-pass:
    description: "Registry push credential password (required — see dest-user)"
    required: true
  tool:
    description: "Manifest tool: auto | regctl | buildah | podman | docker"
    required: false
    default: "auto"
  ca-cert-url:
    description: "Raw URL of the pinned CA/leaf cert (PEM) the regctl path trusts -- default points at the committed cert for this cluster's in-pod Zot TLS (the same cert zot-push already trusts)"
    required: false
    default: "https://raw.githubusercontent.com/pleme-io/akeyless-k8s/main/clusters/camelot-eks/infrastructure/zot/zot-ca.crt"
  ca-cert-path:
    description: "Local path the fetched CA cert is written to -- distinct default from zot-push's own so one job step never clobbers the other's cached fetch"
    required: false
    default: "/tmp/manifest-list-join-ca.crt"
  ca-cert-token:
    description: "GitHub token with read access to ca-cert-url's repo -- REQUIRED when that repo is private (the default ca-cert-url points at the private pleme-io/akeyless-k8s; an unauthenticated fetch 404s). Empty (default) keeps the unauthenticated path for a public cert URL."
    required: false
    default: ""
  regctl-ref:
    description: "The regctl flake ref `nix run` resolves when regctl is NOT baked into the runner image. Same shape and same purpose as zot-push's doca-ref. Default is the exact-pinned nixos-24.05 channel the deleted `nix profile install` step used, so the resolved binary is unchanged -- only the install-vs-run mechanism is."
    required: false
    default: "github:NixOS/nixpkgs/nixos-24.05#regctl"
  doca-ref:
    description: "The doca (oci-push) flake ref `nix run` resolves for the index-digest readback when doca is NOT baked. Matches zot-push's input of the same name; it was already read by the shared stdlib (oci:doca-argv) but this action never exposed it, so a consumer could not pin or fork it."
    required: false
    default: "github:pleme-io/substrate#oci-push"

outputs:
  index-ref:
    description: "Full pushed multi-arch index ref <base>:r<run>-<sha>"
    value: ${{ steps.run.outputs.index-ref }}
  index-digest:
    description: "The index digest (sha256:…) — the single exact multi-arch deploy coordinate"
    value: ${{ steps.run.outputs.index-digest }}
  arches:
    description: "Space-joined arches folded into the index (e.g. 'amd64 arm64')"
    value: ${{ steps.run.outputs.arches }}
  joined:
    description: "'true' iff the index was composed + pushed"
    value: ${{ steps.run.outputs.joined }}
  reason:
    description: "Typed discriminant: joined | single-arch | no-refs | need-target | need-tag | no-tool | join-fail"
    value: ${{ steps.run.outputs.reason }}

runs:
  using: composite
  steps:
    # PINNED 2026-08-08. This was `@main` -- an unpinned third-party action, so
    # every run executed whatever that branch happened to hold, in a step that
    # installs a package manager onto the runner. The SHA below is the same one
    # caixa-render/action.yml already pins in this repo (v22), so this is
    # matching an in-repo precedent, not inventing a version.
    #
    # Still needed after the regctl-install step below was deleted: BOTH doca
    # (oci:doca-argv) and regctl (mlj:regctl-argv) fall back to `nix run` when
    # they are not baked into the runner image. Baking them is what finally
    # removes this step.
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # ── skopeo REMOVED 2026-07-31 (fleet-wide doca conversion) ───────────────
    # This step was the last `nix profile install` of skopeo in this repo, and
    # it was a HERMETIC SUPPLY CHAIN violation regardless of being Nix-pinned:
    # it RESOLVED AND FETCHED a third-party artifact at job time. Pinning the
    # nixpkgs rev makes the fetch reproducible; it does not make it hermetic.
    #
    # skopeo was used here for exactly ONE thing -- resolving the pushed
    # index's digest (`skopeo inspect --format {{.Digest}}`). doca's
    # `inspect --ref <r> --digest-only` is a functional match, and doca is
    # already resolved by every converted sibling, so nothing is installed.
    #
    # The resolution + the call now live in _tlisp-stdlib as
    # `oci:doca-argv` / `oci:doca-remote-digest`, because zot-pull-scan and
    # zot-push had each inlined the same baked-or-`nix run` logic and this
    # would have been the third copy. Same >=2-consumer rule that already
    # governs oci:split-registry in that file.

    # ── "Ensure regctl" REMOVED 2026-08-08 (deshellify) ─────────────────────
    # It ran
    #   command -v regctl >/dev/null 2>&1 || nix profile install …#regctl
    # which was TWO defects in one line. It was this action's entire remaining
    # non-loader shell body (11 lines, over action-shell-lint's threshold of
    # 10 -- and this action was never on that lint's baseline, so it was an
    # untracked live violation, not accepted debt). And `nix profile install`
    # is the same ★★ HERMETIC SUPPLY CHAIN violation the skopeo step above was
    # deleted for six weeks earlier: an imperative, job-time install of a
    # third-party binary that MUTATES the runner's nix profile. Exact-pinning
    # the channel makes the fetch reproducible; it does not make it hermetic,
    # and it does not undo the mutation.
    #
    # regctl is now resolved inside run.tlisp by `mlj:regctl-argv`, exactly the
    # way the stdlib's `oci:doca-argv` resolves doca: a BAKED `regctl` on PATH
    # wins, `nix run ${REGCTL_REF}` is the fallback, and which one was taken is
    # LOGGED (`mlj:regctl-source-note`) so the weaker path is never silent.
    # Baking regctl into the camelot ARC runner image is what closes it fully.
    #
    # The fallback also got four times cheaper in the same change: writing
    # regctl's credential/trust config as a file (REGCTL_CONFIG) collapsed
    # `registry set --cacert` + `registry set --tls` + `registry login` +
    # `index create` down to a single `index create`.

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        DEST="${RUNNER_TEMP}/manifest-list-join-composed.tlisp"
        cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp" > "$DEST"
        echo >> "$DEST"
        cat ${{ github.action_path }}/run.tlisp >> "$DEST"
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.path }}
      env:
        # `nix run` needs the same feature gate `nix build` does on a
        # self-hosted runner whose baked nix.conf predates flakes -- matches
        # zot-push's own doca step, the proven precedent in this repo. Both
        # the doca and the regctl fallbacks go through `nix run`.
        NIX_CONFIG: "experimental-features = nix-command flakes"
        REGISTRY: ${{ inputs.registry }}
        REPO: ${{ inputs.repo }}
        IMAGE: ${{ inputs.image }}
        SVC: ${{ inputs.svc }}
        ARCH_REFS: ${{ inputs.arch-refs }}
        TAG: ${{ inputs.tag }}
        RUN_NUMBER: ${{ inputs.run-number }}
        SHA: ${{ inputs.sha }}
        INSECURE: ${{ inputs.insecure }}
        DEST_USER: ${{ inputs.dest-user }}
        DEST_PASS: ${{ inputs.dest-pass }}
        TOOL: ${{ inputs.tool }}
        CA_CERT_URL: ${{ inputs.ca-cert-url }}
        CA_CERT_PATH: ${{ inputs.ca-cert-path }}
        CA_CERT_TOKEN: ${{ inputs.ca-cert-token }}
        REGCTL_REF: ${{ inputs.regctl-ref }}
        DOCA_REF: ${{ inputs.doca-ref }}
