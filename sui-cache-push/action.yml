name: 'pleme-io · sui-cache-push'
description: 'Push built store paths (and their closures) into a remote sui binary cache over HTTP, signed with the uploader key the origin trusts. The pleme-io cache plane is sui; this replaces nix-cachix-push and nix-attic-push. A failed push is a warning unless required is "true".'
branding: { icon: 'upload-cloud', color: 'blue' }

inputs:
  paths:
    description: 'Store paths to push, separated by whitespace or newlines (e.g. the out-path output of nix-build).'
    required: true
  cache-url:
    description: 'The sui origin, e.g. http://rio:5000. Empty falls back to the runner environment SUI_CACHE_URL, which the fleet runner pools export.'
    required: false
    default: ''
  signing-key-file:
    description: 'Path of the uploader ed25519 secret key the origin lists with --upload-key. Empty falls back to signing-key, then to the runner environment SUI_CACHE_SIGNING_KEY_FILE.'
    required: false
    default: ''
  signing-key:
    description: 'The uploader secret key contents, from a secret. Written to a 0600 file under RUNNER_TEMP, removed after the push, never logged.'
    required: false
    default: ''
  recursive:
    description: 'Push each path''s whole closure ("true") or only the named paths.'
    required: false
    default: 'true'
  required:
    description: 'The literal "true" fails the step when the push fails or cannot run; otherwise it is a warning. A cache that is down or switched off is a skip, never a failure.'
    required: false
    default: 'false'
  cache:
    description: 'auto (default): probe the origin first and push only when it answers. on: no probe. off: no push. Workflow environment: SUI_CACHE. See sui-cache-probe.'
    required: false
    default: ''
  cache-probe-timeout:
    description: 'Whole seconds the probe may take. Default 2. Workflow environment: SUI_CACHE_PROBE_TIMEOUT.'
    required: false
    default: ''
  cache-push:
    description: 'auto (default): push when the cache is up. on: push whatever the probe says. off: never push. Workflow environment: SUI_CACHE_PUSH.'
    required: false
    default: ''
  cache-push-timeout:
    description: 'Whole seconds the push may run before it is stopped and reported. Default 1200. Workflow environment: SUI_CACHE_PUSH_TIMEOUT.'
    required: false
    default: ''

outputs:
  pushed:
    description: '"true" when sui cache push succeeded for every path.'
    value: ${{ steps.run.outputs.pushed }}
  reason:
    description: 'Why pushed is "false": no paths, no cache url, no signing key, the cache gate (down, off), sui not on PATH, a timeout, or the push exit status and stderr.'
    value: ${{ steps.run.outputs.reason }}
  cache-state:
    description: 'The sui-cache-probe state: up, down, off, on, absent or unprobed.'
    value: ${{ steps.gate.outputs.state }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/sui-cache-push.tlisp"
        {
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: gate
      uses: pleme-io/actions/sui-cache-probe@main
      with:
        cache: ${{ inputs.cache }}
        cache-probe-timeout: ${{ inputs.cache-probe-timeout }}
        cache-push: ${{ inputs.cache-push }}
        cache-url: ${{ inputs.cache-url }}
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PUSH_PATHS: ${{ inputs.paths }}
        CACHE_URL: ${{ inputs.cache-url }}
        SIGNING_KEY_FILE: ${{ inputs.signing-key-file }}
        SIGNING_KEY: ${{ inputs.signing-key }}
        RECURSIVE: ${{ inputs.recursive }}
        REQUIRED: ${{ inputs.required }}
        GATE_PUSH: ${{ steps.gate.outputs.push }}
        GATE_REASON: ${{ steps.gate.outputs.reason }}
        CACHE_PUSH_TIMEOUT: ${{ inputs.cache-push-timeout }}
