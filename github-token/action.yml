name: 'pleme-io · github-token'
description: >-
  Resolve the GitHub token a job presents for cross-repo reads and pushes. The
  default source, app, reads the short-lived installation token the runner
  host mints from the fleet App (GITHUB_APP_TOKEN_DIR, pleme.nixos.githubRunners);
  where there is none, or it is near expiry, the output is empty and nix reads
  public repos anonymously. A long-lived PAT is the opt-in source pat, never
  the default.
branding: { icon: 'lock', color: 'purple' }

inputs:
  source:
    description: "app (host-minted App token, the default), pat (the pat input), or none."
    required: false
    default: "app"
  pat:
    description: "The PAT presented only when source is pat, e.g. secrets.BOT_PAT."
    required: false
    default: ""
  app-id:
    description: "With app-private-key, a job on a runner whose host mints no token mints one itself from this App (actions/create-github-app-token), scoped to the repository owner's whole installation. Empty (the default) changes nothing."
    required: false
    default: ""
  app-private-key:
    description: "The App's private key, e.g. secrets.PUBLISH_APP_KEY. Used only with app-id, only when source is app, and only where GITHUB_APP_TOKEN_DIR is unset."
    required: false
    default: ""
  app-permission-contents:
    description: "contents permission the job-minted token requests: read or write."
    required: false
    default: "read"
  app-permission-packages:
    description: "packages permission the job-minted token requests: read or write."
    required: false
    default: "read"
  min-remaining-seconds:
    description: "A host token expiring sooner than this is not presented."
    required: false
    default: "600"

outputs:
  token:
    description: "The token, masked; empty when there is none to present."
    value: ${{ steps.run.outputs.token }}
  source:
    description: "app | pat | none: what the token is."
    value: ${{ steps.run.outputs.source }}
  expires-at:
    description: "Epoch seconds the app token expires; empty for pat and none."
    value: ${{ steps.run.outputs.expires-at }}
  app-token:
    description: "The token only when source resolved to app, else empty: the app-token rung of registry-login."
    value: ${{ steps.run.outputs.source == 'app' && steps.run.outputs.token || '' }}
  pat:
    description: "The token only when source resolved to pat, else empty: the bot-pat rung of git-credentials and registry-login, so a dead PAT never outranks GITHUB_TOKEN unless asked for."
    value: ${{ steps.run.outputs.source == 'pat' && steps.run.outputs.token || '' }}

runs:
  using: composite
  steps:
    - id: mint
      if: inputs.source == 'app' && inputs.app-id != '' && inputs.app-private-key != '' && env.GITHUB_APP_TOKEN_DIR == ''
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ github.repository_owner }}
        permission-contents: ${{ inputs.app-permission-contents }}
        permission-packages: ${{ inputs.app-permission-packages }}
        permission-metadata: read
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/github-token.tlisp"
        {
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SOURCE: ${{ inputs.source }}
        PAT: ${{ inputs.pat }}
        MIN_REMAINING_SECONDS: ${{ inputs.min-remaining-seconds }}
        MINTED_TOKEN: ${{ steps.mint.outputs.token }}
