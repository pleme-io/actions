name: 'pleme-io · skopeo-copy [RETIRED]'
description: 'RETIRED 2026-07-31 — zero consumers fleet-wide, measured with a control (actions/oci-image-push@ returns 3 in substrate, so the probe reads these repos correctly; actions/skopeo-copy@ returns 0 everywhere). Use pleme-io/actions/oci-image-push (doca: pure-Rust, per-call auth, retry-on-transient) or doca transfer for registry-to-registry. Kept, not deleted, per MODULARIZE-DON''T-DELETE. Historically: copied an OCI image between registries via skopeo copy.'
branding: { icon: 'upload', color: 'blue' }

inputs:
  source:
    required: true
  dest:
    required: true

outputs:
  copied:
    value: ${{ steps.run.outputs.copied }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          curl -sL https://raw.githubusercontent.com/pleme-io/actions/main/_tlisp-stdlib/stdlib.tlisp
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        SOURCE: ${{ inputs.source }}
        DEST: ${{ inputs.dest }}
