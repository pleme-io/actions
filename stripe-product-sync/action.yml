name: 'pleme-io · stripe-product-sync'
description: 'Sync products from a typed YAML to Stripe.'
branding: { icon: 'refresh-cw', color: 'purple' }

inputs:
  spec-file:
    required: false
    default: "stripe-products.yaml"
  api-key:
    required: true

outputs:
  synced-count:
    value: ${{ steps.run.outputs.synced-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/stripe-product-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SPEC_FILE: ${{ inputs.spec-file }}
        API_KEY: ${{ inputs.api-key }}
