name: 'pleme-io · tatara-script'
description: 'Execute an embedded .tlisp source string with tatara-script (binary-first, nix-install fallback)'
branding:
  icon: 'play'
  color: 'green'

inputs:
  script:
    description: "Multi-line .tlisp source executed by tatara-script (the entire body of a .tlisp file)"
    required: true
  version:
    description: "tatara-lisp release tag (e.g. v0.1.0) or 'latest'"
    required: false
    # Phase 0 freeze (theory/TATARA-LISP-CONSOLIDATION.md): pinned off
    # 'latest' so a tatara-lisp release cannot reach 315 action.yml
    # consumers unreviewed. v0.2.5 is what 'latest' resolves to today,
    # so this is a no-op now and a guardrail during the consolidation.
    default: v0.2.5
  args:
    description: "Positional arguments passed to the script (forwarded as $@ after the script file)"
    required: false
    default: ""
  working-directory:
    description: >-
      Directory to run the script from. Defaults to "." — the repo root —
      so every existing caller behaves EXACTLY as before; this input is
      additive, not a behaviour change.

      Exists because several tlisp scripts operate on repo-root-relative
      paths (cargo-bump reads ./Cargo.toml, for instance) and so could not
      serve a repo whose crate does not live at the root. Rather than
      teach each script its own path handling, the working directory is
      set once, here, where the process is actually spawned.
    required: false
    default: "."

# Composite-action outputs are explicit forwards, not wildcards.
# Tatara-script declares the well-known output names that callers
# may consume from a tlisp script's $GITHUB_OUTPUT writes. If a new
# output key is needed, add it here so the forward exists.
outputs:
  version:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: version)"
    value: ${{ steps.exec.outputs.version }}
  bumped:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: bumped)"
    value: ${{ steps.exec.outputs.bumped }}
  new-version:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: new-version)"
    value: ${{ steps.exec.outputs.new-version }}
  repo-type:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: repo-type) — detect-repo-type's typed identifier. Without this entry the key is silently dropped at the composite boundary and every consumer reads an empty string."
    value: ${{ steps.exec.outputs.repo-type }}
  manifest-path:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: manifest-path) — the manifest that drove detect-repo-type's answer."
    value: ${{ steps.exec.outputs.manifest-path }}
  result:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: result) — generic catch-all"
    value: ${{ steps.exec.outputs.result }}
  matrix:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: matrix) — the build-matrix image×arch GHA matrix JSON"
    value: ${{ steps.exec.outputs.matrix }}
  count:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: count) — a row/item count (e.g. build-matrix rows)"
    value: ${{ steps.exec.outputs.count }}
  out-path:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: out-path) — nix-build's built store path. Missing since nix-build's own inception (2026-07-14 discovery: cartorio-attest's nix-closure-info-path silently received an empty string from every nix-build consumer, on both @main and @v1, because this key was never added here)"
    value: ${{ steps.exec.outputs.out-path }}
  # Delivery-leg keys (super-cache-ci): nix-image / ghcr-publish / zot-pull-scan
  # (+ image-scan's severity/vuln-count). A composite action forwards only
  # DECLARED keys, so these must live here for the scripts' outputs to reach
  # a consumer workflow. Added per this file's own "add it here" convention.
  tarball-amd64:
    description: "Forwarded (key: tarball-amd64) — nix-image amd64 tarball path"
    value: ${{ steps.exec.outputs.tarball-amd64 }}
  tarball-arm64:
    description: "Forwarded (key: tarball-arm64) — nix-image arm64 tarball path"
    value: ${{ steps.exec.outputs.tarball-arm64 }}
  tarballs:
    description: "Forwarded (key: tarballs) — nix-image 'arch:path' list"
    value: ${{ steps.exec.outputs.tarballs }}
  via-service:
    description: "Forwarded (key: via-service) — nix-image sui-served flag"
    value: ${{ steps.exec.outputs.via-service }}
  built:
    description: "Forwarded (key: built) — nix-image all-arches-built flag"
    value: ${{ steps.exec.outputs.built }}
  tag:
    description: "Forwarded (key: tag) — ghcr-publish exact AUTOBUMP tag"
    value: ${{ steps.exec.outputs.tag }}
  ref:
    description: "Forwarded (key: ref) — ghcr-publish full pushed ref"
    value: ${{ steps.exec.outputs.ref }}
  ref-amd64:
    description: "Forwarded (key: ref-amd64) — ghcr-publish amd64 ref"
    value: ${{ steps.exec.outputs.ref-amd64 }}
  ref-arm64:
    description: "Forwarded (key: ref-arm64) — ghcr-publish arm64 ref"
    value: ${{ steps.exec.outputs.ref-arm64 }}
  pushed:
    description: "Forwarded (key: pushed) — ghcr-publish push-success flag"
    value: ${{ steps.exec.outputs.pushed }}
  admitted:
    description: "Forwarded (key: admitted) — zot-pull-scan faucet admission flag"
    value: ${{ steps.exec.outputs.admitted }}
  severity:
    description: "Forwarded (key: severity) — image-scan / zot-pull-scan highest severity"
    value: ${{ steps.exec.outputs.severity }}
  vuln-count:
    description: "Forwarded (key: vuln-count) — image-scan / zot-pull-scan vuln count"
    value: ${{ steps.exec.outputs.vuln-count }}
  local-archive:
    description: "Forwarded (key: local-archive) — zot-pull-scan pulled archive path"
    value: ${{ steps.exec.outputs.local-archive }}
  # super-cache-ci preflight/attest keys: breathe-runner + tameshi-attest.
  runner-ok:
    description: "Forwarded (key: runner-ok) — breathe-runner posture-ok flag"
    value: ${{ steps.exec.outputs.runner-ok }}
  capacity-type:
    description: "Forwarded (key: capacity-type) — breathe-runner spot|on-demand|unknown"
    value: ${{ steps.exec.outputs.capacity-type }}
  node-group:
    description: "Forwarded (key: node-group) — breathe-runner camelot node-group"
    value: ${{ steps.exec.outputs.node-group }}
  scale-to-zero:
    description: "Forwarded (key: scale-to-zero) — breathe-runner scale-to-zero tri-state"
    value: ${{ steps.exec.outputs.scale-to-zero }}
  drain-armed:
    description: "Forwarded (key: drain-armed) — breathe-runner retirada drain-armed flag"
    value: ${{ steps.exec.outputs.drain-armed }}
  attested:
    description: "Forwarded (key: attested) — tameshi-attest receipt-assembled flag"
    value: ${{ steps.exec.outputs.attested }}
  receipt-path:
    description: "Forwarded (key: receipt-path) — tameshi-attest receipt JSON path"
    value: ${{ steps.exec.outputs.receipt-path }}
  receipt-hash:
    description: "Forwarded (key: receipt-hash) — tameshi-attest BLAKE3 receipt hash"
    value: ${{ steps.exec.outputs.receipt-hash }}
  receipt-algo:
    description: "Forwarded (key: receipt-algo) — tameshi-attest hash algorithm (blake3)"
    value: ${{ steps.exec.outputs.receipt-algo }}
  signed:
    description: "Forwarded (key: signed) — tameshi-attest Ed25519-signed flag"
    value: ${{ steps.exec.outputs.signed }}
  outcome-chain:
    description: "Forwarded (key: outcome-chain) — tameshi-attest kensa OutcomeChain flag"
    value: ${{ steps.exec.outputs.outcome-chain }}
  # super-cache-ci service + cache + spec keys: sui-service-up /
  # super-cache-restore / super-cache-build / super-cache-save /
  # gen-build-spec. A composite forwards only DECLARED keys, so the
  # reference pipeline's step-to-step output threading (endpoint -> restore
  # -> build -> save -> attest) is always-empty until these live here.
  # Added per this file's own "add it here" convention (additive; the keys
  # are disjoint from the delivery-leg + preflight/attest sets above).
  endpoint:
    description: "Forwarded (key: endpoint) — sui-service-up resolved service endpoint"
    value: ${{ steps.exec.outputs.endpoint }}
  store-backend:
    description: "Forwarded (key: store-backend) — sui-service-up durable store tier"
    value: ${{ steps.exec.outputs.store-backend }}
  cache-backend:
    description: "Forwarded (key: cache-backend) — sui-service-up hot cache tier"
    value: ${{ steps.exec.outputs.cache-backend }}
  sandbox:
    description: "Forwarded (key: sandbox) — sui-service-up build sandbox (tmpfs|disk)"
    value: ${{ steps.exec.outputs.sandbox }}
  never-touch-disk:
    description: "Forwarded (key: never-touch-disk) — computed postgres∧redis∧tmpfs predicate"
    value: ${{ steps.exec.outputs.never-touch-disk }}
  up:
    description: "Forwarded (key: up) — sui-service-up endpoint-reachable flag"
    value: ${{ steps.exec.outputs.up }}
  reason:
    description: "Forwarded (key: reason) — a shared typed why-string key, consumers disjoint: service/cache/spec verbs' outcome reason, OR aldrava-dispatch/aldrava-resolve's rejection/no-match/not-running reason"
    value: ${{ steps.exec.outputs.reason }}
  cache-hit:
    description: "Forwarded (key: cache-hit) — super-cache-restore warm-path hit flag"
    value: ${{ steps.exec.outputs.cache-hit }}
  hit-tier:
    description: "Forwarded (key: hit-tier) — super-cache-restore tier (redis|pg|object|miss)"
    value: ${{ steps.exec.outputs.hit-tier }}
  key:
    description: "Forwarded (key: key) — content-addressed super-cache key threaded restore->build->save"
    value: ${{ steps.exec.outputs.key }}
  outputs:
    description: "Forwarded (key: outputs) — restored/built store-path list"
    value: ${{ steps.exec.outputs.outputs }}
  from-cache:
    description: "Forwarded (key: from-cache) — super-cache-build served-from-cache flag"
    value: ${{ steps.exec.outputs.from-cache }}
  output-hashes:
    description: "Forwarded (key: output-hashes) — super-cache-build BLAKE3 output hashes"
    value: ${{ steps.exec.outputs.output-hashes }}
  eval-ms:
    description: "Forwarded (key: eval-ms) — super-cache-build RAM eval time"
    value: ${{ steps.exec.outputs.eval-ms }}
  build-ms:
    description: "Forwarded (key: build-ms) — super-cache-build derive time"
    value: ${{ steps.exec.outputs.build-ms }}
  saved:
    description: "Forwarded (key: saved) — super-cache-save newly-persisted flag"
    value: ${{ steps.exec.outputs.saved }}
  skipped:
    description: "Forwarded (key: skipped) — super-cache-save write-if-absent idempotent skip"
    value: ${{ steps.exec.outputs.skipped }}
  tier:
    description: "Forwarded (key: tier) — super-cache-save durable tier that accepted the write"
    value: ${{ steps.exec.outputs.tier }}
  lang:
    description: "Forwarded (key: lang) — gen-build-spec resolved language"
    value: ${{ steps.exec.outputs.lang }}
  spec-path:
    description: "Forwarded (key: spec-path) — gen-build-spec typed build-spec path"
    value: ${{ steps.exec.outputs.spec-path }}
  spec-hash:
    description: "Forwarded (key: spec-hash) — gen-build-spec build-spec content-address"
    value: ${{ steps.exec.outputs.spec-hash }}
  regenerated:
    description: "Forwarded (key: regenerated) — gen-build-spec did-gen-run flag"
    value: ${{ steps.exec.outputs.regenerated }}
  stale:
    description: "Forwarded (key: stale) — gen-build-spec spec-drift flag"
    value: ${{ steps.exec.outputs.stale }}
  changed:
    description: "Forwarded (key: changed) — gen-build-spec spec-content-changed flag; also spec-watch's own upstream-sha-differs flag (same key, disjoint consumers)"
    value: ${{ steps.exec.outputs.changed }}
  new-sha:
    description: "Forwarded (key: new-sha) — spec-watch sha256 of the upstream spec fetched this run"
    value: ${{ steps.exec.outputs.new-sha }}
  cached-sha:
    description: "Forwarded (key: cached-sha) — spec-watch sha256 previously stored in the cache file"
    value: ${{ steps.exec.outputs.cached-sha }}
  # super-cache-ci warm + remote-execution leg: sui-warm-hydrate /
  # sui-remote-build. A composite forwards only DECLARED keys; these are
  # disjoint from the sets above. Added per this file's "add it here"
  # convention. (endpoint / never-touch-disk / hit-tier / reason / built /
  # from-cache / outputs / output-hashes / eval-ms / build-ms already live
  # above.)
  warmed:
    description: "Forwarded (key: warmed) — sui-warm-hydrate real-warm flag (false until TieredBackend + warm-set RPC)"
    value: ${{ steps.exec.outputs.warmed }}
  warm-count:
    description: "Forwarded (key: warm-count) — sui-warm-hydrate count of keys actually warmed"
    value: ${{ steps.exec.outputs.warm-count }}
  worker:
    description: "Forwarded (key: worker) — sui-remote-build execution plane (reapi|local; local until the REAPI worker ships)"
    value: ${{ steps.exec.outputs.worker }}
  # super-cache-ci delivery/manifest/attest leg: zot-push +
  # manifest-list-join + cartorio-attest. A composite forwards only
  # DECLARED keys; these are disjoint from the sets above (tag / ref* /
  # pushed / reason and attested / receipt-* / signed / outcome-chain
  # already live above). Added per this file's "add it here" convention.
  digest:
    description: "Forwarded (key: digest) — zot-push pushed repository digest (exact deploy coord)"
    value: ${{ steps.exec.outputs.digest }}
  index-ref:
    description: "Forwarded (key: index-ref) — manifest-list-join multi-arch index ref"
    value: ${{ steps.exec.outputs.index-ref }}
  index-digest:
    description: "Forwarded (key: index-digest) — manifest-list-join index digest (exact multi-arch coord)"
    value: ${{ steps.exec.outputs.index-digest }}
  arches:
    description: "Forwarded (key: arches) — manifest-list-join arches folded into the index"
    value: ${{ steps.exec.outputs.arches }}
  joined:
    description: "Forwarded (key: joined) — manifest-list-join index-composed flag"
    value: ${{ steps.exec.outputs.joined }}
  sbom-path:
    description: "Forwarded (key: sbom-path) — cartorio-attest CycloneDX SBOM path"
    value: ${{ steps.exec.outputs.sbom-path }}
  sbom-format:
    description: "Forwarded (key: sbom-format) — cartorio-attest SBOM format (CycloneDX-1.5)"
    value: ${{ steps.exec.outputs.sbom-format }}
  sbom-components:
    description: "Forwarded (key: sbom-components) — cartorio-attest Nix-closure component count"
    value: ${{ steps.exec.outputs.sbom-components }}
  slsa-path:
    description: "Forwarded (key: slsa-path) — cartorio-attest SLSA provenance predicate path"
    value: ${{ steps.exec.outputs.slsa-path }}
  slsa-predicate-type:
    description: "Forwarded (key: slsa-predicate-type) — cartorio-attest SLSA predicate type"
    value: ${{ steps.exec.outputs.slsa-predicate-type }}
  # super-cache-ci per-package materializability gate: ferrite-check. A
  # composite forwards only DECLARED keys; these are disjoint from the sets
  # above (signed / outcome-chain / reason already live above; attr is
  # ferrite-specific). Added per this file's "add it here" convention.
  materializable:
    description: "Forwarded (key: materializable) — ferrite-check package-materializable verdict"
    value: ${{ steps.exec.outputs.materializable }}
  cached:
    description: "Forwarded (key: cached) — ferrite-check by-source-hash PoMS cache-hit flag (derive skippable)"
    value: ${{ steps.exec.outputs.cached }}
  source-hash:
    description: "Forwarded (key: source-hash) — ferrite-check content-addressed source/cache key"
    value: ${{ steps.exec.outputs.source-hash }}
  drv-path:
    description: "Forwarded (key: drv-path) — ferrite-check resolved .drv store path"
    value: ${{ steps.exec.outputs.drv-path }}
  attr:
    description: "Forwarded (key: attr) — ferrite-check resolved flake attr (template rendered)"
    value: ${{ steps.exec.outputs.attr }}
  poms-path:
    description: "Forwarded (key: poms-path) — ferrite-check emitted PoMS JSON path"
    value: ${{ steps.exec.outputs.poms-path }}
  poms-hash:
    description: "Forwarded (key: poms-hash) — ferrite-check real BLAKE3 PoMS receipt hash"
    value: ${{ steps.exec.outputs.poms-hash }}
  poms-algo:
    description: "Forwarded (key: poms-algo) — ferrite-check PoMS hash algorithm (blake3)"
    value: ${{ steps.exec.outputs.poms-algo }}
  # aldrava — comment-command dispatch (aldrava-dispatch / aldrava-resolve).
  dispatched:
    description: "Forwarded (key: dispatched) — aldrava-dispatch trusted-knock-matched flag"
    value: ${{ steps.exec.outputs.dispatched }}
  outcome:
    description: "Forwarded (key: outcome) — aldrava-dispatch dispatched|rejected|no-match|not-on-pull-request"
    value: ${{ steps.exec.outputs.outcome }}
  command:
    description: "Forwarded (key: command) — aldrava-dispatch matched command name"
    value: ${{ steps.exec.outputs.command }}
  args:
    description: "Forwarded (key: args) — aldrava-dispatch captured args, JSON array"
    value: ${{ steps.exec.outputs.args }}
  commenter:
    description: "Forwarded (key: commenter) — aldrava-dispatch knock author login"
    value: ${{ steps.exec.outputs.commenter }}
  checkout-ref:
    description: "Forwarded (key: checkout-ref) — aldrava-dispatch/aldrava-resolve resolved PR head SHA"
    value: ${{ steps.exec.outputs.checkout-ref }}
  branch-ref:
    description: "Forwarded (key: branch-ref) — aldrava-dispatch/aldrava-resolve resolved refs/heads/<head>"
    value: ${{ steps.exec.outputs.branch-ref }}
  base-ref:
    description: "Forwarded (key: base-ref) — aldrava-dispatch/aldrava-resolve resolved refs/heads/<base>"
    value: ${{ steps.exec.outputs.base-ref }}
  pr-author:
    description: "Forwarded (key: pr-author) — aldrava-dispatch/aldrava-resolve PR author login"
    value: ${{ steps.exec.outputs.pr-author }}
  is-develop:
    description: "Forwarded (key: is-develop) — aldrava-dispatch/aldrava-resolve head-branch-is-develop flag"
    value: ${{ steps.exec.outputs.is-develop }}
  target-kind:
    description: "Forwarded (key: target-kind) — aldrava-dispatch label|workflow-dispatch|repository-dispatch"
    value: ${{ steps.exec.outputs.target-kind }}
  target-detail:
    description: "Forwarded (key: target-detail) — aldrava-dispatch dispatched target's identifying value"
    value: ${{ steps.exec.outputs.target-detail }}
  should-run:
    description: "Forwarded (key: should-run) — aldrava-resolve run-context-resolved flag"
    value: ${{ steps.exec.outputs.should-run }}
  ok:
    description: "Forwarded (key: ok) — aldrava-lint catalog-parsed-cleanly flag"
    value: ${{ steps.exec.outputs.ok }}
  commands:
    description: "Forwarded (key: commands) — aldrava-lint registered command names, JSON array"
    value: ${{ steps.exec.outputs.commands }}
  error:
    description: "Forwarded (key: error) — aldrava-lint syntax/semantic error"
    value: ${{ steps.exec.outputs.error }}
  builder:
    description: "Forwarded (key: builder) — bigorna the buildx builder name that was set up"
    value: ${{ steps.exec.outputs.builder }}
  native-platforms:
    description: "Forwarded (key: native-platforms) — bigorna comma-joined platforms covered by a native node"
    value: ${{ steps.exec.outputs.native-platforms }}
  emulation:
    description: "Forwarded (key: emulation) — bigorna native-for-all | needs-native-node"
    value: ${{ steps.exec.outputs.emulation }}
  cache-from:
    description: "Forwarded (key: cache-from) — bigorna a --cache-from token fronting the sui store ('' when no cache front)"
    value: ${{ steps.exec.outputs.cache-from }}
  cache-to:
    description: "Forwarded (key: cache-to) — bigorna a --cache-to token fronting the sui store ('' when no cache front)"
    value: ${{ steps.exec.outputs.cache-to }}
  # runner-resolve — typed runs-on precedence resolver (override >
  # repo-committed config file > caller default). Added per this file's
  # own "add it here" convention.
  runner:
    description: "Forwarded (key: runner) — runner-resolve's resolved runs-on label"
    value: ${{ steps.exec.outputs.runner }}
  provenance:
    description: "Forwarded (key: provenance) — runner-resolve's winning tier (override|file|default)"
    value: ${{ steps.exec.outputs.provenance }}
  # ── baseline-debt lint family ───────────────────────────────────────
  # action-shell-lint / no-cve-suppression / runtime-install-lint /
  # breathe-band-lint (+ commitlint, conftest, conventional-commit-lint,
  # license-finder) all declare `violations` and forward it from
  # `steps.<id>.outputs.violations` — but the key was never declared HERE,
  # so every one of them has been resolving to an EMPTY STRING since it was
  # written. Exactly the same latent class as the `out-path` gap documented
  # above (a composite action forwards only DECLARED keys). Their exit codes
  # were always correct, so the gates themselves worked; only a workflow
  # trying to READ the count got nothing. Declaring the keys here repairs
  # all of them at the cause. Purely additive — adding an output declaration
  # cannot change any existing job's behaviour.
  violations:
    description: "Forwarded (key: violations) — count of NEW, non-baselined findings from a baseline-debt lint"
    value: ${{ steps.exec.outputs.violations }}
  baselined:
    description: "Forwarded (key: baselined) — count of findings matched against the tracked-debt baseline"
    value: ${{ steps.exec.outputs.baselined }}
  files-scanned:
    description: "Forwarded (key: files-scanned) — count of files a lint scanned"
    value: ${{ steps.exec.outputs.files-scanned }}
  workloads-scanned:
    description: "Forwarded (key: workloads-scanned) — breathe-band-lint: Deployments/StatefulSets/DaemonSets found in the tree"
    value: ${{ steps.exec.outputs.workloads-scanned }}
  bands-scanned:
    description: "Forwarded (key: bands-scanned) — breathe-band-lint: Cpu/Memory/StorageBands found in the tree"
    value: ${{ steps.exec.outputs.bands-scanned }}
  healthy:
    description: "Forwarded (key: healthy) — container-boot-check: did the image boot and pass its health check"
    value: ${{ steps.exec.outputs.healthy }}
  # ── rust-workspace-publish ──────────────────────────────────────────
  # Its `steps.ship` IS a tatara-script call, and its own action.yml
  # forwards all five of these from `steps.ship.outputs.<key>` — but they
  # were never declared HERE, so every one resolved to an EMPTY STRING.
  # The same latent class as `out-path` and the `violations` family above.
  # Receipt (2026-07-30): tatara-lisp v0.3.3 published all 17 members
  # successfully and the job STILL went red, because the script's own
  # output-contract guard correctly refused to let the drop pass silently
  # ("the script wrote output key(s) this action does not declare").
  # A green publish that reports red is the failure this repairs; the
  # publish itself was never broken. Purely additive.
  shipped-count:
    description: "Forwarded (key: shipped-count) — rust-workspace-publish: members successfully shipped"
    value: ${{ steps.exec.outputs.shipped-count }}
  renamed-crates:
    description: "Forwarded (key: renamed-crates) — rust-workspace-publish: crates auto-renamed on a name collision"
    value: ${{ steps.exec.outputs.renamed-crates }}
  pending-crates:
    description: "Forwarded (key: pending-crates) — rust-workspace-publish: crates left for the next capacity window (rate-limited / dep-deferred); empty when the bootstrap is complete"
    value: ${{ steps.exec.outputs.pending-crates }}
  failed-crates:
    description: "Forwarded (key: failed-crates) — rust-workspace-publish: crates that failed PERMANENTLY; a non-empty value means the step exited red"
    value: ${{ steps.exec.outputs.failed-crates }}
  bootstrap-complete:
    description: "Forwarded (key: bootstrap-complete) — rust-workspace-publish: true when every member is on the registry AND nothing failed permanently"
    value: ${{ steps.exec.outputs.bootstrap-complete }}

  # ── bulk declaration: every remaining key a sibling run.tlisp writes ──
  # A composite forwards ONLY declared keys, and tatara-script/action.yml's own
  # output-contract guard (line ~622, `|| exit 1`) is FATAL — so an undeclared
  # key does not merely resolve to "", it fails the step outright. Measured
  # 2026-07-30: 221 sibling dirs wrote 130 undeclared keys; 72 of those dirs are
  # real implementations (incl. cargo-publish-crate, cargo-publish-each-member,
  # super-cache-save, release-promote, attestation-gate), the other 149 are
  # `=stub` scaffolding that would fail the moment it was implemented.
  # Declared in bulk here rather than one incident at a time; this is the 5th
  # occurrence of the class (after out-path, the violations family, and
  # rust-workspace-publish's five). Purely additive.
  action-taken:
    description: "Forwarded (key: action-taken) — written by 2 action dir(s): issue-create, pr-comment"
    value: ${{ steps.exec.outputs.action-taken }}
  annotation-id:
    description: "Forwarded (key: annotation-id) — written by 1 action dir(s): grafana-annotation"
    value: ${{ steps.exec.outputs.annotation-id }}
  applied:
    description: "Forwarded (key: applied) — written by 12 action dir(s): atlas-migrate, branch-protect-sync, cloudflare-d1-migrate …"
    value: ${{ steps.exec.outputs.applied }}
  applied-count:
    description: "Forwarded (key: applied-count) — written by 2 action dir(s): db-migrate, kubectl-apply"
