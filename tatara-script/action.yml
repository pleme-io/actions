runs:
  using: composite
  steps:
    # Install path: try the pre-built binary from the release page first
    # (fast), fall back to a Nix-based install (`nix profile install
    # github:pleme-io/tatara-lisp/<tag>#tatara-script`) if the asset 404s.
    # This gives consumers a sensible behavior even before tatara-lisp
    # v0.1.0 is fully propagated to every arch, or if the consumer pins a
    # version that predates the binary-release workflow.
    - name: Install tatara-script
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Prefer a tatara-script already on PATH (baked into the runner image,
        # e.g. the nix-built pleme-io/arc-runner). Only resolve a tag + download
        # / nix-fallback-install when none is present. This is what lets pleme-io
        # tatara-lisp actions run NATIVELY on a pure-nix runner: the baked binary
        # short-circuits the FHS release download a nix image can't execve, and
        # skips the api.github.com/releases/latest call entirely.
        if command -v tatara-script >/dev/null 2>&1; then
          echo "Using pre-installed tatara-script: $(command -v tatara-script)"
          echo "bin-dir=$(dirname "$(command -v tatara-script)")" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        OS=$(uname -s)
        ARCH=$(uname -m)
        case "$OS-$ARCH" in
          Linux-x86_64)   SUFFIX="linux-x86_64";;
          Linux-aarch64)  SUFFIX="linux-aarch64";;
          Darwin-x86_64)  SUFFIX="macos-x86_64";;
          Darwin-arm64)   SUFFIX="macos-aarch64";;
          *) echo "::error::Unsupported runner: $OS-$ARCH" >&2; exit 1;;
        esac

        if [ "$INPUT_VERSION" = "latest" ]; then
          # Authenticate the API call — unauth from GHA runner IPs
          # gets rate-limited hard (60 req/hr shared across the whole
          # runner pool) and returns an empty/error JSON that yields
          # tag_name="".
          #
          # Retry with backoff (2026-07-22, found live: hardened-images
          # run 29884874645 + two reruns — EVERY one of 13 concurrent jobs
          # lacking a pre-baked tatara-script hit an empty TAG here, three
          # runs in a row, while the ~7 jobs whose runner pod happened to
          # already have tatara-script on PATH — the fast path above —
          # never touch this call at all and always succeeded). A single
          # unretried call to a rate-limited/transiently-flaky endpoint is
          # a load-bearing single point of failure for every non-pre-baked
          # consumer of this action fleet-wide, not just this one repo.
          # 4 attempts, 3s/6s/12s backoff — short enough to stay well
          # under any reasonable job timeout, long enough to ride out a
          # transient rate-limit window.
          #
          # Diagnosability (2026-07-22, second pass): the first version of
          # this retry loop piped curl's own stderr to /dev/null, so a
          # PERSISTENT (not transient) failure -- confirmed live: retries
          # exhausted 4/4 on multiple hardened-images jobs even after this
          # loop landed -- left no trace of the REAL cause (a genuine 4xx,
          # a network/DNS failure, vs. rate-limiting) anywhere in the log.
          # Capture curl's HTTP status code + response body on every
          # attempt now; print both on the FINAL failure only (kept quiet
          # on a transient retry that then succeeds, so this doesn't add
          # noise to the common case).
          TAG=""
          HTTP_STATUS=""
          RESPONSE_BODY=""
          for attempt in 1 2 3 4; do
            RESPONSE_BODY=$(curl -sSL -w '\n%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/pleme-io/tatara-lisp/releases/latest)
            HTTP_STATUS=$(echo "$RESPONSE_BODY" | tail -n1)
            RESPONSE_BODY=$(echo "$RESPONSE_BODY" | sed '$d')
            TAG=$(echo "$RESPONSE_BODY" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name",""))' 2>/dev/null || true)
            if [ -n "$TAG" ]; then
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              backoff=$((3 * 2 ** (attempt - 1)))
              echo "::warning::Attempt $attempt: could not resolve latest tag from pleme-io/tatara-lisp releases (HTTP $HTTP_STATUS), retrying in ${backoff}s" >&2
              sleep "$backoff"
            fi
          done
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve latest tag from pleme-io/tatara-lisp releases after 4 attempts (HTTP $HTTP_STATUS)" >&2
            echo "::group::Final response body"
            echo "$RESPONSE_BODY"
            echo "::endgroup::"
            exit 1
          fi
        else
          TAG="$INPUT_VERSION"
        fi
        echo "Resolved tatara-lisp version: $TAG"

        BIN_DIR="$RUNNER_TEMP/tatara-script-bin"
        mkdir -p "$BIN_DIR"
        URL="https://github.com/pleme-io/tatara-lisp/releases/download/$TAG/tatara-script-$SUFFIX"

        if curl -sSL -f -o "$BIN_DIR/tatara-script" "$URL"; then
          chmod +x "$BIN_DIR/tatara-script"
          echo "Installed tatara-script from binary release"
        else
          # No shell-installed toolchain fallback (no `cargo install --git`,
          # no piped installer script) — the fleet-wide rule is that no CI
          # action installs a binary imperatively at job time. The nix
          # fallback is two steps below (a `uses:` step can't be invoked
          # from inside a `run:` block), gated on this same "binary download
          # failed" circumstance via the fallback-needed output.
          echo "::warning::No pre-built binary at $URL — falling back to nix profile install"
          echo "fallback-needed=true" >> "$GITHUB_OUTPUT"
          echo "resolved-tag=$TAG" >> "$GITHUB_OUTPUT"
        fi

        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "bin-dir=$BIN_DIR" >> "$GITHUB_OUTPUT"

    # Fallback-only, Nix-based install — only runs when the pre-built
    # binary download above failed (steps.install.outputs.fallback-needed).
    # Never runs on the common binary-download-succeeded / pre-installed
    # paths, so every ordinary invocation of this action pays zero cost
    # for these two steps. Mirrors the established nix-installer-action +
    # `nix profile install github:owner/repo/<ref>#<attr>` idiom already
    # used elsewhere in this repo (e.g. gh-team-sync/action.yml's
    # `nix profile install github:NixOS/nixpkgs/nixos-24.05#yq-go`).
    - name: Install Nix (tatara-script fallback)
      if: steps.install.outputs.fallback-needed == 'true'
      uses: DeterminateSystems/nix-installer-action@main

    - name: Install tatara-script via nix (fallback)
      if: steps.install.outputs.fallback-needed == 'true'
      shell: bash
      env:
        RESOLVED_TAG: ${{ steps.install.outputs.resolved-tag }}
      run: |
        set -euo pipefail
        nix profile install "github:pleme-io/tatara-lisp/$RESOLVED_TAG#tatara-script"
        echo "Installed tatara-script via nix profile install"

    # Write the embedded script to a tmp file and exec tatara-script on
    # it. We do not pipe via stdin because tatara-script is file-based;
    # this matches the substrate ansible-collection app pattern.
    #
    # id: exec is load-bearing — composite outputs forward only via
    # `steps.<id>.outputs.<key>`, so any GITHUB_OUTPUT writes the
    # tlisp script makes here are exposed to the caller via the
    # outputs: block below.
    - name: Run script
      id: exec
      shell: bash
      # Defaults to "." so this is a no-op for every existing caller. The
      # script file itself is written to an absolute mktemp path, so moving
      # the working directory cannot affect locating it.
      working-directory: ${{ inputs.working-directory }}
      env:
        TATARA_SCRIPT_SRC: ${{ inputs.script }}
        TATARA_SCRIPT_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        TMP=$(mktemp -t tatara-action-XXXXXX.tlisp)
        printf '%s\n' "$TATARA_SCRIPT_SRC" > "$TMP"
        # shellcheck disable=SC2086 — splitting on whitespace is intentional
        rc=0
        tatara-script "$TMP" $TATARA_SCRIPT_ARGS || rc=$?
        # Output contract gate. GITHUB_OUTPUT is per-step, so this MUST run in
        # this step — a later one cannot read what the script wrote. `exec` is
        # gone for the same reason: it would replace the shell and nothing after
        # could run. Logic lives in output-contract.tlisp, not here.
        #
        # A key this action does not declare is dropped at the composite
        # boundary and every consumer reads an empty string. That is how
        # detect-repo-type's repo-type went missing org-wide for months, with
        # the polymorphic auto-release dispatcher unable to route anything and
        # not one failing run to show it.
        tatara-script "$GITHUB_ACTION_PATH/output-contract.tlisp" || exit 1
        exit $rc
