name: 'pleme-io · tatara-script'
description: 'Execute an embedded .tlisp source string with tatara-script (binary-first, nix-install fallback)'
branding:
  icon: 'play'
  color: 'green'

inputs:
  script:
    description: "Multi-line .tlisp source executed by tatara-script (the entire body of a .tlisp file)"
    required: true
  version:
    description: "tatara-lisp release tag (e.g. v0.1.0) or 'latest'"
    required: false
    # Phase 0 freeze (theory/TATARA-LISP-CONSOLIDATION.md): pinned off
    # 'latest' so a tatara-lisp release cannot reach 315 action.yml
    # consumers unreviewed. v0.2.5 is what 'latest' resolves to today,
    # so this is a no-op now and a guardrail during the consolidation.
    default: v0.2.5
  args:
    description: "Positional arguments passed to the script (forwarded as $@ after the script file)"
    required: false
    default: ""
  working-directory:
    description: >-
      Directory to run the script from. Defaults to "." — the repo root —
      so every existing caller behaves EXACTLY as before; this input is
      additive, not a behaviour change.

      Exists because several tlisp scripts operate on repo-root-relative
      paths (cargo-bump reads ./Cargo.toml, for instance) and so could not
      serve a repo whose crate does not live at the root. Rather than
      teach each script its own path handling, the working directory is
      set once, here, where the process is actually spawned.
    required: false
    default: "."

# Composite-action outputs are explicit forwards, not wildcards. Tatara-script
# is the SHARED INNER RUNNER for ~316 actions, so a key one of their scripts
# writes reaches its caller only if it is declared BOTH here and in that
# action's own outputs block. A key missing here is not a silent drop — it is a
# hard failure: output-contract.tlisp runs in the same step and pre-empts the
# script's own exit code. That is how container-boot-check's `healthy` failed
# rabbitmq and vector images that had already BUILT and BOOTED GREEN.
#
# THE KEY SET BELOW IS GENERATED. Do not add a key by hand — add the
# `append-output` to the script and regenerate, so the declaration cannot be
# forgotten. The generator is output-contract-sync (this repo); it derives the
# union from every .tlisp that routes through here, covering every branch of
# every script rather than the one code path a given run happens to take.
# Each `description:` line is PRESERVED human prose, harvested verbatim across
# regenerations — the generated invariant is the key set, not the wording, so
# improving a description is always safe.
# BEGIN GENERATED OUTPUTS -- output-contract-sync; do not hand-edit below.
outputs:
  action-taken:
    description: "Forwarded (key: action-taken) — written by 2 action dir(s): issue-create, pr-comment"
    value: ${{ steps.exec.outputs.action-taken }}
  actions-scanned:
