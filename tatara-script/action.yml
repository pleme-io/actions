    description: "Forwarded (key: workloads-scanned) — breathe-band-lint: Deployments/StatefulSets/DaemonSets found in the tree"
    value: ${{ steps.exec.outputs.workloads-scanned }}
  wrapper-baselined:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: wrapper-baselined)"
    value: ${{ steps.exec.outputs.wrapper-baselined }}
  wrapper-violations:
    description: "Forwarded from the script's GITHUB_OUTPUT (key: wrapper-violations)"
    value: ${{ steps.exec.outputs.wrapper-violations }}
  written:
    description: "Forwarded (key: written) — written by 1 action dir(s): influxdb-write"
    value: ${{ steps.exec.outputs.written }}
