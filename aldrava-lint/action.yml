name: 'pleme-io · aldrava-lint'
description: 'Validate a (defcommentcommand ...) catalog file — catches a typo or malformed command definition at PR time instead of at the next real knock.'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  aldrava-version:
    description: >-
      REQUIRED. The pleme-io/aldrava release tag to install (e.g. `v0.1.0`).
      Deliberately has no default: this action previously pulled
      `releases/latest/download/` unpinned and unverified, so every future
      aldrava release would have silently changed the executed binary in every
      consumer with no version bump to review. Pass a tag you can bump.
    required: true
  catalog-path:
    description: "Path to the catalog file to validate."
    required: false
    default: ".github/aldrava.lisp"

outputs:
  ok:
    description: "true when the catalog parses cleanly."
    value: ${{ steps.lint.outputs.ok }}
  commands:
    description: "The registered command names, as a JSON array (ok=true only)."
    value: ${{ steps.lint.outputs.commands }}
  error:
    description: "The syntax/semantic error, naming the offending form (ok=false only)."
    value: ${{ steps.lint.outputs.error }}

runs:
  using: composite
  steps:
    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/aldrava-lint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    # Was an inline copy of the install block (one of three byte-identical
    # copies) that pulled `releases/latest/download/` with no pin and no
    # checksum, straight into /usr/local/bin. See aldrava-install/action.yml
    # for why that was safe only while it was broken, and stopped being safe
    # the moment aldrava's first `v*` tag lands.
    - name: Install aldrava
      uses: pleme-io/actions/aldrava-install@main
      with:
        version: ${{ inputs.aldrava-version }}

    - name: Lint the catalog
      id: lint
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CATALOG_PATH: ${{ inputs.catalog-path }}
