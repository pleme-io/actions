name: 'pleme-io · branch-protect-sync'
description: 'Apply branch-protection rules from a JSON spec.'
branding: { icon: 'lock', color: 'red' }

inputs:
  spec-file:
    required: false
    default: ".github/branch-protection.json"
  branch:
    required: false
    default: "main"

outputs:
  applied:
    value: ${{ steps.run.outputs.applied }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/branch-protect-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SPEC_FILE: ${{ inputs.spec-file }}
        BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
