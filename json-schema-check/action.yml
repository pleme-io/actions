name: 'pleme-io · json-schema-check'
description: 'Validate JSON files against JSON Schema.'
branding: { icon: 'check-circle', color: 'blue' }

inputs:
  schema:
    required: true
  files:
    required: true

outputs:
  errors:
    value: ${{ steps.run.outputs.errors }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/json-schema-check.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SCHEMA: ${{ inputs.schema }}
        FILES: ${{ inputs.files }}
