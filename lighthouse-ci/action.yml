name: 'pleme-io · lighthouse-ci'
description: 'Run Lighthouse CI on a URL list + assert score thresholds.'
branding: { icon: 'activity', color: 'green' }

inputs:
  urls:
    required: true
  score-threshold:
    required: false
    default: "90"

outputs:
  passed:
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    # No runtime `npm install -g` (theory/NIX-HARDENING.md §VI) -- lhci is
    # fetched via Nix's own hash-verified store mechanism (run.tlisp's own
    # `nix profile install`). This step only sets up Nix itself on the
    # runner.
    - uses: DeterminateSystems/nix-installer-action@main
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/lighthouse-ci.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        URLS: ${{ inputs.urls }}
        SCORE_THRESHOLD: ${{ inputs.score-threshold }}
