name: 'pleme-io · npm-publish'
description: 'Publish an npm package to npmjs.org; skip if (name, version) already exists; auto-rename to @pleme-io/<original> on name conflict.'
branding:
  icon: 'upload'
  color: 'blue'

inputs:
  dry-run:
    description: "Run as --dry-run only (no upload)"
    required: false
    default: "false"
  access:
    description: "npm publish --access flag (public | restricted)"
    required: false
    default: "public"

outputs:
  shipped:
    # CONTRACT CHANGED 2026-08-06: 'true' means the artifact is ON THE REGISTRY.
    #
    # It previously meant "npm exited 0", which `npm publish --dry-run` also
    # does without uploading anything — so a dry run emitted shipped=true and
    # a caller gating release tagging on it could mint a tag for a version that
    # provably does not exist. A dry run now reports shipped=false.
    #
    # Skip-when-already still counts as shipped: the artifact IS on the
    # registry, which is the whole reading that makes this safe to tag from.
    description: "'true' when the artifact is on the registry (including skip-when-already); 'false' on failure OR on a dry run"
    value: ${{ steps.ship.outputs.shipped }}
  dry-run:
    # Lets a caller tell "did not ship because it was a dry run" apart from
    # "did not ship because it failed" — both are shipped=false.
    description: "'true' when this run was a dry run and therefore uploaded nothing"
    value: ${{ steps.ship.outputs.dry-run }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        registry-url: "https://registry.npmjs.org"

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/npm-publish.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - id: ship
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        ACCESS: ${{ inputs.access }}
        # NODE_AUTH_TOKEN is read by npm publish via the registry-url
        # from setup-node above. The substrate workflow bridges the
        # org-level NPM_TOKEN secret to NODE_AUTH_TOKEN.
