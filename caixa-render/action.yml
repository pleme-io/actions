name: 'pleme-io · caixa-render'
description: 'Render cluster artifacts (Helm chart + Kubernetes manifests + Flux + CI workflows) from a (defcaixa ...) form via the `feira` CLI.'
branding: { icon: 'layers', color: 'green' }

inputs:
  caixa-path:
    description: "Explicit path to the .tlisp holding (defcaixa ...). Empty (default) auto-detects, in order: caixa.tlisp, caixa.lisp, Caixa.tlisp, .caixa/main.tlisp, src/caixa.tlisp. A path given here is a REQUIREMENT: if it does not exist the action fails rather than falling back to auto-detect, so a typo cannot silently render a different caixa."
    required: false
    default: ""
  output-dir:
    description: "Destination directory for the rendered artifacts. An explicitly-empty value resolves to the default rather than reaching `mkdir` as an empty path."
    required: false
    default: "rendered/"
  feira-ref:
    description: "The feira flake ref `nix run` resolves when no feira binary is baked into the runner. Pin to a tagged/commit ref for build reproducibility. Mirrors `doca-ref` on oci-image-push. Nothing is ever installed into the runner's nix profile."
    required: false
    default: "github:pleme-io/caixa#feira"

outputs:
  output-dir:
    description: "The resolved output directory the artifacts were rendered into."
    value: ${{ steps.run.outputs.output-dir }}
  artifact-count:
    description: "Number of regular files under output-dir after the render. Never 0 on a successful run: a render that emits nothing fails the step instead of reporting a zero count."
    value: ${{ steps.run.outputs.artifact-count }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    # Pinned to a commit SHA, not @main. An unpinned third-party action is
    # arbitrary code from a moving branch running with the job's token; the
    # tag is only a hint, since a tag is mutable and a SHA is not.
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # The `nix profile install github:pleme-io/caixa#feira` step that used to
    # sit here is GONE. It mutated the runner's global nix profile (banned
    # fleet-wide) and fetched an unpinned flake ref at job time (★★ HERMETIC
    # SUPPLY CHAIN). run.tlisp now prefers a feira already baked into the
    # runner and otherwise `nix run`s the pinnable `feira-ref` above —
    # installing nothing, and logging which of the two it took.

    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        CAIXA_PATH: ${{ inputs.caixa-path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FEIRA_REF: ${{ inputs.feira-ref }}
