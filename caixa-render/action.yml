name: 'pleme-io · caixa-render'
description: 'Render a per-program Helm chart from a (defcaixa ...) form via `feira chart`. (Kubernetes manifests, Flux and CI workflows were promised by an earlier description and have never had a feira renderer — see mode=full and SUPERSEDED.md.)'
branding: { icon: 'layers', color: 'green' }

inputs:
  caixa-path:
    description: "Explicit path to the .tlisp holding (defcaixa ...). Empty (default) auto-detects, in order: caixa.tlisp, caixa.lisp, Caixa.tlisp, .caixa/main.tlisp, src/caixa.tlisp. A path given here is a REQUIREMENT: if it does not exist the action fails rather than falling back to auto-detect, so a typo cannot silently render a different caixa."
    required: false
    default: ""
  output-dir:
    description: "Destination directory for the rendered artifacts. An explicitly-empty value resolves to the default rather than reaching `mkdir` as an empty path."
    required: false
    default: "rendered/"
  mode:
    description: >-
      `chart` (default) renders the per-program Helm chart via `feira chart` —
      the only artifact class feira can render, and the only one the live
      consumer chain (caixa-publish) reads. `full` names the original
      four-artifact promise (chart + Kubernetes manifests + Flux + CI
      workflows) and REFUSES with the gap named, because feira has a renderer
      for none of the other three. Retained as a typed state rather than
      deleted, per MODULARIZE, DON'T DELETE: when those renderers land, `full`
      becomes reachable by implementing it, and the declaration is already
      where that goes.
    required: false
    default: "chart"
  chart-subdir:
    description: >-
      Subdirectory of output-dir the chart is written to. Must match
      caixa-publish's `chart-subdir`, since the two actions are one pipeline
      and this is the seam between them.
    required: false
    default: "helm"
  feira-ref:
    description: "The feira flake ref `nix run` resolves when no feira binary is baked into the runner. Pin to a tagged/commit ref for build reproducibility. Mirrors `doca-ref` on oci-image-push. Nothing is ever installed into the runner's nix profile."
    required: false
    default: "github:pleme-io/caixa#feira"

outputs:
  output-dir:
    description: "The resolved output directory the artifacts were rendered into."
    value: ${{ steps.run.outputs.output-dir }}
  artifact-count:
    description: "Number of regular files under output-dir after the render. Never 0 on a successful run: a render that emits nothing fails the step instead of reporting a zero count."
    value: ${{ steps.run.outputs.artifact-count }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    # Pinned to a commit SHA, not @main. An unpinned third-party action is
    # arbitrary code from a moving branch running with the job's token; the
    # tag is only a hint, since a tag is mutable and a SHA is not.
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

    # The `nix profile install github:pleme-io/caixa#feira` step that used to
    # sit here is GONE. It mutated the runner's global nix profile (banned
    # fleet-wide) and fetched an unpinned flake ref at job time (★★ HERMETIC
    # SUPPLY CHAIN). run.tlisp now prefers a feira already baked into the
    # runner and otherwise `nix run`s the pinnable `feira-ref` above —
    # installing nothing, and logging which of the two it took.

    - id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/caixa-render.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CAIXA_PATH: ${{ inputs.caixa-path }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        FEIRA_REF: ${{ inputs.feira-ref }}
        MODE: ${{ inputs.mode }}
        CHART_SUBDIR: ${{ inputs.chart-subdir }}
