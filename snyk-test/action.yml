name: 'pleme-io · snyk-test'
description: 'Snyk dependency vulnerability scan with severity gate.'
branding: { icon: 'shield', color: 'red' }

inputs:
  token:
    required: true
  severity-threshold:
    required: false
    default: "high"
  project-path:
    required: false
    default: "."

outputs:
  vulns-count:
    value: ${{ steps.run.outputs.vulns-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/snyk-test.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        TOKEN: ${{ inputs.token }}
        SEVERITY_THRESHOLD: ${{ inputs.severity-threshold }}
        PROJECT_PATH: ${{ inputs.project-path }}
