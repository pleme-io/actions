name: 'pleme-io · linear-issue-create'
description: 'Create a Linear issue via GraphQL API.'
branding: { icon: 'alert-circle', color: 'purple' }

inputs:
  api-key:
    required: true
  team-id:
    required: true
  title:
    required: true
  description:
    required: false
    default: ""

outputs:
  issue-id:
    value: ${{ steps.run.outputs.issue-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/linear-issue-create.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        API_KEY: ${{ inputs.api-key }}
        TEAM_ID: ${{ inputs.team-id }}
        TITLE: ${{ inputs.title }}
        DESCRIPTION: ${{ inputs.description }}
