name: 'pleme-io · render-deploy'
description: 'Trigger a Render service deploy via API.'
branding: { icon: 'cloud', color: 'purple' }

inputs:
  service-id:
    required: true
  api-key:
    required: true

outputs:
  deploy-id:
    value: ${{ steps.run.outputs.deploy-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/render-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SERVICE_ID: ${{ inputs.service-id }}
        API_KEY: ${{ inputs.api-key }}
