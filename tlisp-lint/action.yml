name: 'pleme-io · tlisp-lint'
description: 'Validate every *.tlisp file under the repo: balanced parens, balanced strings, balanced comments, and (when tatara-script is installed) a parser-level dry-run. Catches the parse-error class of bug at PR time instead of after-tag.'
branding:
  icon: 'check-square'
  color: 'green'

inputs:
  paths:
    description: "Space-separated globs to lint. Default scans every *.tlisp in the repo."
    required: false
    default: "**/*.tlisp"
  fail-on-unbalanced:
    description: "Exit non-zero on any unbalanced paren/string/comment (default true). Set false to log warnings only."
    required: false
    default: "true"
  run-parser-check:
    description: "Also invoke tatara-script's parser via a no-op preamble to catch parser-level errors that pass a pure paren count. Default true."
    required: false
    default: "true"

outputs:
  files-scanned:
    description: "Number of .tlisp files scanned"
    value: ${{ steps.lint.outputs.files-scanned }}
  errors-found:
    description: "Number of files with errors"
    value: ${{ steps.lint.outputs.errors-found }}

runs:
  using: composite
  steps:
    # Composed to a FILE, not to an output.
    #
    # This used to cat stdlib + run.tlisp into `$GITHUB_OUTPUT` under a fixed
    # `TLISP_EOF` heredoc marker and pass the result as `script:`. Three
    # problems, one of which took the job down:
    #
    #   * the composed source is ~132 KB and rides to the runner as an env
    #     var, so the step died with "Argument list too long" the moment
    #     run.tlisp grew. A size ceiling nobody declared;
    #   * a FIXED heredoc delimiter is an injection whenever the content is
    #     influenced from outside — the same defect fixed in
    #     changelog-generate;
    #   * the whole script gets ECHOED into the step log, so grepping the log
    #     for a message matches the line that WOULD print it.
    #
    # A path costs none of that.
    - name: Compose stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        DEST="${RUNNER_TEMP}/tlisp-lint-composed.tlisp"
        # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
        cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp" > "$DEST"
        echo >> "$DEST"
        cat "${{ github.action_path }}/run.tlisp" >> "$DEST"
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    - name: Run tlisp-lint
      id: lint
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.path }}
      env:
        PATHS: ${{ inputs.paths }}
        FAIL_ON_UNBALANCED: ${{ inputs.fail-on-unbalanced }}
        RUN_PARSER_CHECK: ${{ inputs.run-parser-check }}
        # Layer 6's s-expression reader is a sidecar file, and this script
        # reaches the runner as a STRING (see the "Load run.tlisp" step above),
        # so it cannot locate its own directory. Without this the layer skips
        # itself with a log line instead of silently passing.
        ACTION_PATH: ${{ github.action_path }}
