name: 'pleme-io · nix-cachix-push'
description: 'RETIRED: pleme-io caching software is sui (use sui-cache-push). Refuses unless allow-legacy is "true"; then pushes a built nix path to a Cachix binary cache.'
branding: { icon: 'upload', color: 'blue' }

inputs:
  cache-name:
    required: true
  path:
    required: true
  allow-legacy:
    description: 'The literal "true" runs this retired action anyway. Anything else refuses and points at sui-cache-push.'
    required: false
    default: 'false'

outputs:
  pushed:
    value: ${{ steps.run.outputs.pushed }}

runs:
  using: composite
  steps:
    - uses: pleme-io/actions/legacy-cache-guard@main
      with:
        action: nix-cachix-push
        replacement: sui-cache-push
        allow-legacy: ${{ inputs.allow-legacy }}
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: cachix/cachix-action@v15
      with:
        name: ${{ inputs.cache-name }}
        authToken: ${{ env.CACHIX_AUTH_TOKEN }}
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/nix-cachix-push.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CACHE_NAME: ${{ inputs.cache-name }}
        PATH_ARG: ${{ inputs.path }}
