name: 'pleme-io · oci-image-push'
description: 'Push an OCI image tarball (Nix dockerTools output) to a registry via doca (pure-Rust OCI push, retry-on-transient)'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  registry:
    description: "Target OCI registry (e.g. ghcr.io)"
    required: true
  image:
    description: "Image path (e.g. pleme-io/pangea-operator)"
    required: true
  tag:
    description: "Image tag"
    required: true
  tarball:
    description: "Path to the Docker/OCI image tarball produced by Nix"
    required: false
    default: "./result"
  username:
    description: "Explicit registry username. Empty (default) keeps the existing contract -- doca falls back to the AMBIENT ~/.docker/config.json a prior docker/login-action wrote, the same file skopeo read. Supply this to skip the login step entirely."
    required: false
    default: ""
  password:
    description: "Explicit registry password/token, paired with `username`. Handed to doca as the INPUT_DEST_PASS ENV VAR, never on the command line -- /proc/<pid>/cmdline and `ps` are world-readable on a shared runner and GitHub log-masking does not cover the process table. Ignored when `username` is empty."
    required: false
    default: ""
  ca-cert:
    description: "Path to a PEM CA/leaf certificate FILE to trust for a self-signed target registry (e.g. an in-cluster Zot). REQUIRED for such a registry: doca's oci-client is built with rustls-tls, whose trust anchors are the compiled-in webpki set -- so a host-level `update-ca-certificates` does NOT reach it, unlike the skopeo this action used to call. Empty = system-trusted registry (ghcr.io, Harbor)."
    required: false
    default: ""
  insecure:
    description: "'true' skips TLS verification / allows plain HTTP. A real escape hatch, not a convenience -- prefer `ca-cert`, which is genuine verification pinned to a specific certificate."
    required: false
    default: "false"
  doca-ref:
    description: "The doca (oci-push) flake ref `nix run` resolves when no doca binary is baked into the runner. Pin to a tagged/commit ref for build reproducibility. Mirrors the identically-named input on zot-push / zot-pull-scan."
    required: false
    default: "github:pleme-io/substrate#oci-push"
  flake-ref:
    description: "(unused — kept for input-compat with older callers)"
    required: false
    default: "."

# `using: docker` (docker://ghcr.io/pleme-io/action-oci-image-push:latest)
# UNTIL 2026-07-21 -- root-caused live: a `using: docker` action runs in
# an isolated container GHA bind-mounts `${{ github.workspace }}` into,
# but NEVER `/nix`. `tarball` is a Nix-build out-link symlink whose
# TARGET lives at `/nix/store/...` -- readable as a symlink from inside
# the container (it's just an inode in the bind-mounted workspace), but
# opening what it points to is a guaranteed "no such file or directory",
# regardless of the symlink's freshness on the host. Confirmed against a
# real akeylesslabs/akeyless-main-repo run: skopeo failed
# "initializing source docker-archive:camelot/hardened-images/result:
# ... open camelot/hardened-images/result: no such file or directory"
# every single time, silently, because the calling workflow had
# continue-on-error: true on this step -- masked for as long as this
# action existed in Docker mode. Every OTHER action in the same pipeline
# that touches a Nix build output (skopeo-login, container-boot-check,
# cartorio-attest, manifest-list-join, nix-build) is `using: composite`
# for exactly this reason -- runs natively on the SAME runner process
# that built the artifact, full `/nix/store` visibility, no bind-mount
# gap. `skopeo` itself is confirmed present on the stock ubuntu-latest
# runner image (skopeo-login's own composite `skopeo login` call has run
# green on this exact pipeline) -- no extra install step needed.
# run.tlisp was ALREADY written env-agnostic (`INPUT_*` preferred,
# bare-name fallback) precisely so this conversion needs zero source
# changes -- only this runs: block.
runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # In-checkout, not fetched. substrate pins this action `@v1`, so
          # run.tlisp below comes from the v1 checkout -- but the stdlib was
          # curl'd from `main`, and the two halves of one script ran at
          # different refs. GitHub clones the whole repo for a composite
          # action, so the stdlib is already on disk at the SAME ref.
          # It also drops a fetch that could not fail loudly: `curl -sL` has no
          # --fail, so an HTTP error yields an EMPTY body and a ZERO exit.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        REGISTRY:  ${{ inputs.registry }}
        IMAGE:     ${{ inputs.image }}
        TAG:       ${{ inputs.tag }}
        TARBALL:   ${{ inputs.tarball }}
        USERNAME:  ${{ inputs.username }}
        PASSWORD:  ${{ inputs.password }}
        # doca reads these directly (its INPUT_<FLAG> convention). Passing them
        # as ENV rather than on the command line keeps the password out of
        # /proc/<pid>/cmdline and `ps`, which are world-readable on the runner --
        # GitHub's log masking does not cover the process table. Empty values are
        # treated as unset by doca's own env_input (it filters empty strings), so
        # the ambient-docker-config path is unaffected.
        INPUT_DEST_USER: ${{ inputs.username }}
        INPUT_DEST_PASS: ${{ inputs.password }}
        CA_CERT:   ${{ inputs.ca-cert }}
        INSECURE:  ${{ inputs.insecure }}
        DOCA_REF:  ${{ inputs.doca-ref }}
        FLAKE_REF: ${{ inputs.flake-ref }}
