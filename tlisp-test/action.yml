name: 'pleme-io · tlisp-test'
description: "Discover + run every *.test.tlisp via tatara-script --test. Each test runs as the stdlib + the sibling unit (<base>.tlisp) + the test, with TLISP_TEST=1 so the unit defines its functions but skips its main. Fails if any (deftest ...) fails, AND fails if fewer than `min-files` tests are discovered so a discovery failure can never pass as a green suite."
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  min-files:
    description: >-
      Minimum number of *.test.tlisp files that MUST be discovered. Default 1,
      which catches total discovery failure -- without a floor, `find` matching
      nothing yields "all 0 file(s) passed" and exit 0, indistinguishable from
      a real pass. Raise it to the count you expect (actions/ci.yml does) so a
      PARTIAL collapse is caught too, not just a total one. Set 0 only for a
      repo that genuinely has no tlisp tests.
    required: false
    default: "1"

outputs:
  test-files:
    description: "Number of *.test.tlisp files discovered."
    value: ${{ steps.run.outputs.test-files }}
  failed-files:
    description: "Number of test files with a failing (deftest ...)."
    value: ${{ steps.run.outputs.failed-files }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        MIN_FILES: ${{ inputs.min-files }}
