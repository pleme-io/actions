name: 'pleme-io · argocd-sync'
description: 'Trigger argocd app sync + wait for Healthy/Synced. Sibling of flux-reconcile.'
branding: { icon: 'refresh-cw', color: 'blue' }

inputs:
  app-name:
    required: true
  server:
    description: "argocd server URL (with --grpc-web if needed)"
    required: true
  auth-token:
    required: true
  timeout:
    required: false
    default: "300"

outputs:
  synced:
    value: ${{ steps.run.outputs.synced }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/argocd-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        APP_NAME: ${{ inputs.app-name }}
        ARGOCD_SERVER: ${{ inputs.server }}
        ARGOCD_AUTH_TOKEN: ${{ inputs.auth-token }}
        TIMEOUT: ${{ inputs.timeout }}
