name: 'pleme-io · skopeo-login [RETIRED]'
description: 'RETIRED 2026-07-31 — zero consumers remain fleet-wide. doca is per-CALL auth, so there is no login step to perform. Kept, not deleted, per MODULARIZE-DON''T-DELETE. Historically: logged skopeo into a registry (ECR-aware), writing skopeo''s own auth file rather than ~/.docker/config.json.'
branding:
  icon: 'log-in'
  color: 'blue'

inputs:
  registry:
    description: "Registry host (e.g. registry.secondfront.com, ghcr.io, <acct>.dkr.ecr.<region>.amazonaws.com, public.ecr.aws)"
    required: true
  username:
    description: "Username — or AWS_ACCESS_KEY_ID for an ECR registry"
    required: true
  password:
    description: "Password — or AWS_SECRET_ACCESS_KEY for an ECR registry"
    required: true

outputs:
  logged-in:
    value: ${{ steps.run.outputs.logged-in }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        REGISTRY: ${{ inputs.registry }}
        USERNAME: ${{ inputs.username }}
        PASSWORD: ${{ inputs.password }}
