name: 'pleme-io · container-boot-check'
description: 'Start a container and poll a health command until it responds or a bounded attempt count is exhausted. Generic — any image, any health command, no secrets. Dumps container logs on timeout so a boot failure is never silent.'
branding: { icon: 'activity', color: 'green' }

inputs:
  image:
    description: "Image ref to start (e.g. ghcr.io/pleme-io/rabbitmq:3.13.7-nix0)"
    required: true
  expect-log:
    description: >-
      Third boot mode, for a binary that CANNOT fully start in isolation (a
      Kubernetes operator with no cluster, a client needing an absent backend).
      When set, the check waits the full window and passes if this exact string
      appears in `docker logs` (stdout+stderr), regardless of exit code. This
      proves the binary LOADED -- shared libraries resolved, no glibc collision,
      no SIGSEGV before main -- and executed into its own startup path. It does
      NOT prove the process serves traffic, and the log line says so. Takes
      precedence over health-cmd. Empty (default) does not select this mode, so
      it can never degrade into "any output passes". Choose a string only a
      correctly-loading binary emits -- e.g. clickhouse-operator's
      "Unable to build kubeconf"; a string the runtime prints BEFORE exec'ing
      the entrypoint would make this vacuous.
    required: false
    default: ""
  health-cmd:
    description: "Shell command run inside the container via `docker exec` on each poll; success (exit 0) means healthy (e.g. \"rabbitmq-diagnostics -q ping\"). Leave empty for a shell-less/distroless image with nothing to exec into — falls back to a 'still running after max-attempts*poll-interval-seconds' check via `docker inspect`, no exec into the container."
    required: false
    default: ""
  env:
    description: "Newline-separated KEY=VALUE pairs passed to `docker run -e`"
    required: false
    default: ""
  max-attempts:
    description: "Poll attempts before giving up"
    required: false
    default: "30"
  poll-interval-seconds:
    description: "Seconds to sleep between poll attempts"
    required: false
    default: "3"

outputs:
  healthy:
    value: ${{ steps.run.outputs.healthy }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        # Writes a FILE and passes its PATH (migrated 2026-08-02). Emitting the
        # assembled stdlib+script as a step OUTPUT made tatara-script carry it as
        # the env var TATARA_SCRIPT_SRC, and GitHub echoes env values into the log
        # group -- so every invocation printed the whole source before running,
        # and any grep for a message matched the line that WOULD print it.
        f="$RUNNER_TEMP/container-boot-check-$GITHUB_RUN_ID-$RANDOM.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$f"
        # An empty assembly parses to nothing and exits 0 -- refuse it rather than
        # let a no-op look like a pass.
        if [ ! -s "$f" ]; then echo "::error::container-boot-check: assembled tlisp is empty" >&2; exit 1; fi
        echo "path=$f" >> "$GITHUB_OUTPUT"
        echo "assembled $(wc -l < "$f") lines -> $f"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.path }}
      env:
        IMAGE: ${{ inputs.image }}
        HEALTH_CMD: ${{ inputs.health-cmd }}
        EXPECT_LOG: ${{ inputs.expect-log }}
        CONTAINER_ENV: ${{ inputs.env }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
