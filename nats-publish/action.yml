name: 'pleme-io · nats-publish'
description: 'Publish a message to a NATS subject via natscli.'
branding: { icon: 'message-circle', color: 'green' }

inputs:
  server:
    required: true
  subject:
    required: true
  message:
    required: true
  creds-file:
    required: false
    default: ""

outputs:
  published:
    value: ${{ steps.run.outputs.published }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/nats-publish.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SERVER: ${{ inputs.server }}
        SUBJECT: ${{ inputs.subject }}
        MESSAGE: ${{ inputs.message }}
        CREDS_FILE: ${{ inputs.creds-file }}
