name: 'pleme-io · storybook-deploy'
description: 'Build + deploy a Storybook to gh-pages.'
branding: { icon: 'upload', color: 'purple' }

inputs:
  output-dir:
    required: false
    default: "storybook-static/"

outputs:
  url:
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/storybook-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
