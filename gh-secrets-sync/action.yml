name: 'pleme-io · gh-secrets-sync'
description: 'Sync GitHub repo/org/env secrets from a typed YAML spec (encrypted).'
branding: { icon: 'lock', color: 'red' }

inputs:
  spec-file:
    required: false
    default: ".github/secrets.yaml"
  scope:
    required: false
    default: "repo"

outputs:
  synced-count:
    value: ${{ steps.run.outputs.synced-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/gh-secrets-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SPEC_FILE: ${{ inputs.spec-file }}
        SCOPE: ${{ inputs.scope }}
        GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN || github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
