name: 'pleme-io · pulumi-up'
description: 'Run pulumi up on a stack.'
branding: { icon: 'cloud', color: 'orange' }

inputs:
  stack:
    required: true
  workdir:
    required: false
    default: "."

outputs:
  updated:
    value: ${{ steps.run.outputs.updated }}

runs:
  using: composite
  steps:
    - uses: pulumi/actions@v6
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/pulumi-up.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        STACK: ${{ inputs.stack }}
        WORKDIR: ${{ inputs.workdir }}
