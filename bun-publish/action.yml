name: 'pleme-io · bun-publish'
description: 'Build + publish via bunx.'
branding: { icon: 'package', color: 'purple' }

inputs:
  workdir:
    required: false
    default: "."
  npm-token:
    required: true

outputs:
  published:
    value: ${{ steps.run.outputs.published }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/bun-publish.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WORKDIR: ${{ inputs.workdir }}
        NPM_TOKEN: ${{ inputs.npm-token }}
