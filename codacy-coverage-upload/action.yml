name: 'pleme-io · codacy-coverage-upload'
description: 'Upload coverage to Codacy.'
branding: { icon: 'bar-chart', color: 'green' }

inputs:
  api-token:
    description: "Codacy PROJECT token. Forwarded as CODACY_PROJECT_TOKEN — never as a command-line argument."
    required: true
  coverage-file:
    description: "Path to the coverage report to upload (cobertura.xml, coverage.xml, lcov.info, …)."
    required: true
  reporter-bin:
    description: >-
      Program to invoke. Additive; the default resolves codacy-coverage-reporter
      from PATH. Point this at a nix-store path to keep the job hermetic — this
      action never fetches and executes an installer at job time
      (★★ HERMETIC SUPPLY CHAIN).
    required: false
    default: "codacy-coverage-reporter"

outputs:
  uploaded:
    value: ${{ steps.run.outputs.uploaded }}

runs:
  using: composite
  steps:
    # ── ★ NO actions/checkout HERE, DELIBERATELY ────────────────────────────
    # The sibling loader template opens with `actions/checkout@v4` because it
    # reads a spec file tracked in the repo. This action does the opposite: it
    # consumes a coverage report that an EARLIER STEP IN THE CALLING JOB just
    # generated, and that report is an untracked build artifact.
    # actions/checkout defaults to `clean: true`, which runs
    # `git clean -ffdx && git reset --hard HEAD` before fetching — that deletes
    # untracked files. Adding a checkout step here would destroy the very input
    # this action exists to upload, and the failure would read as "coverage
    # report not found" rather than as "we deleted it".
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/codacy-coverage-upload.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        # ★ The token reaches the reporter through its documented ENVIRONMENT
        # channel. codacy-coverage-reporter also accepts `--project-token`, and
        # that flag is deliberately unused: argv is world-readable via `ps` and
        # /proc/<pid>/cmdline, and GitHub masks logs, not the process table.
        CODACY_PROJECT_TOKEN: ${{ inputs.api-token }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
        REPORTER_BIN: ${{ inputs.reporter-bin }}
