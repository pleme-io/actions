name: 'pleme-io · codacy-coverage-upload'
description: 'Upload coverage to Codacy.'
branding: { icon: 'bar-chart', color: 'green' }

inputs:
  api-token:
    required: true
  coverage-file:
    required: true

outputs:
  uploaded:
    value: ${{ steps.run.outputs.uploaded }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        API_TOKEN: ${{ inputs.api-token }}
        COVERAGE_FILE: ${{ inputs.coverage-file }}
