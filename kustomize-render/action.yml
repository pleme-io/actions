name: 'pleme-io · kustomize-render'
description: 'kustomize build → emit rendered manifests. Optional in-place commit to a target branch for GitOps workflows.'
branding: { icon: 'layers', color: 'blue' }

inputs:
  overlay:
    description: "Path to the kustomize overlay (or base) to render"
    required: true
  output:
    description: "Path to write rendered manifests"
    required: false
    default: "rendered.yaml"

outputs:
  output-path:
    # `steps.render` never existed — this action's steps are `src` and `run`, so
    # the forward resolved to '' on every run since the file was written. The
    # detect-repo-type failure mode at the OUTER boundary, which the runtime
    # gate cannot see (it reads tatara-script's own manifest, not this one).
    description: "Path of the rendered manifest, or empty when kustomize build failed"
    value: ${{ steps.run.outputs.output-path }}

runs:
  using: composite
  steps:
    - uses: imranismail/setup-kustomize@v2
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/kustomize-render.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        OVERLAY: ${{ inputs.overlay }}
        OUTPUT: ${{ inputs.output }}
