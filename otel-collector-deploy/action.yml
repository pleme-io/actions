name: 'pleme-io · otel-collector-deploy'
description: 'Deploy an OpenTelemetry Collector config to a k8s ConfigMap.'
branding: { icon: 'bar-chart', color: 'blue' }

inputs:
  config-file:
    required: true
  namespace:
    required: false
    default: "observability"

outputs:
  deployed:
    value: ${{ steps.run.outputs.deployed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/otel-collector-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        NAMESPACE: ${{ inputs.namespace }}
