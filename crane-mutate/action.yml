name: 'pleme-io · crane-mutate'
description: "Mutate an OCI image's labels/tags via crane."
branding: { icon: 'edit', color: 'blue' }

inputs:
  image:
    required: true
  labels:
    required: false
    default: ""

outputs:
  mutated:
    value: ${{ steps.run.outputs.mutated }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/crane-mutate.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        IMAGE: ${{ inputs.image }}
        LABELS: ${{ inputs.labels }}
