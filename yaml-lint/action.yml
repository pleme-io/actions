name: 'pleme-io · yaml-lint'
description: 'Run yamllint on yaml files.'
branding: { icon: 'check-circle', color: 'green' }

inputs:
  paths:
    required: false
    default: "."

outputs:
  errors:
    value: ${{ steps.run.outputs.errors }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/yaml-lint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PATHS: ${{ inputs.paths }}
