name: 'pleme-io · registry-login'
description: 'Resolve an OCI-registry credential from the typed fallback (BOT_PAT > GHCR_TOKEN > GITHUB_TOKEN) and log the chosen client (helm | docker) into the registry. The single overlay every publish reusable calls in place of a hand-repeated `secrets.BOT_PAT || secrets.GHCR_TOKEN || ...` expression — the priority order lives here, once. BOT_PAT carries write:packages on the org-shared ghcr.io/pleme-io/* namespace (a repo-scoped GITHUB_TOKEN 403s on cross-namespace push); on the Free plan it reaches public repos only, so a private caller passes it empty and the fallback lands on GITHUB_TOKEN — the two approved tracks, expressed once.'
branding:
  icon: 'log-in'
  color: 'blue'

inputs:
  registry:
    description: "Registry — bare host (ghcr.io) or an oci:// URL (oci://ghcr.io/pleme-io/charts); the host is extracted."
    required: true
  client:
    description: "Which credential store to authenticate: 'helm' (helm's own registry config) or 'docker' (~/.docker/config.json, which skopeo/regctl also read). Default docker."
    required: false
    default: "docker"
  username:
    description: "Registry username (typically github.actor)."
    required: true
  app-token:
    description: >-
      PREFERRED — a GitHub App installation token (`ghs_...`), minted per job
      from a key that never expires. Proven 2026-08-22 to authenticate to
      ghcr.io (anonymous /v2/ 401, garbage bearer 403, App token 200),
      contradicting GitHub's own docs which name only classic PATs. Its
      authority is bounded by INSTALLATION rather than by the scopes of a
      human's account, which is why it outranks every PAT below.
    required: false
    default: ""
  bot-pat:
    description: "Org PAT with write:packages. Pass secrets.BOT_PAT raw; empty on private-repo callers where the Free plan doesn't share it. NOTE: a fine-grained PAT CANNOT authenticate to ghcr.io — GitHub Packages accepts only classic PATs, GITHUB_TOKEN, and (measured) App tokens. If BOT_PAT has been rotated to fine-grained, this rung will fail and the ladder will fall through, loudly."
    required: false
    default: ""
  ghcr-token:
    description: "Optional dedicated registry token. Pass secrets.GHCR_TOKEN raw."
    required: false
    default: ""
  github-token:
    description: "Final fallback — the repo-scoped GITHUB_TOKEN. Pass secrets.GITHUB_TOKEN (or github.token) raw."
    required: false
    default: ""

outputs:
  logged-in:
    description: "'true' iff the login succeeded (forwarded from the script's result)."
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        # Writes a FILE, passes a PATH. MEASURED 2026-08-02 on hardened-images
        # run 30713648889: this action was the LARGEST single contributor of
        # log noise in a build job -- 1677 lines for the cat, plus a 1713-line
        # env dump when tatara-script re-echoed the same source as
        # TATARA_SCRIPT_SRC. ~3390 lines, 30% of an 11,256-line job, from one
        # action. Passing a path leaves one short string in the env block.
        f="$RUNNER_TEMP/registry-login-$GITHUB_RUN_ID-$RANDOM.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$f"
        # An empty assembly parses to nothing and exits 0 -- refuse it rather
        # than let a no-op registry login look like a successful one.
        if [ ! -s "$f" ]; then echo "::error::registry-login: assembled tlisp is empty" >&2; exit 1; fi
        echo "path=$f" >> "$GITHUB_OUTPUT"
        echo "assembled $(wc -l < "$f") lines -> $f"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.path }}
      env:
        REGISTRY: ${{ inputs.registry }}
        CLIENT: ${{ inputs.client }}
        USERNAME: ${{ inputs.username }}
        APP_TOKEN: ${{ inputs.app-token }}
        BOT_PAT: ${{ inputs.bot-pat }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
