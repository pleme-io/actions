name: 'pleme-io · spec-watch'
description: 'Detect changes in an upstream OpenAPI/JSON spec by sha256 against a cached value'
branding:
  icon: 'eye'
  color: 'yellow'

inputs:
  upstream-url:
    description: "URL of the upstream spec (OpenAPI yaml/json or any text/binary file)"
    required: true
  cache-file:
    description: "Path (relative to repo root) where the last-seen sha256 is stored"
    required: false
    default: .ci/openapi-sha

outputs:
  changed:
    description: "true if the upstream sha differs from cached, false otherwise"
    value: ${{ steps.compare.outputs.changed }}
  new-sha:
    description: "sha256 of the upstream spec fetched this run"
    value: ${{ steps.compare.outputs.new-sha }}
  cached-sha:
    description: "sha256 previously stored in the cache file (empty if first run)"
    value: ${{ steps.compare.outputs.cached-sha }}

runs:
  using: composite
  steps:
    - name: Install Nix (DeterminateSystems)
      uses: DeterminateSystems/nix-installer-action@main

    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/spec-watch.tlisp"
        {
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - name: Compare upstream sha
      id: compare
      # @main, not @v1 — the `changed` / `new-sha` / `cached-sha` output
      # forwards were added to tatara-script/action.yml AFTER the v1 tag was
      # cut. A composite action forwards only DECLARED keys, so on @v1 all
      # three come back as the empty string with no error at all: this
      # repo's own CI smoke test failed as `expected changed=true got `,
      # with the symptom appearing at the CONSUMER two steps downstream of
      # the cause.
      #
      # Same fix shape, same reason, as git-path-commit-count (whose comment
      # documents this class biting a downstream consumer live on
      # 2026-07-21 — every tag rendered "1.0." with an empty patch) and as
      # build-matrix / cartorio-attest / nix-build / nix-image / zot-push,
      # which all pin @main for exactly this.
      #
      # 288 actions in this repo still pin @v1. Any of them reading an
      # output added after the tag was cut is silently broken the same way;
      # re-cutting v1 is the load-bearing fix and is an operator decision
      # (it moves a release tag under 288 consumers at once).
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        UPSTREAM_URL: ${{ inputs.upstream-url }}
        CACHE_FILE: ${{ inputs.cache-file }}
