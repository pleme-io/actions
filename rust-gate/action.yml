name: 'pleme-io · rust-gate'
description: 'PR-time quality gate for a Rust repo: cargo fmt --check + cargo clippy + cargo test. Universal for both workspace + single-crate shapes.'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  run-fmt:
    description: "Run cargo fmt --check"
    required: false
    default: "true"
  run-clippy:
    description: "Run cargo clippy --all-targets -- -D warnings"
    required: false
    default: "true"
  run-test:
    description: "Run cargo test --workspace"
    required: false
    default: "true"
  run-check:
    description: >-
      Run `cargo check`. OFF by default so no existing consumer changes.
      Not redundant with `cargo test`: a repo that excludes crates from its
      test run (heavy GPU deps, platform headers) still wants the whole
      workspace type-checked.
    required: false
    default: "false"
  check-args:
    description: "Arguments to cargo check."
    required: false
    default: "--workspace"
  fmt-args:
    description: >-
      Arguments to `cargo fmt`. Default "--check" reproduces the previous
      hardcoded behaviour. Use "--all -- --check" to check every workspace
      member, which is what the fleet's hand-authored Rust CI does.
    required: false
    default: "--check"
  test-args:
    description: >-
      Arguments to `cargo test`. Default "--workspace" reproduces the previous
      hardcoded behaviour. Note "--workspace" (members) and "--all-targets"
      (target kinds) are DIFFERENT axes — pass both to get both.
    required: false
    default: "--workspace"
  rust-toolchain:
    description: "Rust toolchain channel (stable / nightly / 1.89.0)"
    required: false
    default: "stable"

outputs:
  fmt-passed:
    value: ${{ steps.gate.outputs.fmt-passed }}
  check-passed:
    value: ${{ steps.gate.outputs.check-passed }}
  clippy-passed:
    value: ${{ steps.gate.outputs.clippy-passed }}
  test-passed:
    value: ${{ steps.gate.outputs.test-passed }}

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: rustfmt, clippy

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: gate
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        RUN_FMT: ${{ inputs.run-fmt }}
        RUN_CLIPPY: ${{ inputs.run-clippy }}
        RUN_TEST: ${{ inputs.run-test }}
        RUN_CHECK: ${{ inputs.run-check }}
        CHECK_ARGS: ${{ inputs.check-args }}
        FMT_ARGS: ${{ inputs.fmt-args }}
        TEST_ARGS: ${{ inputs.test-args }}
