name: 'pleme-io · unity-build'
description: 'Build a Unity project for a target platform.'
branding: { icon: 'package', color: 'gray-dark' }

inputs:
  project-path:
    required: false
    default: "."
  target:
    required: false
    default: "StandaloneLinux64"

outputs:
  artifact-path:
    value: ${{ steps.run.outputs.artifact-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/unity-build.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        TARGET_ARG: ${{ inputs.target }}
