name: 'pleme-io · hubspot-contact-upsert'
description: 'Upsert a HubSpot contact.'
branding: { icon: 'users', color: 'orange' }

inputs:
  api-key:
    required: true
  email:
    required: true
  properties-json:
    required: false
    default: "{}"

outputs:
  contact-id:
    value: ${{ steps.run.outputs.contact-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/hubspot-contact-upsert.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        API_KEY: ${{ inputs.api-key }}
        EMAIL: ${{ inputs.email }}
        PROPERTIES_JSON: ${{ inputs.properties-json }}
