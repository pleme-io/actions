name: 'pleme-io · golangci-lint'
description: 'Run golangci-lint with configurable preset.'
branding: { icon: 'shield', color: 'blue' }

inputs:
  config:
    required: false
    default: ".golangci.yml"

outputs:
  findings:
    value: ${{ steps.run.outputs.findings }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/golangci-lint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CONFIG: ${{ inputs.config }}
