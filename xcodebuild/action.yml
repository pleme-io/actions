name: 'pleme-io · xcodebuild'
description: 'Build an Xcode project/workspace.'
branding: { icon: 'package', color: 'orange' }

inputs:
  scheme:
    required: true
  destination:
    required: false
    default: "generic/platform=iOS"

outputs:
  built:
    value: ${{ steps.run.outputs.built }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/xcodebuild.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SCHEME: ${{ inputs.scheme }}
        DESTINATION: ${{ inputs.destination }}
