name: 'pleme-io · auth0-rule-deploy'
description: 'Deploy an Auth0 Action/Rule.'
branding: { icon: 'lock', color: 'orange' }

inputs:
  domain:
    required: true
  client-id:
    required: true
  client-secret:
    required: true
  rule-file:
    required: true

outputs:
  deployed:
    value: ${{ steps.run.outputs.deployed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/auth0-rule-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        DOMAIN: ${{ inputs.domain }}
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        RULE_FILE: ${{ inputs.rule-file }}
