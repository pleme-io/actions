name: 'pleme-io · caixa-publish'
description: 'Publish caixa-rendered Helm chart to an OCI registry. Wraps helm-publish but consumes the caixa-render output dir.'
branding: { icon: 'upload', color: 'green' }

inputs:
  rendered-dir:
    description: "Directory caixa-render wrote to (default: rendered/)"
    required: false
    default: "rendered/"
  chart-subdir:
    description: "Subdirectory under rendered-dir that contains the Helm chart"
    required: false
    default: "helm"
  registry:
    required: false
    default: "ghcr.io/pleme-io/helm"

outputs:
  shipped:
    value: ${{ steps.run.outputs.shipped }}

runs:
  using: composite
  steps:
    # DELIBERATELY NO `actions/checkout@v4` HERE, unlike the loader template.
    # This action consumes a directory a PRIOR step in the same job produced
    # (caixa-render's output), and actions/checkout defaults to clean: true,
    # which runs `git clean -ffdx` and deletes exactly those untracked
    # rendered files. The stdlib below does not need it: the runner already
    # materializes this whole repo at ${{ github.action_path }}/.., so
    # ../_tlisp-stdlib is present without a checkout.
    - uses: azure/setup-helm@v4

    # ONE line of genuine glue, and it stays bash DELIBERATELY — this is the
    # org rule's own 1-3-line allowance, spent on a security property the
    # tlisp port cannot currently hold.
    #
    # The bash this action replaced piped the token: `echo "$GHCR_TOKEN" |
    # helm registry login --password-stdin`. The first cut of the port moved
    # it to `--password <token>` as an argv element, justified in-comment as
    # "the proven shape in this repo (registry-login/run.tlisp)" and because
    # "Actions masks registered secret values in logs". That justification is
    # wrong in a specific way: Actions masks LOGS, not the PROCESS TABLE. An
    # argv token is world-readable via `ps` / /proc/<pid>/cmdline for the life
    # of the call, on a runner that may be shared. That is strictly WORSE than
    # the shell it replaced, so the conversion would have been a security
    # regression sold as a cleanup.
    #
    # `exec-capture` / `proc:run` take argv only — the stdlib has no stdin
    # channel, so this is not fixable inside the port. The real fix is a
    # stdin-bearing primitive in tatara-lisp; until it exists, login stays
    # here where `--password-stdin` works, and the rest of the action is tlisp.
    # `registry-login/run.tlisp:62-64` carries the SAME defect and is NOT
    # precedent — it is the second instance of one gap.
    # pending-stdlib-stdin: helm registry login · docker login · registry-login
    - id: login
      shell: bash
      env:
        GHCR_TOKEN: ${{ env.GHCR_TOKEN || env.GITHUB_TOKEN || github.token }}
        REGISTRY_HOST: ${{ inputs.registry }}
        REGISTRY_USER: ${{ github.actor }}
      run: printf '%s' "$GHCR_TOKEN" | helm registry login "$REGISTRY_HOST" --username "$REGISTRY_USER" --password-stdin

    - id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/caixa-publish.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        # Inputs cross as ENV, never interpolated into a script body — the
        # bash this replaced pasted all three into its own source text.
        RENDERED_DIR: ${{ inputs.rendered-dir }}
        CHART_SUBDIR: ${{ inputs.chart-subdir }}
        REGISTRY: ${{ inputs.registry }}
        # `github.token` is the added last resort. `env.GITHUB_TOKEN` is NOT
        # auto-populated by Actions -- only `github.token` /
        # `secrets.GITHUB_TOKEN` are -- so the previous
        # `env.GHCR_TOKEN || env.GITHUB_TOKEN` resolved to the empty string for
        # any caller that had not set one by hand, and the action piped that
        # empty string into `helm registry login --password-stdin`. Priority
        # order matches registry-login/run.tlisp, the repo's one statement of
        # it: an explicit token wins, the job token stands in.
        GHCR_TOKEN: ${{ env.GHCR_TOKEN || env.GITHUB_TOKEN || github.token }}
