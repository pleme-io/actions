name: 'pleme-io · velero-backup'
description: 'Run velero backup create.'
branding: { icon: 'archive', color: 'green' }

inputs:
  backup-name:
    required: true
  namespaces:
    required: false
    default: ""

outputs:
  backup-name:
    value: ${{ steps.run.outputs.backup-name }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/velero-backup.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        BACKUP_NAME: ${{ inputs.backup-name }}
        NAMESPACES: ${{ inputs.namespaces }}
