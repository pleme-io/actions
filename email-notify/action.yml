name: 'pleme-io · email-notify'
description: 'Send a plain-text email via SMTP. Sibling of slack-notify / discord-notify for ops contexts where webhooks aren''t available.'
branding: { icon: 'mail', color: 'blue' }

inputs:
  smtp-host:
    required: true
  smtp-port:
    description: >-
      Submission port. 465 selects implicit TLS (swaks --tlsc); anything else
      selects STARTTLS (swaks --tls). The old body hardcoded --tls, so 465 —
      which never advertises STARTTLS — could not work at all.
    required: false
    default: "587"
  smtp-username:
    required: true
  smtp-password:
    description: >-
      Passed to swaks through $SWAKS_OPT_auth_password, never argv. An unset
      secret interpolates to "" here rather than failing the expression, so an
      empty value is refused instead of dialled.
    required: true
  from:
    required: true
  to:
    description: >-
      Comma-separated recipients. Whitespace around each address is trimmed.
      An empty or all-blank value is REFUSED — the bash this replaced reported
      sent=true after opening no connection.
    required: true
  subject:
    required: true
  body:
    description: >-
      The message body, as literal text. A value naming an existing path is
      refused: swaks would otherwise mail that FILE's contents.
    required: true

outputs:
  sent:
    description: '"true" only when EVERY recipient was accepted.'
    value: ${{ steps.run.outputs.sent }}
  failed-count:
    description: >-
      Recipients that did not receive the message. Written only once delivery
      was attempted, so it is empty when the action refused on configuration.
    value: ${{ steps.run.outputs.failed-count }}

runs:
  using: composite
  steps:
    # No DeterminateSystems/nix-installer-action@main and no `nix profile
    # install …#swaks` any more. That pair fetched a third-party artifact at
    # job time (★★ HERMETIC SUPPLY CHAIN) on the step that then handles SMTP
    # credentials, through an UNPINNED third-party action -- and its "exact
    # pin" was `refs/heads/nixos-24.05`, a branch head that moves with every
    # backport. swaks is now required in the job's environment; run.tlisp
    # refuses loudly when it is absent rather than reporting an unsent mail.
    - id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/email-notify.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SMTP_HOST: ${{ inputs.smtp-host }}
        SMTP_PORT: ${{ inputs.smtp-port }}
        SMTP_USERNAME: ${{ inputs.smtp-username }}
        SMTP_PASSWORD: ${{ inputs.smtp-password }}
        FROM: ${{ inputs.from }}
        TO: ${{ inputs.to }}
        SUBJECT: ${{ inputs.subject }}
        BODY: ${{ inputs.body }}
