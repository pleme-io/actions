name: 'pleme-io · sui-dockerfile-node-cache'
description: >-
  Daemon-aware sui-dockerfile-wrapper GHA integration point
  (supa-charge-akeyless-ci Phase 3b). Probes the node-local
  sui-dockerfile-node-cache-daemon Unix socket; when present, routes the
  Dockerfile-graph cache lookup through the node-local tier via
  DaemonAwareCacheClient before falling through to the remote tier;
  when absent, behaves byte-for-byte like the Phase 2 direct-to-remote
  wrapper. Never requires the daemon.
branding:
  icon: 'layers'
  color: 'purple'

inputs:
  dockerfile-path:
    description: "Path to the Dockerfile to build."
    required: true
  build-context:
    description: "Build context directory (mirrors `docker build <context>`)."
    required: false
    default: "."
  image-tag:
    description: "Image tag to build/pull (mirrors `docker build -t <tag>`)."
    required: true
  cache-backend-config:
    description: >-
      JSON-encoded sui-cache `BackendConfig` for the remote cache tier. The
      tagged-union discriminant is `type`, NOT `kind`
      (`#[serde(tag = "type", rename_all = "lowercase")]`) — e.g.
      `{"type":"s3","bucket":…,"region":…}` or `{"type":"local","path":…}`.
      Corrected 2026-08-08: this description used to say `kind`, which the
      binary rejects with `missing field \`type\`` before any build runs; a
      `kind`-tagged config is now refused up front with that fix named.
    required: true
  node-cache-socket-path:
    description: >-
      Override for the well-known node-local daemon socket path. Empty
      resolves to `sui_dockerfile_node_cache_daemon::default_socket_path()`
      (`/var/run/sui-dockerfile-cache/node-cache.sock`) — resolved once by
      the action and handed to the binary, so the `daemon-used` output and
      the binary's own routing decision are made on the SAME path.
    required: false
    default: ""
  sui-ref:
    description: >-
      pleme-io/sui ref used ONLY when no `gha-entrypoint` is on PATH, for the
      `nix run github:pleme-io/sui/<ref>#sui-dockerfile-wrapper` degradation.
      The intended path is a wrapper baked into the runner image; this action
      no longer performs the job-time `nix profile install` (★★ HERMETIC
      SUPPLY CHAIN) and pins nothing floating on the caller's behalf.
    required: false
    default: "main"

outputs:
  daemon-used:
    description: >-
      true when the node-local DaemonSet socket was present and used. Existence
      is the predicate the binary itself branches on (`Path::exists`), so this
      reports what the wrapper did rather than a second, divergent `-S` test.
    value: ${{ steps.run.outputs.daemon-used }}
  outcome:
    description: >-
      The receipt's raw `outcome.kind`: CacheHit | CacheMiss | BuildFailed.
      `build-failed` is the fallback when the wrapper produced no parseable
      receipt. Corrected 2026-08-08: this used to be documented as
      `cache-hit | cache-miss | build-failed`, values no well-formed receipt
      can ever produce.
    value: ${{ steps.run.outputs.outcome }}
  cache-hit:
    description: "true when every Dockerfile-graph node was already cached (no docker build ran)"
    value: ${{ steps.run.outputs.cache-hit }}
  docker-ran:
    description: "true when a real `docker build` (or cache-hit `docker pull`) executed"
    value: ${{ steps.run.outputs.docker-ran }}
  duration-ms:
    description: "Total wall-clock duration of the wrapper run, in milliseconds"
    value: ${{ steps.run.outputs.duration-ms }}

runs:
  using: composite
  steps:
    # No `actions/checkout` here on purpose: this action reads the CALLER's
    # build context, and a checkout would reset the workspace the Dockerfile
    # and its context live in.
    #
    # No `DeterminateSystems/nix-installer-action@main` and no
    # `nix profile install github:pleme-io/sui#sui-dockerfile-wrapper` either.
    # Both were deleted rather than hardened: the first was an unpinned
    # third-party action in the privileged position, the second an imperative,
    # floating-ref, non-idempotent job-time install that the step's own comment
    # already described as forbidden. run.tlisp resolves the binary from PATH
    # (the baked runner image) and refuses loudly if it cannot.
    - id: src
      shell: bash
      run: |
        # Concatenated to a FILE, not a step output. A step output becomes an
        # action input, which becomes an env var, which lands in the exec arg
        # space -- and Linux caps a single argv/env string at MAX_ARG_STRLEN =
        # 131072. stdlib.tlisp alone is ~118KB, so this pair exceeded it and
        # exec failed with "Argument list too long" before bash ever started,
        # logging nothing tlisp-related. `script-file` is tatara-script's own
        # documented alternative and removes size from the question entirely.
        set -euo pipefail
        out="${RUNNER_TEMP}/sui-dockerfile-node-cache.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SUI_DOCKERFILE_PATH: ${{ inputs.dockerfile-path }}
        SUI_BUILD_CONTEXT: ${{ inputs.build-context }}
        SUI_IMAGE_TAG: ${{ inputs.image-tag }}
        SUI_CACHE_BACKEND_CONFIG: ${{ inputs.cache-backend-config }}
        SUI_NODE_CACHE_SOCKET_PATH: ${{ inputs.node-cache-socket-path }}
        SUI_REF: ${{ inputs.sui-ref }}
