name: 'pleme-io · notion-page-create'
description: 'Create a Notion page via the API.'
branding: { icon: 'file-text', color: 'gray-dark' }

inputs:
  token:
    required: true
  parent-id:
    required: true
  title:
    required: true
  content:
    required: false
    default: ""

outputs:
  page-id:
    value: ${{ steps.run.outputs.page-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/notion-page-create.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        TOKEN: ${{ inputs.token }}
        PARENT_ID: ${{ inputs.parent-id }}
        TITLE: ${{ inputs.title }}
        CONTENT: ${{ inputs.content }}
