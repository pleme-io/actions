name: 'pleme-io · browserstack-test'
description: 'Run BrowserStack cross-browser tests.'
branding: { icon: 'check-circle', color: 'orange' }

inputs:
  username:
    required: true
  access-key:
    required: true
  config-file:
    required: true

outputs:
  passed:
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/browserstack-test.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        USERNAME_ARG: ${{ inputs.username }}
        ACCESS_KEY: ${{ inputs.access-key }}
        CONFIG_FILE: ${{ inputs.config-file }}
