name: 'pleme-io · doctl-deploy'
description: 'Deploy a DigitalOcean App Platform app.'
branding: { icon: 'cloud', color: 'blue' }

inputs:
  app-spec:
    required: true
  api-token:
    required: true

outputs:
  deployed:
    value: ${{ steps.run.outputs.deployed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/doctl-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        APP_SPEC: ${{ inputs.app-spec }}
        API_TOKEN: ${{ inputs.api-token }}
