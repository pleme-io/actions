name: 'pleme-io · zot-pull-scan'
description: 'The zot faucet gate: pull an image from a private zot registry, then gate admission through image-scan -- the fleet''s ONE canonical Trivy severity implementation -- scanning the PULLED bytes, never a re-resolved tag. Nothing enters the trusted zone unscanned, and nothing enters on a scan failure, a parse failure, or a misconfigured override either.'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  ref:
    description: "zot image ref to pull + scan (e.g. zot.internal/pleme-io/svc:tag)"
    required: true
  fail-on-severity:
    description: "Lowest severity that REJECTS admission: UNKNOWN | LOW | MEDIUM | HIGH | CRITICAL | none. Default UNKNOWN (zero-tolerance -- every severity gates): this is the trusted-zone admission gate ('nothing enters unscanned'), matching the fleet's proven convention for faucet / pre-publish gates (substrate's nix-image-auto-release.yml scan-before-push default, pangea-operator's own release.yml gate). Forwarded verbatim to image-scan, which forces this to the strictest recognized value if it's ever malformed -- never silently permissive."
    required: false
    default: "UNKNOWN"
  ignore-unfixed:
    description: "Skip vulns without an available fix. Forwarded verbatim to image-scan."
    required: false
    default: "false"
  vex:
    description: >-
      Path to an OpenVEX/CSAF document, forwarded verbatim to image-scan's own
      `vex` input (trivy --vex). REQUIRED for parity with the publishing gate:
      an image whose ghcr release passes BECAUSE of a VEX statement was, without
      this, guaranteed to be REJECTED here -- this faucet re-scans the pulled
      bytes and had no way to receive the same answer. Measured 2026-07-31, run
      30661312791: hardened-chproxy released green with
      vex/hardened-chproxy-GO-2026-5932.openvex.json and its Zot mirror failed
      "zot faucet REJECT: scan outcome=failure severity=UNKNOWN". The two gates
      disagreed BY CONSTRUCTION, so a VEX-dependent image could never enter Zot
      and therefore could never reach 2F. Empty = no VEX, prior behaviour exactly.
      NOTE the path is resolved on the runner's filesystem, so the caller must
      have checked the repo out (vendor-image-mirror.yml now does).
    required: false
    default: ""
  ignore-file:
    description: "Path to a .trivyignore-format file of named, tracked exceptions (never a blanket severity loosening -- each entry should carry its own justification). Forwarded verbatim to image-scan. Empty = none. Like `vex`, this is a runner-filesystem path and needs the repo checked out."
    required: false
    default: ""
  dest:
    description: "Local docker-archive path for the pulled bytes"
    required: false
    default: "zot-pull.tar"
  # ── ★ A TRUST ANCHOR FETCHED FROM A CDN AT JOB TIME (measured 2026-08-01) ──
  # This input names a raw.githubusercontent.com URL, and that has three
  # compounding weaknesses, all observed in one incident today:
  #
  # 1. STALE-BY-CACHE. Zot's serving cert was reissued 01:25 by a new
  #    cert-manager ClusterIssuer. The corrected CA was committed and the API
  #    served it immediately (fp CF:0F:CA… at akeyless-k8s@6f19747), while
  #    raw.githubusercontent.com kept returning the OLD cert (fp 7F:6C:CC…) for
  #    minutes afterward. A mirror running in that window fetches HTTP 200,
  #    gets the wrong bytes, and fails — with the fix already committed and
  #    correct. Dispatching during the window reads as "the fix did not work".
  # 2. OPAQUE FAILURE. doca is rustls-tls: compiled-in roots, system store
  #    ignored, so this file is its ONLY trust input. A wrong CA surfaces as
  #    `error sending request for url (…/blobs/uploads/)` with NO HTTP status —
  #    indistinguishable from a network or payload-size problem, which is
  #    exactly how it was misdiagnosed twice before the certs were compared.
  # 3. HERMETIC SUPPLY CHAIN. Fetching a trust anchor over the network at job
  #    time is the same class the doca conversion exists to remove; pinning the
  #    URL makes the fetch reproducible, not hermetic.
  #
  # THE FIX IS AVAILABLE AND STRICTLY BETTER: these jobs run on Camelot's own
  # in-cluster ARC pool, and the CA is already IN the cluster as the `ca.crt`
  # key of the `zot-tls-camelot-ca` secret that cert-manager maintains. Reading
  # it from there removes the CDN, removes the propagation window, and makes
  # rotation self-healing — the reconciler that rotates the cert also publishes
  # the anchor, so the two can never disagree. The committed file then becomes
  # a fallback for out-of-cluster callers rather than the primary path.
  # `pending-zot-ca-source: read the CA from the in-cluster secret, not a
  #  CDN-cached raw URL; keep the committed file only as an off-cluster
  #  fallback.`
  src-ca-cert-url:
    description: "Raw URL of the pinned CA/leaf cert (PEM) to TRUST for a self-signed SOURCE registry (mirrors zot-push's ca-cert-url; doca pins it via --dest-ca-cert). Default '' = OPT-OUT (plain copy, the original behavior) -- correct for a publicly-trusted source like GHCR (the shipped vendor-image-mirror consumer pulls its source from GHCR, so a required zot-CA fetch would wrongly refuse it). When the SOURCE is the self-signed zot itself, set this to the committed zot-ca.crt raw URL (https://raw.githubusercontent.com/pleme-io/akeyless-k8s/main/clusters/camelot-eks/infrastructure/zot/zot-ca.crt) plus src-ca-cert-token, or set src-insecure=true."
    required: false
    default: ""
  src-ca-cert-dir:
    description: "Local directory the fetched CA cert is written into; doca is handed the PEM FILE inside it (src-ca.crt) via --dest-ca-cert. skopeo took a DIR of *.crt, doca takes one file -- the directory input is kept so consumers need no change. Override if a job invokes this action more than once against DIFFERENT source certs."
    required: false
    default: "/tmp/zot-pull-certs"
  src-ca-cert-token:
    description: "GitHub token with read access to src-ca-cert-url's repo -- REQUIRED when that repo is private (the default URL points at the private pleme-io/akeyless-k8s; an unauthenticated raw fetch 404s). Empty keeps the unauthenticated path for a public cert URL."
    required: false
    default: ""
  src-insecure:
    description: "Fall back to plain --src-tls-verify=false if the CA cert fetch fails (real degradation, logged loudly -- never the default path when the cert is reachable)."
    required: false
    default: "false"
  doca-ref:
    description: "The doca (oci-push) flake ref `nix run` resolves -- pin to a tagged/commit ref for build-reproducibility, or point at a fork. Mirrors zot-push's identically-named input."
    required: false
    default: "github:pleme-io/substrate#oci-push"
  src-user:
    description: "Username for the SOURCE registry. Required when it demands auth. This action previously had no credential input at all and its header asserted auth was 'a pre-condition (the consumer workflow logs in before this action runs)' -- an assumption no consumer met: the pull was invoked with no credentials and no authfile, so an authenticated Zot rejected it in under a second and the only log line was this action's own 'pull failed'. Empty keeps the anonymous path for a public source like GHCR."
    required: false
    default: ""
  src-pass:
    description: "Password/token for the SOURCE registry. Handed to doca as the INPUT_PASS ENV VAR, never on the command line -- /proc/<pid>/cmdline and `ps` are world-readable on a shared runner and GitHub log-masking does not cover the process table. Empty (with src-user empty) keeps the anonymous path."
    required: false
    default: ""

outputs:
  # Each output falls back from steps.verdict -> steps.pull: on a
  # pull-failed terminal, verdict.tlisp never runs (pull.tlisp hard-exits
  # without continue-on-error, so GitHub Actions skips every later step by
  # default) and pull.tlisp emits the full contract itself instead; on the
  # normal admitted/rejected path, verdict.tlisp is the one that emits
  # these keys and pull.tlisp never does. Exactly one side is ever
  # non-empty for a given run -- this is not an ambiguous merge.
  admitted:
    description: "'true' iff pulled AND the scan cleared the gate"
    value: ${{ steps.verdict.outputs.admitted || steps.pull.outputs.admitted }}
  severity:
    description: "Highest severity found (CRITICAL|HIGH|MEDIUM|LOW|UNKNOWN|none), as classified by image-scan"
    value: ${{ steps.verdict.outputs.severity || steps.pull.outputs.severity }}
  vuln-count:
    description: "Coarse count of Severity occurrences, as reported by image-scan"
    value: ${{ steps.verdict.outputs.vuln-count || steps.pull.outputs.vuln-count }}
  local-archive:
    description: "Path of the pulled docker-archive"
    value: ${{ steps.verdict.outputs.local-archive || steps.pull.outputs.local-archive }}
  result:
    description: "'admitted' | 'rejected' | 'pull-failed'"
    value: ${{ steps.verdict.outputs.result || steps.pull.outputs.result }}
  pulled:
    # No verdict fallback: `pulled` is written ONLY by pull.tlisp (both the
    # false and true terminals), never by verdict.tlisp, so there is no second
    # side to fall back to.
    description: "'true' iff the archive was pulled from the registry"
    value: ${{ steps.pull.outputs.pulled }}

runs:
  using: composite
  steps:
    # ── determinate: false — ALIGNED WITH actions/doca (2026-07-31) ──────────
    # This step used the installer's DEFAULTS, i.e. Determinate Nix, and the Zot
    # mirror died on it. From hardened-images run 30648147453:
    #
    #   WARN SelfTest([ShellFailed { shell: Sh, ... }, ShellFailed { shell: Bash, ...}])
    #   Stack size hard limit is 10485760, which is less than the desired 62914560
    #   error: cannot connect to socket at '/nix/var/nix/daemon-socket/socket'
    #
    # The installer's OWN self-test failed for both shells and the job continued
    # anyway, so the later `nix run` had no daemon to talk to and doca never
    # started. That stack-size line is a Determinate-Nix message; upstream nix
    # does not emit it.
    #
    # actions/doca runs the SAME `nix run github:pleme-io/substrate#oci-push`
    # and pins `determinate: false` + `sandbox = relaxed`. Matching a sibling
    # that works beats inventing a third configuration.
    #
    # NOT VERIFIED IN CI YET — it cannot be tested locally, and the previous
    # behaviour is a hard failure, so this is a change from "known broken" to
    # "matches the known-working sibling", not a proven fix. If the mirror still
    # fails, read the installer's self-test lines FIRST: they were present and
    # ignored last time.
    - uses: DeterminateSystems/nix-installer-action@main
      with:
        determinate: false
        extra-conf: |
          sandbox = relaxed

    # image-scan (stage 2, below) installs its own trivy -- this action no
    # longer needs to, now that it delegates scanning to it instead of
    # duplicating the scan+gate logic.
    # NO TOOL-INSTALL STEP, deliberately. This used to run
    #   command -v skopeo || nix profile install …#skopeo
    # which is an imperative install of a third-party binary at job time --
    # the exact thing ★★ HERMETIC SUPPLY CHAIN forbids ("a pleme-io/actions
    # action never installs a binary at job time"). We bake, we do not
    # install. The pull now uses doca (pleme-io/substrate#oci-push) resolved
    # by `nix run`, which is content-addressed rather than a mutation of the
    # runner, and is the same way this action's already-converted sibling
    # zot-push obtains it.

    # ── Stage 1: pull the image into a local docker-archive. Hard-fails
    # (no continue-on-error) on a pull failure -- that's terminal, so the
    # scan + verdict stages below never run, and pull.tlisp itself emits
    # this action's full output contract before exiting. See pull.tlisp.
    - name: Load stdlib + pull.tlisp
      id: pull-src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          curl -sL https://raw.githubusercontent.com/pleme-io/actions/main/_tlisp-stdlib/stdlib.tlisp
          echo
          cat ${{ github.action_path }}/pull.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: pull
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.pull-src.outputs.script }}
      env:
        REF: ${{ inputs.ref }}
        DEST: ${{ inputs.dest }}
        SRC_CA_CERT_URL: ${{ inputs.src-ca-cert-url }}
        SRC_CA_CERT_DIR: ${{ inputs.src-ca-cert-dir }}
        SRC_CA_CERT_TOKEN: ${{ inputs.src-ca-cert-token }}
        SRC_INSECURE: ${{ inputs.src-insecure }}
        SRC_USER: ${{ inputs.src-user }}
        SRC_PASS: ${{ inputs.src-pass }}
        # doca reads these directly. Passing the token as ENV rather than on the
        # command line keeps it out of /proc/<pid>/cmdline and `ps`, which are
        # world-readable on the runner -- GitHub's log masking does not cover the
        # process table. Empty is treated as unset by doca's own env_input, so
        # the anonymous path for a public source is unaffected.
        INPUT_USER: ${{ inputs.src-user }}
        INPUT_PASS: ${{ inputs.src-pass }}
        DOCA_REF: ${{ inputs.doca-ref }}

    # ── Stage 2: scan the PULLED bytes via image-scan -- the fleet's one
    # canonical severity classification + fail-on-severity gate (real
    # jq-parsed against trivy's actual JSON shape; hard-fails on a broken
    # or unreachable scan rather than defaulting to "clean"; forces the
    # strictest threshold on a malformed fail-on-severity value). This
    # action never re-implements any of that -- see verdict.tlisp's header
    # for the history of why it used to (a stale, never-matching substring
    # classifier) and why that was wrong.
    #
    # continue-on-error: true is deliberate -- see verdict.tlisp's header
    # for exactly why (so a REJECTED image still lets this action emit its
    # typed admitted=false/result=rejected contract, and so the verdict
    # stage below is the one true arbiter of this action's own exit code,
    # not an implicit propagation this composite's own machinery might get
    # subtly wrong on a future edit).
    # @main, not @v1 -- image-scan was added after v1 was tagged
    # (2026-05-22); the action directory doesn't exist at that ref at all.
    # Confirmed live 2026-07-21: a real vendor-image-mirror run failed
    # here with "Can't find 'action.yml' ... for action
    # 'pleme-io/actions/image-scan@v1'" -- same stale-tag bug class as
    # this file's own zot-pull-scan@v1 reference in the README, fixed
    # alongside this.
    - name: Scan pulled archive (delegates to image-scan's canonical Trivy gate)
      id: scan
      continue-on-error: true
      uses: pleme-io/actions/image-scan@main
      with:
        image-ref: ${{ inputs.ref }}
        local-archive: ${{ inputs.dest }}
        fail-on-severity: ${{ inputs.fail-on-severity }}
        ignore-unfixed: ${{ inputs.ignore-unfixed }}
        ignore-file: ${{ inputs.ignore-file }}
        # Without this line the faucet gate and the publishing gate answer the
        # same findings differently -- see this action's `vex` input for the
        # measured run where that made a released image unmirrorable.
        vex: ${{ inputs.vex }}

    # ── Stage 3: the verdict arbiter. Translates steps.scan.outcome into
    # this action's typed admitted/result vocabulary AND re-asserts the
    # pass/fail decision as ITS OWN exit code -- see verdict.tlisp's header
    # for why this explicit re-derivation exists instead of trusting
    # continue-on-error's interaction with the rest of this composite to
    # propagate correctly on its own.
    - name: Load stdlib + verdict.tlisp
      id: verdict-src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          curl -sL https://raw.githubusercontent.com/pleme-io/actions/main/_tlisp-stdlib/stdlib.tlisp
          echo
          cat ${{ github.action_path }}/verdict.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: verdict
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.verdict-src.outputs.script }}
      env:
        SCAN_OUTCOME: ${{ steps.scan.outcome }}
        SCAN_SEVERITY: ${{ steps.scan.outputs.severity }}
        SCAN_VULN_COUNT: ${{ steps.scan.outputs.vuln-count }}
        DEST: ${{ inputs.dest }}
