name: 'pleme-io · ansible-collection-build'
description: 'Build an Ansible collection tarball via substrate flake (nix run .#build)'
branding:
  icon: 'box'
  color: 'orange'

outputs:
  tarball-path:
    description: "Path to the built collection tarball"
    value: ${{ steps.build.outputs.tarball-path }}
  version:
    description: "Collection version (from galaxy.yml)"
    value: ${{ steps.build.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Nix (DeterminateSystems)
      uses: DeterminateSystems/nix-installer-action@main

    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/ansible-collection-build.tlisp"
        {
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - name: Build collection
      id: build
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
