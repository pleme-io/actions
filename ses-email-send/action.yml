name: 'pleme-io · ses-email-send'
description: 'Send transactional email via AWS SES.'
branding: { icon: 'mail', color: 'orange' }

inputs:
  region:
    required: false
    default: "us-east-1"
  from:
    required: true
  to:
    required: true
  subject:
    required: true
  body:
    required: true

outputs:
  message-id:
    value: ${{ steps.run.outputs.message-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/ses-email-send.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        REGION: ${{ inputs.region }}
        FROM_ARG: ${{ inputs.from }}
        TO_ARG: ${{ inputs.to }}
        SUBJECT: ${{ inputs.subject }}
        BODY: ${{ inputs.body }}
