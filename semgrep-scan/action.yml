name: 'pleme-io · semgrep-scan'
description: 'Semgrep SAST scan with configurable rule set.'
branding: { icon: 'shield', color: 'red' }

inputs:
  config:
    required: false
    default: "auto"
  fail-on-finding:
    required: false
    default: "true"

outputs:
  findings-count:
    value: ${{ steps.run.outputs.findings-count }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: { python-version: "3.x" }
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/semgrep-scan.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CONFIG: ${{ inputs.config }}
        FAIL_ON_FINDING: ${{ inputs.fail-on-finding }}
