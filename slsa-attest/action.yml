name: 'pleme-io · slsa-attest'
description: 'Generate SLSA provenance attestation for a build artifact (Level 3 via in-toto).'
branding: { icon: 'shield', color: 'green' }

inputs:
  artifact-path:
    required: true
  predicate-type:
    required: false
    default: "https://slsa.dev/provenance/v1"

outputs:
  attestation-path:
    value: ${{ steps.run.outputs.attestation-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/slsa-attest.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        ARTIFACT_PATH: ${{ inputs.artifact-path }}
        PREDICATE_TYPE: ${{ inputs.predicate-type }}
