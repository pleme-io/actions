name: 'pleme-io · rust-toolchain'
description: >-
  Put a Rust toolchain on PATH on any pleme-io runner. GitHub-hosted runners
  use dtolnay/rust-toolchain; self-hosted NixOS runners build the same
  toolchain with nix, because rustup-init is a dynamically linked binary that
  NixOS cannot execute.
branding: { icon: 'tool', color: 'orange' }

inputs:
  toolchain:
    description: "stable | beta | nightly | an exact stable version such as 1.89.0"
    required: false
    default: "stable"
  components:
    description: "Comma-separated extra components, e.g. 'rustfmt, clippy'"
    required: false
    default: ""
  targets:
    description: "Comma-separated extra targets, e.g. 'wasm32-unknown-unknown'"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - if: runner.environment != 'github-hosted'
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        out=$(nix --extra-experimental-features 'nix-command flakes' build --impure --no-link --print-out-paths --file "${{ github.action_path }}/toolchain.nix" --argstr toolchain "$TOOLCHAIN" --argstr components "$COMPONENTS" --argstr targets "$TARGETS")
        echo "$out/bin" >> "$GITHUB_PATH"
