name: 'pleme-io · jira-issue-create'
description: 'Create a Jira issue via REST API.'
branding: { icon: 'alert-circle', color: 'blue' }

inputs:
  base-url:
    required: true
  email:
    required: true
  token:
    required: true
  project:
    required: true
  summary:
    required: true

outputs:
  key:
    value: ${{ steps.run.outputs.key }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/jira-issue-create.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        BASE_URL: ${{ inputs.base-url }}
        EMAIL: ${{ inputs.email }}
        TOKEN: ${{ inputs.token }}
        PROJECT: ${{ inputs.project }}
        SUMMARY: ${{ inputs.summary }}
