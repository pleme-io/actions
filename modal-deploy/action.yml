name: 'pleme-io · modal-deploy'
description: 'Deploy a Modal function/app.'
branding: { icon: 'cloud', color: 'blue' }

inputs:
  token-id:
    required: true
  token-secret:
    required: true
  entry:
    required: false
    default: "main.py"

outputs:
  deployed:
    value: ${{ steps.run.outputs.deployed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/modal-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        TOKEN_ID: ${{ inputs.token-id }}
        TOKEN_SECRET: ${{ inputs.token-secret }}
        ENTRY: ${{ inputs.entry }}
