name: 'pleme-io · blue-build-plan'
description: >-
  Read nix's dry-run plan for an installable: derivations this runner would
  build, paths it would fetch from a cache, and which builds compile Rust. With
  blue-only, a Rust build outside the toolchain fails the step (the toolchain
  must come from a cache); with max-builds, so does a plan over the budget. blue
  docs/BUILD-ASSURANCE.md §5 and §6. Rust is recognized by derivation name.
branding: { icon: 'layers', color: 'blue' }

inputs:
  installable:
    description: 'What to plan, e.g. .#checks.x86_64-linux.project.'
    required: true
  blue-only:
    description: '"true" fails the step when any Rust derivation would build here.'
    required: false
    default: 'false'
  max-builds:
    description: 'The most derivations this runner may build. Empty is no budget.'
    required: false
    default: ''
  rust-marks:
    description: 'Name fragments that mark a Rust derivation, one per line. Empty uses rust_, cargo-, -deps-, crate-.'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run in.'
    required: false
    default: '.'
  blue:
    description: 'The blue flake blue-setup installs when blue is not on PATH.'
    required: false
    default: 'github:pleme-io/blue'
  github-token:
    description: 'Passed to blue-setup for private flakes.'
    required: false
    default: ''

outputs:
  will-build:
    description: 'Derivations the plan builds on this runner.'
    value: ${{ steps.run.outputs.will-build }}
  will-fetch:
    description: 'Store paths the plan fetches from a cache.'
    value: ${{ steps.run.outputs.will-fetch }}
  rust-builds:
    description: 'Derivations in will-build that compile Rust.'
    value: ${{ steps.run.outputs.rust-builds }}

runs:
  using: composite
  steps:
    - id: has
      shell: bash
      run: if command -v blue >/dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.has.outputs.found != 'true'
      uses: pleme-io/actions/blue-setup@main
      with:
        blue: ${{ inputs.blue }}
        github-token: ${{ inputs.github-token }}
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_INSTALLABLE: ${{ inputs.installable }}
        INPUT_BLUE_ONLY: ${{ inputs.blue-only }}
        INPUT_MAX_BUILDS: ${{ inputs.max-builds }}
        INPUT_RUST_MARKS: ${{ inputs.rust-marks }}
      run: blue run "${{ github.action_path }}/run.b"
