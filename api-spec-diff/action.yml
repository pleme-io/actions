name: 'pleme-io · api-spec-diff'
description: 'Detect breaking changes in an OpenAPI / GraphQL / gRPC spec between base + head refs. Useful PR-time gate for API surface stability.'
branding: { icon: 'git-pull-request', color: 'blue' }

inputs:
  spec-path:
    required: true
    description: "Path to spec file (.yaml/.json/.proto)"
  base-ref:
    required: false
    default: "main"
  fail-on-breaking:
    required: false
    default: "true"

outputs:
  breaking-count:
    value: ${{ steps.run.outputs.breaking-count }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with: { fetch-depth: 0 }
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/api-spec-diff.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SPEC_PATH: ${{ inputs.spec-path }}
        BASE_REF: ${{ inputs.base-ref }}
        FAIL_ON_BREAKING: ${{ inputs.fail-on-breaking }}
