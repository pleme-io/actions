name: 'pleme-io · apprise-notify'
description: 'Send via Apprise (any of 100+ services).'
branding: { icon: 'message-circle', color: 'green' }

inputs:
  url:
    required: true
  title:
    required: true
  body:
    required: true

outputs:
  sent:
    value: ${{ steps.run.outputs.sent }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/apprise-notify.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        URL_ARG: ${{ inputs.url }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
