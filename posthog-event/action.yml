name: 'pleme-io · posthog-event'
description: 'POST an event to PostHog for product analytics.'
branding: { icon: 'bar-chart', color: 'purple' }

inputs:
  api-key:
    required: true
  project-id:
    required: true
  event:
    required: true
  distinct-id:
    required: false
    default: "ci"

outputs:
  sent:
    value: ${{ steps.run.outputs.sent }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/posthog-event.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        API_KEY: ${{ inputs.api-key }}
        PROJECT_ID: ${{ inputs.project-id }}
        EVENT_ARG: ${{ inputs.event }}
        DISTINCT_ID: ${{ inputs.distinct-id }}
