name: 'pleme-io · sbom-generate'
description: 'Generate a CycloneDX or SPDX SBOM from the repo via syft. Universal — works on any source tree (Rust, Node, Python, Helm, Docker context, etc).'
branding:
  icon: 'file-text'
  color: 'gray-dark'

inputs:
  output-format:
    description: "cyclonedx-json | spdx-json | syft-json"
    required: false
    default: "cyclonedx-json"
  output-file:
    description: "Path to write the SBOM"
    required: false
    default: "sbom.cyclonedx.json"

outputs:
  sbom-path:
    description: "Path of the written SBOM"
    value: ${{ steps.sbom.outputs.sbom-path }}
  component-count:
    description: "Number of components in the SBOM"
    value: ${{ steps.sbom.outputs.component-count }}

runs:
  using: composite
  steps:
    - name: Install syft
      shell: bash
      run: |
        # PINNED TWICE: the SCRIPT at a tag, and the VERSION it installs. Both
        # were unpinned -- install.sh came from `main`, and its version arg
        # defaults to "latest". An SBOM is a provenance claim, so a syft nobody
        # can name produces a component list nobody can reproduce.
        # Verified 2026-08-01: the tagged script URL is HTTP 200; v1.50.0 is
        # the current release.
        #
        # DESTINATION IS $RUNNER_TEMP/bin, NOT /usr/local/bin, and that is a
        # correctness fix rather than a preference: the fleet's self-hosted ARC
        # runners do not run as root, so `-b /usr/local/bin` dies with
        #   install: cannot create regular file '/usr/local/bin/syft': Permission denied
        #   [error] failed to install syft
        # and the step fails before syft is ever invoked. Measured on
        # caixa-tempfile 2026-08-17. $RUNNER_TEMP is writable on both
        # GitHub-hosted and ARC runners, so this works on either.
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.50.0/install.sh \
          | sh -s -- -b "$RUNNER_TEMP/bin" v1.50.0
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: sbom
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        OUTPUT_FORMAT: ${{ inputs.output-format }}
        OUTPUT_FILE: ${{ inputs.output-file }}
