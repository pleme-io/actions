name: 'pleme-io · confluence-page-create'
description: 'Create a Confluence page via REST API.'
branding: { icon: 'file-text', color: 'blue' }

inputs:
  base-url:
    required: true
  user:
    required: true
  api-token:
    required: true
  space:
    required: true
  title:
    required: true
  body:
    required: true

outputs:
  page-id:
    value: ${{ steps.run.outputs.page-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/confluence-page-create.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        BASE_URL: ${{ inputs.base-url }}
        USER_ARG: ${{ inputs.user }}
        API_TOKEN: ${{ inputs.api-token }}
        SPACE: ${{ inputs.space }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
