name: 'pleme-io · jupyter-notebook-render'
description: 'Execute + export a Jupyter notebook to HTML.'
branding: { icon: 'book', color: 'orange' }

inputs:
  notebook:
    required: true
  output-format:
    required: false
    default: "html"

outputs:
  output-path:
    value: ${{ steps.run.outputs.output-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/jupyter-notebook-render.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        NOTEBOOK: ${{ inputs.notebook }}
        OUTPUT_FORMAT: ${{ inputs.output-format }}
