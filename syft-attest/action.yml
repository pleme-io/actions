name: 'pleme-io · syft-attest'
description: 'Generate an in-toto attestation containing an SBOM via syft.'
branding: { icon: 'shield', color: 'green' }

inputs:
  artifact:
    required: true
  output:
    required: false
    default: "attestation.json"

outputs:
  attestation-path:
    value: ${{ steps.run.outputs.attestation-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/syft-attest.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        ARTIFACT: ${{ inputs.artifact }}
        OUTPUT_ARG: ${{ inputs.output }}
