name: 'pleme-io · opentelemetry-trace-emit'
description: 'Emit an OTLP trace span for this workflow run.'
branding: { icon: 'activity', color: 'blue' }

inputs:
  endpoint:
    required: true
  service-name:
    required: true
  span-name:
    required: true

outputs:
  trace-id:
    value: ${{ steps.run.outputs.trace-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/opentelemetry-trace-emit.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        SERVICE_NAME: ${{ inputs.service-name }}
        SPAN_NAME: ${{ inputs.span-name }}
