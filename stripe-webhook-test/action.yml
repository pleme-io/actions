name: 'pleme-io · stripe-webhook-test'
description: 'Send a Stripe webhook event from CLI for integration tests.'
branding: { icon: 'play', color: 'purple' }

inputs:
  event:
    required: true
  api-key:
    required: true

outputs:
  sent:
    value: ${{ steps.run.outputs.sent }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/stripe-webhook-test.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        EVENT_ARG: ${{ inputs.event }}
        API_KEY: ${{ inputs.api-key }}
