name: 'pleme-io · helm-publish'
description: 'Publish a Helm chart to an OCI registry (default ghcr.io/pleme-io/helm); skip if (name, version) already exists.'
branding:
  icon: 'upload'
  color: 'blue'

inputs:
  registry:
    description: "OCI registry to push to"
    required: false
    default: "ghcr.io/pleme-io/helm"
  registry-username:
    description: "Registry login username (default github.actor)"
    required: false
    default: ""
  dry-run:
    description: "Package the chart but don't push"
    required: false
    default: "false"
  chart-path:
    description: >-
      Directory holding the chart's Chart.yaml, relative to the repo root.
      Sibling of helm-bump's input of the same name and for the same measured
      reason: this action read `Chart.yaml` from the process CWD, i.e. it
      assumed the chart sat at the REPO ROOT, and ZERO of the 18 pleme-io
      chart repos are shaped that way — every one uses `charts/<name>/`.
      Default "." preserves the previous behaviour byte-for-byte.
    required: false
    default: "."

outputs:
  shipped:
    value: ${{ steps.ship.outputs.shipped }}

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@main

    - name: Install Helm
      uses: azure/setup-helm@v4
      with:
        version: latest

    - name: Install yq
      shell: bash
      run: |
        # Nix-installed, not a raw GitHub-release wget (theory/NIX-HARDENING.md
        # §VI) -- exact-pinned to nixos-24.05. `yq-go` is nixpkgs' name for
        # mikefarah/yq (the Go implementation this action's scripts expect).
        nix profile install github:NixOS/nixpkgs/nixos-24.05#yq-go

    - name: Registry login
      shell: bash
      run: |
        user="${{ inputs.registry-username }}"
        [ -z "$user" ] && user="${{ github.actor }}"
        echo "$REGISTRY_PASSWORD" | helm registry login \
          ghcr.io --username "$user" --password-stdin
      env:
        REGISTRY_PASSWORD: ${{ env.GHCR_TOKEN }}

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - id: ship
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
        # The chart directory IS the working directory — run.tlisp reads
        # `Chart.yaml`, runs `helm dependency update .`, `helm package .` and
        # pushes `./<name>-<version>.tgz`, all by bare relative name.
        working-directory: ${{ inputs.chart-path }}
      env:
        REGISTRY: ${{ inputs.registry }}
        DRY_RUN: ${{ inputs.dry-run }}
