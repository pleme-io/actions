name: 'pleme-io · wasm-build'
description: 'Build a Rust crate to wasm32 (wasm32-unknown-unknown / wasm32-wasi). Universal — wraps cargo + wasm-pack when needed.'
branding: { icon: 'package', color: 'purple' }

inputs:
  package:
    description: "Cargo package to build (empty = workspace default)"
    required: false
    default: ""
  target:
    description: "wasm32-unknown-unknown | wasm32-wasi | wasm32-wasip1"
    required: false
    default: "wasm32-unknown-unknown"
  release:
    required: false
    default: "true"
  wasm-pack:
    description: "Use wasm-pack (true) or plain cargo (false)"
    required: false
    default: "false"

outputs:
  artifact-path:
    description: "Directory holding the built wasm artifacts. Emitted only after it is confirmed to exist."
    value: ${{ steps.run.outputs.artifact-path }}

runs:
  using: composite
  steps:
    # No `actions/checkout` here, deliberately: the caller has already checked
    # out (cargo has to have something to build) and checkout v4 CLEANS the
    # destination, which would discard whatever earlier steps generated. The
    # loader below reads only from github.action_path, which is always present.
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}
    # Only the wasm-pack path needs Nix. It used to run on every invocation,
    # including the default plain-cargo one, which paid a full Nix install for
    # nothing. Gating it is also what keeps the hermetic-supply-chain debt
    # confined to the branch that actually incurs it.
    - if: inputs.wasm-pack == 'true'
      uses: DeterminateSystems/nix-installer-action@main
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        PACKAGE: ${{ inputs.package }}
        TARGET: ${{ inputs.target }}
        RELEASE: ${{ inputs.release }}
        WASM_PACK: ${{ inputs.wasm-pack }}
