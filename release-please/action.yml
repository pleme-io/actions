name: 'pleme-io · release-please'
description: 'Run google/release-please-action.'
branding: { icon: 'tag', color: 'green' }

inputs:
  release-type:
    required: false
    default: "rust"
  package-name:
    required: true

outputs:
  release-pr-url:
    value: ${{ steps.run.outputs.release-pr-url }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/release-please.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        RELEASE_TYPE: ${{ inputs.release-type }}
        PACKAGE_NAME: ${{ inputs.package-name }}
