name: 'pleme-io · infracost-comment'
description: 'Run infracost on a Terraform plan + comment cost diff on PR.'
branding: { icon: 'bar-chart', color: 'blue' }

inputs:
  api-key:
    required: true
  workdir:
    required: false
    default: "."
  compare-to:
    required: false
    default: "main"

outputs:
  monthly-diff:
    value: ${{ steps.run.outputs.monthly-diff }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/infracost-comment.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        API_KEY: ${{ inputs.api-key }}
        WORKDIR: ${{ inputs.workdir }}
        COMPARE_TO: ${{ inputs.compare-to }}
