name: 'pleme-io · blue-check'
description: >-
  Check every blue file against the check stage and the canonical form. Each
  diagnostic from `blue check --format json` becomes an annotation at its span;
  a file `blue fmt --check` refuses is an error. The step summary lists each
  file with one symbol. Fails on any error or non-canonical file.
branding: { icon: 'check-square', color: 'blue' }

inputs:
  paths:
    description: 'Files to check, one per line. Empty checks every tracked .b file (git ls-files).'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run in.'
    required: false
    default: '.'
  blue-path:
    description: 'BLUE_PATH for project bidamas, colon-separated. Empty uses the toolchain''s compiled-in distribution only.'
    required: false
    default: ''
  blue:
    description: 'The blue flake blue-setup installs when blue is not on PATH.'
    required: false
    default: 'github:pleme-io/blue'
  github-token:
    description: 'Passed to blue-setup for private flakes.'
    required: false
    default: ''

outputs:
  files:
    description: 'Files checked.'
    value: ${{ steps.run.outputs.files }}
  errors:
    description: 'Error diagnostics across all files.'
    value: ${{ steps.run.outputs.errors }}
  warnings:
    description: 'Warning diagnostics across all files.'
    value: ${{ steps.run.outputs.warnings }}
  unformatted:
    description: 'Files not in canonical form.'
    value: ${{ steps.run.outputs.unformatted }}

runs:
  using: composite
  steps:
    - id: has
      shell: bash
      run: if command -v blue >/dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.has.outputs.found != 'true'
      uses: pleme-io/actions/blue-setup@main
      with:
        blue: ${{ inputs.blue }}
        github-token: ${{ inputs.github-token }}
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        BLUE_PATH: ${{ inputs.blue-path }}
      run: blue run "${{ github.action_path }}/run.b"
