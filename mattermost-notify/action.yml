name: 'pleme-io · mattermost-notify'
description: 'POST to a Mattermost webhook.'
branding: { icon: 'message-square', color: 'blue' }

inputs:
  webhook-url:
    required: true
  text:
    required: true
  channel:
    required: false
    default: ""

outputs:
  sent:
    value: ${{ steps.run.outputs.sent }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/mattermost-notify.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        TEXT: ${{ inputs.text }}
        CHANNEL: ${{ inputs.channel }}
