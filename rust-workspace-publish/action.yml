name: 'pleme-io · rust-workspace-publish'
description: 'Ship every workspace member to the Rust registry in topological (leaves-first) dependency order, derived from cargo metadata with dev-deps excluded and exact-pinned targets leading their batch. Auto-renames any conflicting crate to pleme-io-<original> + commits the rename back to main + retries. A member that fails permanently costs exactly that member; the rest still ship and the run reports red at the end. Pure tlisp logic, no shell beyond install glue.'
branding:
  icon: 'upload'
  color: 'blue'

inputs:
  dry-run:
    description: "Run the registry ship as --dry-run only (no upload)"
    required: false
    default: "false"
  no-verify:
    description: "Skip the verification compile step. true keeps the ship loop fast + tolerant of edge cases the verify step trips on; false uses the registry's default verification."
    required: false
    default: "true"
  rename-prefix:
    description: "Prefix used when auto-renaming a conflicting crate. Default 'pleme-io-' lands names under the org's namespace."
    required: false
    default: "pleme-io-"
  max-rename-retries:
    description: "Maximum number of conflict-rename retry iterations. Default 20 covers a 15-crate workspace with safety margin."
    required: false
    default: "20"
  publish-mode:
    description: "full (default) = bump+ship on push, riding crates.io's new-crate rate limit in-job (capped at 30m); drip = a cron tick that publishes only what current capacity allows and defers the rest (never sleeps in-job). The two compose to bootstrap a large workspace hands-off, never red."
    required: false
    default: "full"

outputs:
  shipped-count:
    description: "Number of workspace members successfully shipped"
    value: ${{ steps.ship.outputs.shipped-count }}
  renamed-crates:
    description: "Comma-separated list of crates that got auto-renamed"
    value: ${{ steps.ship.outputs.renamed-crates }}
  pending-crates:
    description: "Comma-separated crates left for the next capacity window (rate-limited / dep-deferred). Empty when the bootstrap is complete."
    value: ${{ steps.ship.outputs.pending-crates }}
  failed-crates:
    description: "Comma-separated crates that failed PERMANENTLY (unrecognized error / rename failure). A failure no longer aborts the pass — every other member still ships — so this names exactly which members did not, and a non-empty value means the step exited red."
    value: ${{ steps.ship.outputs.failed-crates }}
  bootstrap-complete:
    description: "true when every workspace member is on the registry (nothing left to drip) AND nothing failed permanently."
    value: ${{ steps.ship.outputs.bootstrap-complete }}

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Load run.tlisp
      id: src
      shell: bash
      run: |
        # Composed to a FILE, not an output.
        #
        # `script:` rides to the runner as an ENV VAR, and Linux caps a single
        # env var / argument at MAX_ARG_STRLEN = 128 KB. stdlib (92 KB) plus
        # this run.tlisp is 138 KB, so the step died with "Argument list too
        # long" and took tatara-lisp's release with it. That ceiling was never
        # declared anywhere; it was discovered by crossing it.
        #
        # A path costs none of it, and also drops the FIXED `TLISP_EOF`
        # heredoc marker (an injection whenever content is influenced from
        # outside) and stops the whole script being echoed into the step log.
        DEST="${RUNNER_TEMP}/rust-workspace-publish-composed.tlisp"
        # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
        cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp" > "$DEST"
        echo >> "$DEST"
        cat "${{ github.action_path }}/run.tlisp" >> "$DEST"
        echo "path=$DEST" >> "$GITHUB_OUTPUT"

    - name: Ship workspace
      id: ship
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.path }}
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        NO_VERIFY: ${{ inputs.no-verify }}
        RENAME_PREFIX: ${{ inputs.rename-prefix }}
        MAX_RENAME_RETRIES: ${{ inputs.max-rename-retries }}
        PUBLISH_MODE: ${{ inputs.publish-mode }}
