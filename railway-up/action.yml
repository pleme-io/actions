name: 'pleme-io · railway-up'
description: 'Deploy via railway up.'
branding: { icon: 'cloud', color: 'purple' }

inputs:
  service:
    required: true
  environment:
    required: false
    default: "production"

outputs:
  deployed:
    value: ${{ steps.run.outputs.deployed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        SERVICE: ${{ inputs.service }}
        ENVIRONMENT: ${{ inputs.environment }}
