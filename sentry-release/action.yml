name: 'pleme-io · sentry-release'
description: 'Create a Sentry release + associate commits.'
branding: { icon: 'tag', color: 'red' }

inputs:
  auth-token:
    required: true
  org:
    required: true
  project:
    required: true
  version:
    required: true

outputs:
  release-version:
    value: ${{ steps.run.outputs.release-version }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/sentry-release.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        AUTH_TOKEN: ${{ inputs.auth-token }}
        ORG: ${{ inputs.org }}
        PROJECT: ${{ inputs.project }}
        VERSION: ${{ inputs.version }}
