name: 'pleme-io · airtable-record-create'
description: 'Create a record in an Airtable base.'
branding: { icon: 'database', color: 'green' }

inputs:
  api-key:
    required: true
  base-id:
    required: true
  table:
    required: true
  fields-json:
    required: true

outputs:
  record-id:
    value: ${{ steps.run.outputs.record-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/airtable-record-create.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        API_KEY: ${{ inputs.api-key }}
        BASE_ID: ${{ inputs.base-id }}
        TABLE: ${{ inputs.table }}
        FIELDS_JSON: ${{ inputs.fields-json }}
