name: 'pleme-io · git-push-with-token'
description: 'Rewrite origin URL with the given token, push branch + tags so downstream workflows can be triggered'
branding:
  icon: 'git-branch'
  color: 'gray-dark'

inputs:
  token:
    description: "Token used as x-access-token in the rewritten origin URL"
    required: true
  branch:
    description: "Branch to push (default: main)"
    required: false
    default: main
  push-tags:
    description: "Whether to also push --tags (default: true)"
    required: false
    default: "true"
  # Kept to ONE line: this description is rendered verbatim into a markdown
  # table cell by pleme-doc-gen. The reasoning lives in run.tlisp, next to the
  # code it governs.
  regenerable-paths:
    description: "Whitespace-separated DERIVED paths (e.g. Cargo.lock Cargo.gen.lock). A retry-rebase conflict confined to these resolves in favour of the replayed commit instead of aborting; a conflict anywhere else still aborts. Empty (default) = always abort."
    required: false
    default: ""

runs:
  using: docker
  image: docker://ghcr.io/pleme-io/action-git-push-with-token:latest
  env:
    GIT_PUSH_TOKEN:     ${{ inputs.token }}
    BRANCH:             ${{ inputs.branch }}
    PUSH_TAGS:          ${{ inputs.push-tags }}
    REGENERABLE_PATHS:  ${{ inputs.regenerable-paths }}
