name: 'pleme-io · k8s-rollout-wait'
description: 'Wait for a single k8s rollout to converge. Sibling of kubectl-apply (which applies + waits on detected resources); this targets a single named resource for finer-grained gating.'
branding: { icon: 'clock', color: 'blue' }

inputs:
  resource:
    description: "kind/name (e.g. deployment/myapp)"
    required: true
  namespace:
    required: false
    default: "default"
  timeout:
    required: false
    default: "300s"

outputs:
  rolled-out:
    value: ${{ steps.run.outputs.rolled-out }}

runs:
  using: composite
  steps:
    - uses: azure/setup-kubectl@v4
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/k8s-rollout-wait.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        RESOURCE: ${{ inputs.resource }}
        NAMESPACE: ${{ inputs.namespace }}
        TIMEOUT: ${{ inputs.timeout }}
