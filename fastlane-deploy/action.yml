name: 'pleme-io · fastlane-deploy'
description: 'Run a fastlane lane to deploy iOS/Android build.'
branding: { icon: 'smartphone', color: 'red' }

inputs:
  lane:
    required: true
  working-directory:
    required: false
    default: "."

outputs:
  deployed:
    value: ${{ steps.run.outputs.deployed }}

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@v1
      with: { ruby-version: "3.2" }
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/fastlane-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        LANE: ${{ inputs.lane }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
