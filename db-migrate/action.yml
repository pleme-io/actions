name: 'pleme-io · db-migrate'
description: 'Polymorphic DB migration — sqlx-migrate / alembic / knex / etc by detect.'
branding: { icon: 'database', color: 'blue' }

inputs:
  workdir:
    required: false
    default: "."
  direction:
    required: false
    default: "up"

outputs:
  applied-count:
    value: ${{ steps.run.outputs.applied-count }}

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@main
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/db-migrate.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WORKDIR: ${{ inputs.workdir }}
        DIRECTION: ${{ inputs.direction }}
