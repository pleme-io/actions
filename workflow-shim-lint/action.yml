name: 'pleme-io · workflow-shim-lint'
description: 'Report consumer workflows that are hand-authored instead of thin shims over a catalogued pleme-io/substrate reusable workflow. The consumer-side half of CATALOG REFLECTION.'
branding: { icon: 'git-merge', color: 'blue' }

inputs:
  paths:
    description: "Glob of consumer workflow files to scan"
    required: false
    default: ".github/workflows/*.yml"
  shell-budget:
    description: >-
      Maximum total shell lines allowed inside `run:` bodies across the scanned
      workflows. EMPTY (the default) reports the count without enforcing it,
      which is what lets every existing consumer inherit the measurement
      without turning red on the day it ships.

      Resolution: this input wins, else the repo's committed
      `.github/shell-budget`, else empty. Prefer the committed file — a ratchet
      whose value lives in the caller's YAML is a number nobody can see from
      inside the repo it constrains, and lowering it becomes someone else's
      edit.

      It is a RATCHET: set it to what a repo measures today, then lower it as
      shell is moved into actions. Raising it to admit more shell is the one
      edit that defeats the point — absorption is measured in shell removed,
      not in workflows that merely call the catalog, and a shim that calls
      auto-release while carrying 40 lines of its own `run:` passes the shim
      test and is not absorbed.
    required: false
    default: ""
  fail-on-violation:
    description: >-
      Fail the job on a hand-authored workflow.

      Defaults to FALSE, deliberately and temporarily. Measured 2026-08-04:
      144 hand-authored workflows across 99 pleme-io-authored repos (plus 176
      more in vendored upstream forks, which are out of scope). Defaulting to
      true would red every one of those 99 repos the moment this lands, which
      punishes repos for a backlog they did not create and trains people to
      ignore the gate.

      The destination is `true`, once those 144 are converted or waived. A
      warn-only gate is only-mitigated and drifts — this default is a rollout
      step with a named end state, not the end state.
    required: false
    default: "false"

outputs:
  violations:
    description: "Count of hand-authored workflows found"
    value: ${{ steps.run.outputs.violations }}
  shell-lines:
    description: "Total shell lines found inside `run:` bodies. Emitted always, so the fleet number is observable even where the budget is unset."
    value: ${{ steps.run.outputs.shell-lines }}
  files-scanned:
    value: ${{ steps.run.outputs.files-scanned }}
  waived:
    description: "Count carrying an explicit skip-workflow-shim waiver"
    value: ${{ steps.run.outputs.waived }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/workflow-shim-lint.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PATHS: ${{ inputs.paths }}
        FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
