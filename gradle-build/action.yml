name: 'pleme-io · gradle-build'
description: 'Build a Gradle project (Java/Kotlin/Scala).'
branding: { icon: 'package', color: 'green' }

inputs:
  tasks:
    required: false
    default: "build"
  workdir:
    required: false
    default: "."

outputs:
  built:
    value: ${{ steps.run.outputs.built }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/gradle-build.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        TASKS: ${{ inputs.tasks }}
        WORKDIR: ${{ inputs.workdir }}
