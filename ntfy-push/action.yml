name: 'pleme-io · ntfy-push'
description: 'Push a notification to ntfy.sh (mobile/ops alert).'
branding: { icon: 'message-circle', color: 'blue' }

inputs:
  topic:
    required: true
  server:
    required: false
    default: "https://ntfy.sh"
  message:
    required: true
  priority:
    required: false
    default: "default"

outputs:
  sent:
    value: ${{ steps.run.outputs.sent }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/ntfy-push.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        TOPIC: ${{ inputs.topic }}
        SERVER: ${{ inputs.server }}
        MESSAGE: ${{ inputs.message }}
        PRIORITY: ${{ inputs.priority }}
