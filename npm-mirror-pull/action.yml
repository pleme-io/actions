name: 'pleme-io · npm-mirror-pull'
description: 'Pull an npm tarball for offline mirroring.'
branding: { icon: 'download', color: 'red' }

inputs:
  package:
    required: true
  version:
    required: false
    default: "latest"
  output-dir:
    required: false
    default: "mirror/"

outputs:
  fetched:
    value: ${{ steps.run.outputs.fetched }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/npm-mirror-pull.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION_ARG: ${{ inputs.version }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
