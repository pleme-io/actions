name: 'pleme-io · substrate-bump'
description: 'Bump version using substrate flake `bump` app (nix run .#bump -- <type>)'
branding:
  icon: 'arrow-up-circle'
  color: 'green'

inputs:
  bump-type:
    description: "patch | minor | major"
    required: false
    default: patch
  release-paths:
    description: "Space-separated paths the bump app should touch (default: plugins/ meta/ galaxy.yml)"
    required: false
    default: "plugins/ meta/ galaxy.yml"

outputs:
  bumped:
    description: "true if a bump was performed, false if no-op"
    value: ${{ steps.bump.outputs.bumped }}
  new-version:
    description: "New version after bump (empty if no-op)"
    value: ${{ steps.bump.outputs.new-version }}

runs:
  using: composite
  steps:
    - name: Install Nix (DeterminateSystems)
      uses: DeterminateSystems/nix-installer-action@main

    # Load stdlib + run.tlisp into an output so the redistributable
    # tatara-script action can execute it without us re-implementing the
    # install path. The stdlib prepend is REQUIRED, not cosmetic: this
    # action's release-monotonicity check calls the shared `semver:` /
    # `git:` helpers, and without the prepend those names are simply
    # undefined at runtime — the check would crash instead of guarding,
    # which is the worst failure mode a gate can have.
    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Run substrate bump app
      id: bump
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        BUMP_TYPE: ${{ inputs.bump-type }}
        RELEASE_PATHS: ${{ inputs.release-paths }}
