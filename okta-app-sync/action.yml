name: 'pleme-io · okta-app-sync'
description: 'Sync Okta apps from a YAML catalog.'
branding: { icon: 'refresh-cw', color: 'blue' }

inputs:
  org:
    required: true
  token:
    required: true
  catalog-file:
    required: true

outputs:
  synced-count:
    value: ${{ steps.run.outputs.synced-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/okta-app-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        ORG_ARG: ${{ inputs.org }}
        TOKEN: ${{ inputs.token }}
        CATALOG_FILE: ${{ inputs.catalog-file }}
