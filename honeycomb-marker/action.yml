name: 'pleme-io · honeycomb-marker'
description: 'Add a Honeycomb marker (release/deploy correlation).'
branding: { icon: 'tag', color: 'purple' }

inputs:
  api-key:
    required: true
  dataset:
    required: true
  message:
    required: true
  type:
    required: false
    default: "release"
  url:
    required: false
    default: ""

outputs:
  # `marker-id` was declared here and NEVER WRITTEN by run.tlisp, so a caller
  # reading that key got "" for this action's whole life. (Deliberately NOT
  # spelling the forwarding expression out here: the contract gate's L5
  # ghost-step rule line-scans for `steps.<id>.outputs.<key>`, so prose that
  # quotes the pattern trips the gate it is documenting. Found the hard way.)
  # Removed rather than faked: no workflow anywhere reads it (checked),
  # and the only other declarer, newrelic-deploy-marker, is a 4-line stub
  # emitting the literal string "stub". Restoring it means reading the id out
  # of Honeycomb's create response — which webhook:post's own contract cannot
  # guarantee is JSON, so it needs a real decision, not a guess.
  #
  # `created` is what the script actually emits, and was NEVER DECLARED, so it
  # was dropped before the caller ever saw it. That gap is what kept the
  # two-boundary output contract red at HEAD.
  created:
    description: "true when the marker was created; false when the POST failed (the step also exits 1)."
    value: ${{ steps.run.outputs.created }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/honeycomb-marker.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        API_KEY: ${{ inputs.api-key }}
        DATASET: ${{ inputs.dataset }}
        MESSAGE: ${{ inputs.message }}
        TYPE_ARG: ${{ inputs.type }}
        URL_ARG: ${{ inputs.url }}
