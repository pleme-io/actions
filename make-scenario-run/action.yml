name: 'pleme-io · make-scenario-run'
description: 'Run a Make.com scenario via webhook.'
branding: { icon: 'play', color: 'purple' }

inputs:
  webhook-url:
    required: true
  payload-json:
    required: false
    default: "{}"

outputs:
  triggered:
    value: ${{ steps.run.outputs.triggered }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/make-scenario-run.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        PAYLOAD_JSON: ${{ inputs.payload-json }}
