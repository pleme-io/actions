name: 'pleme-io · cypress-test'
description: 'Run cypress run.'
branding: { icon: 'check-circle', color: 'gray-dark' }

inputs:
  config-file:
    required: false
    default: "cypress.config.js"
  workdir:
    required: false
    default: "."

outputs:
  passed:
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/cypress-test.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        WORKDIR: ${{ inputs.workdir }}
