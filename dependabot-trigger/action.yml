name: 'pleme-io · dependabot-trigger'
description: 'Trigger Dependabot to re-evaluate dependency updates via gh api.'
branding: { icon: 'refresh-cw', color: 'blue' }

inputs:
  package-ecosystem:
    required: false
    default: "all"

outputs:
  triggered:
    value: ${{ steps.run.outputs.triggered }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/dependabot-trigger.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PACKAGE_ECOSYSTEM: ${{ inputs.package-ecosystem }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
