name: 'pleme-io · package-visibility-gate'
description: >-
  Refuse to publish a package from a repository whose visibility would make
  that package bill the org''s one shared storage allowance. Public repos
  publish freely; a non-public repo must declare a typed reason. See
  README.md for why this is load-bearing rather than bookkeeping.
branding:
  icon: 'shield'
  color: 'red'

inputs:
  allow-private:
    description: >-
      A TYPED REASON to publish anyway from a non-public repo. Empty (the
      default) refuses. The fleet's `skip-<name>: <typed-reason>` grammar as an
      action input: an exception is written at the call site, so exceptions stay
      visible and countable. Time pressure is not a typed reason.
    required: false
    default: ""
  what:
    description: "What is being published, for the message (e.g. 'ghcr image')."
    required: false
    default: "package"
  mode:
    description: >-
      `enforce` (default) refuses. `warn` reports and continues — the survey
      half of the fleet's survey-then-ratchet ramp, as publishability-lint
      documents for its own first sweep. A caller in `warn` should carry a
      dated note saying what must be true before it flips.
    required: false
    default: "enforce"

# ── WHY THERE IS ALMOST NO SHELL HERE ──────────────────────────────────────
# ★★ NO-SHELL. The DECISION is three mutually exclusive `if:` expressions —
# declarative, evaluated by the runner, nothing to parse or quote. Each step's
# body is a single `echo` of one workflow command. Inputs reach those bodies
# through `env:` rather than `${{ }}` interpolation, so an input can never be
# spliced into the script text.
runs:
  using: composite
  steps:
    - name: Public repository — storage is free
      if: ${{ github.event.repository.visibility == 'public' }}
      shell: bash
      env:
        WHAT: ${{ inputs.what }}
      run: |
        echo "::notice title=package-visibility-gate::${WHAT}: repo is public — GHCR storage is free and unlimited."

    - name: Non-public, exception declared
      if: ${{ github.event.repository.visibility != 'public' && inputs.allow-private != '' }}
      shell: bash
      env:
        WHAT: ${{ inputs.what }}
        WHY: ${{ inputs.allow-private }}
        VIS: ${{ github.event.repository.visibility }}
      run: |
        echo "::warning title=package-visibility-gate::${WHAT}: publishing from a ${VIS:-unknown} repo by declared exception — ${WHY}"

    - name: Non-public, survey mode
      if: ${{ github.event.repository.visibility != 'public' && inputs.allow-private == '' && inputs.mode == 'warn' }}
      shell: bash
      env:
        WHAT: ${{ inputs.what }}
        VIS: ${{ github.event.repository.visibility }}
      run: |
        echo "::warning title=package-visibility-gate::${WHAT}: a ${VIS:-unknown} repo publishes a PRIVATE package, billing the org's shared 500 MB allowance. This is refused once this gate ratchets to enforce. See package-visibility-gate/README.md."

    - name: Non-public — refuse
      if: ${{ github.event.repository.visibility != 'public' && inputs.allow-private == '' && inputs.mode != 'warn' }}
      shell: bash
      env:
        WHAT: ${{ inputs.what }}
        VIS: ${{ github.event.repository.visibility }}
      run: |
        echo "::error title=package-visibility-gate::${WHAT}: refusing to publish from a ${VIS:-unknown} repository — a private package bills the ORG's one shared 500 MB allowance, not this repo's budget. Fixes: make the repo public; push to the fleet's own Zot; ship it as a flake output so the binary cache distributes it and nothing is billed; or declare allow-private: '<typed reason>'. See package-visibility-gate/README.md."
        exit 1
