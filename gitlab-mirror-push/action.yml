name: 'pleme-io · gitlab-mirror-push'
description: 'Mirror push the repo to a GitLab remote.'
branding: { icon: 'upload', color: 'orange' }

inputs:
  gitlab-url:
    required: true
  project-path:
    required: true
  token:
    required: true

outputs:
  pushed:
    value: ${{ steps.run.outputs.pushed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/gitlab-mirror-push.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        GITLAB_URL: ${{ inputs.gitlab-url }}
        PROJECT_PATH: ${{ inputs.project-path }}
        TOKEN: ${{ inputs.token }}
