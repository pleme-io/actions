name: 'pleme-io · changelog-fragments-merge'
description: 'Merge .changelog/ fragments into CHANGELOG.md (Keep a Changelog).'
branding: { icon: 'file-text', color: 'gray-dark' }

inputs:
  fragments-dir:
    required: false
    default: ".changelog/"
  changelog-file:
    required: false
    default: "CHANGELOG.md"

outputs:
  merged-count:
    value: ${{ steps.run.outputs.merged-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/changelog-fragments-merge.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        FRAGMENTS_DIR: ${{ inputs.fragments-dir }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
