name: 'pleme-io · caixa-deps-resolve'
description: 'Resolve :depends-on entries in a caixa.lisp to actual git checkouts at the requested ref. Materializes git-as-package-repo for caixa.'
branding: { icon: 'download', color: 'blue' }

inputs:
  caixa-path:
    required: false
    default: ""
  deps-dir:
    description: "Where to clone resolved deps (default: .caixa-deps/)"
    required: false
    default: ".caixa-deps"

outputs:
  resolved-count:
    value: ${{ steps.run.outputs.resolved-count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/caixa-deps-resolve.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CAIXA_PATH: ${{ inputs.caixa-path }}
        DEPS_DIR: ${{ inputs.deps-dir }}
