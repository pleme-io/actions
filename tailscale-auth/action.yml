name: 'pleme-io · tailscale-auth'
description: 'Authenticate runner with Tailscale via OAuth or auth-key.'
branding: { icon: 'wifi', color: 'green' }

inputs:
  auth-key:
    required: true
  tags:
    required: false
    default: "tag:ci"

outputs:
  hostname:
    value: ${{ steps.run.outputs.hostname }}

runs:
  using: composite
  steps:
    - uses: tailscale/github-action@v3
      with:
        authkey: ${{ inputs.auth-key }}
        tags: ${{ inputs.tags }}
        hostname: ci-${{ github.run_id }}
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/tailscale-auth.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        AUTH_KEY: ${{ inputs.auth-key }}
        TAGS: ${{ inputs.tags }}
