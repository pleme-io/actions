name: 'pleme-io · matrix-notify'
description: 'Send a message to a Matrix room via the appservice REST API.'
branding: { icon: 'message-circle', color: 'purple' }

inputs:
  homeserver:
    required: true
  access-token:
    required: true
  room-id:
    required: true
  body:
    required: true

outputs:
  sent:
    value: ${{ steps.run.outputs.sent }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/matrix-notify.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        HOMESERVER: ${{ inputs.homeserver }}
        ACCESS_TOKEN: ${{ inputs.access-token }}
        ROOM_ID: ${{ inputs.room-id }}
        BODY: ${{ inputs.body }}
