name: 'pleme-io · buildkit-cache-warm'
description: 'RETIRED: pleme-io caching software is sui (use sui-dockerfile-node-cache); refuses unless allow-legacy is "true". Pre-warm buildkit''s registry-mounted layer cache for an image. Useful for cold-start CD runners or fan-out builds.'
branding: { icon: 'zap', color: 'blue' }

inputs:
  image:
    required: true
  cache-image:
    description: "Where the warmed cache lives (default: ${image}:buildcache)"
    required: false
    default: ""
  allow-legacy:
    description: 'The literal "true" runs this retired buildkit registry cache anyway. Anything else refuses and points at sui-dockerfile-node-cache.'
    required: false
    default: 'false'

outputs:
  warmed:
    value: ${{ steps.run.outputs.warmed }}

runs:
  using: composite
  steps:
    - uses: pleme-io/actions/legacy-cache-guard@main
      with:
        action: buildkit-cache-warm
        replacement: sui-dockerfile-node-cache
        allow-legacy: ${{ inputs.allow-legacy }}
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/buildkit-cache-warm.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        IMAGE: ${{ inputs.image }}
        CACHE_IMAGE: ${{ inputs.cache-image }}
