name: 'pleme-io · airflow-trigger'
description: 'Trigger an Airflow DAG via REST API.'
branding: { icon: 'play', color: 'blue' }

inputs:
  base-url:
    required: true
  dag-id:
    required: true
  conf:
    required: false
    default: "{}"

outputs:
  run-id:
    value: ${{ steps.run.outputs.run-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/airflow-trigger.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        BASE_URL: ${{ inputs.base-url }}
        DAG_ID: ${{ inputs.dag-id }}
        CONF: ${{ inputs.conf }}
