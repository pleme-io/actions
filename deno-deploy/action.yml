name: 'pleme-io · deno-deploy'
description: 'Deploy to Deno Deploy via deployctl.'
branding: { icon: 'cloud', color: 'gray-dark' }

inputs:
  project:
    required: true
  entry-file:
    required: true
  token:
    required: true
  # Additive, defaulted to the pre-existing behaviour (preview deploy).
  prod:
    required: false
    default: "false"

outputs:
  deployment-url:
    value: ${{ steps.run.outputs.deployment-url }}

runs:
  using: composite
  steps:
    # NO actions/checkout here, deliberately, and unlike the loader template.
    # The stdlib + run.tlisp are read from ${{ github.action_path }} (the
    # runner's own _actions copy), so nothing here needs the caller's tree —
    # while `actions/checkout` defaults to clean:true and would DELETE the
    # untracked build output this action exists to deploy. Every one of this
    # repo's deploy-family actions is checkout-free for the same reason.
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/deno-deploy.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PROJECT: ${{ inputs.project }}
        ENTRY_FILE: ${{ inputs.entry-file }}
        PROD: ${{ inputs.prod }}
        # ★ The token reaches deployctl through the ENVIRONMENT and only the
        # environment. Under the name deployctl itself reads, so there is one
        # name for one secret and no second copy to drift. run.tlisp never
        # binds it — it asks only whether it is non-empty — and never puts it
        # in argv, where `ps` / /proc/<pid>/cmdline would expose it.
        DENO_DEPLOY_TOKEN: ${{ inputs.token }}
        # deployctl colourises its success banner; the URL scan reads tokens
        # out of that text, so keep the escapes out of it.
        NO_COLOR: "1"
