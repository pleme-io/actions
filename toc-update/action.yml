name: 'pleme-io · toc-update'
description: 'Auto-update markdown table-of-contents between <!-- toc --> markers. Idempotent — re-runs are no-op when TOC matches headings.'
branding: { icon: 'list', color: 'gray-dark' }

inputs:
  files:
    description: "Space-separated markdown files (or globs)"
    required: false
    default: "README.md"
  open-pr:
    required: false
    default: "false"

outputs:
  changed:
    value: ${{ steps.run.outputs.changed }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.BOT_PAT || github.token }}
    - uses: actions/setup-node@v4
      with: { node-version: "20" }
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/toc-update.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        FILES: ${{ inputs.files }}
        OPEN_PR: ${{ inputs.open-pr }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
