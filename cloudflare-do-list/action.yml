name: 'pleme-io · cloudflare-do-list'
description: 'List Durable Object instances by namespace.'
branding: { icon: 'list', color: 'orange' }

inputs:
  namespace-id:
    required: true

outputs:
  count:
    value: ${{ steps.run.outputs.count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/cloudflare-do-list.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        NAMESPACE_ID: ${{ inputs.namespace-id }}
