name: 'pleme-io · cloudflare-do-list'
description: 'List Durable Object instances by namespace.'
branding: { icon: 'list', color: 'orange' }

inputs:
  namespace-id:
    required: true

outputs:
  count:
    value: ${{ steps.run.outputs.count }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        NAMESPACE_ID: ${{ inputs.namespace-id }}
