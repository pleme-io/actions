name: 'pleme-io · pyroscope-push'
description: 'Push a profiling sample to a Pyroscope server.'
branding: { icon: 'activity', color: 'purple' }

inputs:
  url:
    required: true
  app-name:
    required: true
  profile-file:
    required: true

outputs:
  pushed:
    value: ${{ steps.run.outputs.pushed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/pyroscope-push.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        URL_ARG: ${{ inputs.url }}
        APP_NAME: ${{ inputs.app-name }}
        PROFILE_FILE: ${{ inputs.profile-file }}
