name: 'pleme-io · helm-oci-publish'
description: 'Lint, package, and push a Helm chart to an OCI registry (nix backend: helm from nixpkgs, runs anywhere nix runs — including pure-nix self-hosted runners with no docker)'
branding:
  icon: 'anchor'
  color: 'purple'

inputs:
  chart-path:
    description: "Path to the chart directory (containing Chart.yaml), or the PARENT directory when charts names the charts"
    required: true
  registry:
    description: "OCI registry URL (oci:// scheme)"
    required: true
  version:
    description: "Override chart version; empty falls through to Chart.yaml's version"
    required: false
    default: ""
  lib-chart-dir:
    description: "External library chart directory for file:// deps"
    required: false
    default: ""
  lib-chart-name:
    description: "Library chart name"
    required: false
    default: "pleme-lib"
  charts:
    description: "Newline-separated chart names under chart-path to publish (the changed-only list from changed-charts); empty publishes the single chart at chart-path. The loop lives here because GitHub startup_fails a job combining uses: with strategy.matrix (measured 2026-11-21)."
    required: false
    default: ""

outputs:
  status:
    description: "0 when every chart published cleanly."
    value: ${{ steps.run.outputs.status }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/helm-oci-publish.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below — never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        CHART_PATH:     ${{ inputs.chart-path }}
        REGISTRY:       ${{ inputs.registry }}
        VERSION:        ${{ inputs.version }}
        CHARTS:         ${{ inputs.charts }}
        LIB_CHART_DIR:  ${{ inputs.lib-chart-dir }}
        LIB_CHART_NAME: ${{ inputs.lib-chart-name }}

# The docker-container twin of this action (same inputs, `using: docker`)
# is helm-oci-publish-image — kept as its own manifest because a docker://
# step inside a composite is pre-pulled by the runner even behind a false
# `if:`, so the two backends cannot share one action.yml (measured
# 2026-11-21, run 44863358464).
