name: 'pleme-io · runner-policy'
description: >-
  Fail the build when a PRIVATE repo declares a metered GitHub-hosted runner.
  Enforces the invariant stated once in `pleme-io/actions/runner-resolve`: a CI
  path either flows through a genuinely public repo on free GitHub-hosted
  minutes, or through an org self-hosted pool — never a metered runner on a private
  repo. Checks BOTH shapes, the literal `runs-on: ubuntu-latest` and the
  matrix-supplied form where `runs-on` interpolates a `matrix.os` value; the
  second is the one a grep for `runs-on: ubuntu-*` silently misses. Also fails a
  third-party reusable workflow call (it runs on the runners its owner names) and
  a retired cache plane (cachix, attic, magic-nix-cache, the dead in-cluster sui):
  sui is the only cache. With sweep-org it checks every private repo of an org at
  its default branch, the fleet gate. No-op on public repos.

  NOTE: this description spells the matrix form in prose ON PURPOSE. GitHub
  evaluates expression syntax (dollar-brace-brace) inside an action manifest's
  DESCRIPTION, so writing a literal expression here fails the whole manifest
  to load with "Unrecognized named-value: 'matrix'" — a documentation string
  breaking the action it documents. Measured on pleme-io/nix run 31251090680,
  and then measured AGAIN on the commit that fixed it, because the warning
  note itself quoted the syntax it was warning about. Do not put expression
  syntax in this field, not even as an example.
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  workflows-dir:
    description: "Directory of workflow files to check."
    required: false
    default: ".github/workflows"
  private:
    description: >-
      Whether the CALLING repo is private. Defaults to the event payload, which
      is the authoritative source; override only in a test harness.
    required: false
    default: ""
  reusables-as-private:
    description: >-
      Check the workflow_call files in workflows-dir as if the repo were
      private, whatever its own visibility: a public library of reusable
      workflows runs inside each private caller's billing context.
    required: false
    default: "false"
  runner-labels:
    description: >-
      A runner label set the caller routes jobs to, as a JSON array or words,
      for a reusable workflow whose runs-on is an input and so invisible to the
      file scan. On a private repo a metered GitHub-hosted label in it fails
      the check. Empty checks nothing extra.
    required: false
    default: ""

  known-labels:
    description: "Every self-hosted runner label a pool carries, as words or a JSON array. When set, a runs-on label outside it (and outside the GitHub-hosted images) fails: a job no runner can ever take."
    required: false
    default: ""
  sweep-org:
    description: >-
      An org whose every PRIVATE repo is checked at its default branch instead of
      workflows-dir: the fleet gate. Reads through the gh CLI with the token input.
    required: false
    default: ""
  token:
    description: "Token gh reads the swept org with; needs metadata and contents read on every private repo."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/runner-policy.tlisp"
        cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp" "${{ github.action_path }}/run.tlisp" > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SWEEP_ORG: ${{ inputs.sweep-org }}
        KNOWN_LABELS: ${{ inputs.known-labels }}
        GH_TOKEN: ${{ inputs.token != '' && inputs.token || github.token }}
        WORKFLOWS_DIR: ${{ inputs.workflows-dir }}
        REPO_PRIVATE: ${{ inputs.private != '' && inputs.private || github.event.repository.private }}
        RUNNER_LABELS: ${{ inputs.runner-labels }}
        REUSABLES_AS_PRIVATE: ${{ inputs.reusables-as-private }}
