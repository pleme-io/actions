name: 'pleme-io · exec-arg-budget-lint'
description: 'Fail when any action.yml or workflow passes tlisp through an input, env value or argument instead of a file, and warn when the shared stdlib nears the exec ceiling. An input, env value or argument is one exec string, and Linux caps one at MAX_ARG_STRLEN = 131072 bytes; over that, bash never starts and the run dies with "Argument list too long" attributed to the caller rather than to the stdlib commit that grew it (helmworks run 40631065859, after actions 491ac2c). Subjects: ./*/action.yml and .github/workflows/*.yml|yaml. Shapes refused: a heredoc that writes a script step output, a script input fed from a step output, a script step output used as an env value, and command substitution of a .tlisp file. The fix is always the same: write the unit to a file and pass `script-file:` (with `stdlib: "true"` for the shared stdlib). It also checks that tatara-script still carries the stdlib marker it uses to refuse an inline stdlib.'
branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  stdlib-path:
    description: "The shared prelude every inlining action concatenates. Its size is the fixed cost every one of them pays, so this is the number that moves the whole fleet's budget at once."
    required: false
    default: "_tlisp-stdlib/stdlib.tlisp"
  limit:
    description: "MAX_ARG_STRLEN in BYTES. 131072 on Linux. Overridable so a test can drive a small ceiling without a 118KB fixture — not so a repo can buy headroom it does not have."
    required: false
    default: "131072"
  warn-margin:
    description: "Report any action whose headroom is below this many bytes. These are not failures; they are the countdown. An action with 292 bytes left is broken by the next paragraph added to the stdlib, and the error will point at the action rather than at that commit."
    required: false
    default: "8000"
  fail-on-violation:
    description: "When true (default), an inline caller, an over-budget action or a marker drift is exit 1."
    required: false
    default: "true"
  stdlib-size-guard:
    description: "true (default) or false. When true, the run warns once the stdlib reaches stdlib-warn-bytes. false turns the warning off. Any other value is refused (exit 1, reason=bad-input)."
    required: false
    default: "true"
  stdlib-warn-bytes:
    description: "Stdlib size in BYTES at which the size guard warns. Default 98304 (96 KiB, 75% of the 131072 ceiling)."
    required: false
    default: "98304"

outputs:
  scanned:
    description: "action.yml files found. The denominator — a discovery change that finds nothing reports 0 here rather than 0 violations that read as clean."
    value: ${{ steps.run.outputs.scanned }}
  inlining:
    description: "How many action.yml and workflow files pass tlisp inline. Any value above 0 fails."
    value: ${{ steps.run.outputs.inlining }}
  violations:
    description: "How many exceed the ceiling today."
    value: ${{ steps.run.outputs.violations }}
  near-limit:
    description: "How many sit within warn-margin of the ceiling."
    value: ${{ steps.run.outputs.near-limit }}
  min-headroom:
    description: "The tightest surviving margin in bytes — the size of the stdlib commit that breaks the fleet next."
    value: ${{ steps.run.outputs.min-headroom }}
  reason:
    description: "ok | over-budget | inlining | marker-drift | bad-input | no-actions | no-stdlib."
    value: ${{ steps.run.outputs.reason }}
  stdlib-bytes:
    description: "The stdlib's size in bytes."
    value: ${{ steps.run.outputs.stdlib-bytes }}
  size-guard:
    description: "ok | warn | off."
    value: ${{ steps.run.outputs.size-guard }}

runs:
  using: composite
  steps:
    # This action reads the repo it lints, so it takes its own advice: the
    # script goes to a FILE, never through the arg space it exists to police.
    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/exec-arg-budget-lint.tlisp"
        {
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat "${{ github.action_path }}/run.tlisp"
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - name: Check the exec-arg budget
      id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        STDLIB_PATH: ${{ inputs.stdlib-path }}
        LIMIT: ${{ inputs.limit }}
        WARN_MARGIN: ${{ inputs.warn-margin }}
        FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
        STDLIB_SIZE_GUARD: ${{ inputs.stdlib-size-guard }}
        STDLIB_WARN_BYTES: ${{ inputs.stdlib-warn-bytes }}
