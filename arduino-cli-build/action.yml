name: 'pleme-io · arduino-cli-build'
description: 'Compile an Arduino sketch via arduino-cli.'
branding: { icon: 'package', color: 'blue' }

inputs:
  sketch:
    required: true
  fqbn:
    required: true

outputs:
  binary-path:
    value: ${{ steps.run.outputs.binary-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/arduino-cli-build.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SKETCH: ${{ inputs.sketch }}
        FQBN: ${{ inputs.fqbn }}
