name: 'pleme-io · yank-version'
description: 'Polymorphic yank/unpublish — cargo yank / npm deprecate / pip remove. Surgical rollback for a single bad version (does NOT delete previous versions).'
branding: { icon: 'minus-circle', color: 'red' }

inputs:
  package:
    required: true
  version:
    required: true
  reason:
    description: "Optional reason (logged to operator)"
    required: false
    default: ""

outputs:
  yanked:
    value: ${{ steps.yank.outputs.yanked }}
  ecosystem:
    value: ${{ steps.yank.outputs.ecosystem }}

runs:
  using: composite
  steps:
    - name: Install Rust (if Cargo.toml)
      if: hashFiles('Cargo.toml') != ''
      uses: dtolnay/rust-toolchain@stable
    - name: Install Node (if package.json)
      if: hashFiles('package.json') != ''
      uses: actions/setup-node@v4
      with: { node-version: "20" }
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/yank-version.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: yank
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        REASON: ${{ inputs.reason }}
