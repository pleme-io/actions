name: 'pleme-io · influxdb-write'
description: 'Write line-protocol points to InfluxDB.'
branding: { icon: 'database', color: 'purple' }

inputs:
  url:
    required: true
  token:
    required: true
  org:
    required: true
  bucket:
    required: true
  lines:
    required: true

outputs:
  written:
    value: ${{ steps.run.outputs.written }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/influxdb-write.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        URL_ARG: ${{ inputs.url }}
        TOKEN: ${{ inputs.token }}
        ORG_ARG: ${{ inputs.org }}
        BUCKET: ${{ inputs.bucket }}
        LINES: ${{ inputs.lines }}
