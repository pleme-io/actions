name: 'pleme-io · openai-embeddings-batch'
description: 'Compute embeddings via OpenAI batch API.'
branding: { icon: 'package', color: 'green' }

inputs:
  api-key:
    required: true
  input-file:
    required: true
  model:
    required: false
    default: "text-embedding-3-small"
  # Additive. Lets the action target Azure OpenAI or a gateway, and is what
  # makes the two API calls testable against a local server without a live key.
  api-base:
    required: false
    default: "https://api.openai.com/v1"

outputs:
  batch-id:
    value: ${{ steps.run.outputs.batch-id }}
  # Additive. A caller polling the batch needs the file id to clean up, and
  # the request count is the denominator that proves the run was not vacuous.
  input-file-id:
    value: ${{ steps.run.outputs.input-file-id }}
  request-count:
    value: ${{ steps.run.outputs.request-count }}
  status:
    value: ${{ steps.run.outputs.status }}

runs:
  using: composite
  steps:
    # NO actions/checkout HERE, deliberately, unlike the sibling actions that
    # read a committed spec. `input-file` is normally GENERATED by an earlier
    # step in the caller's job, and actions/checkout cleans the workspace by
    # default — adding it would delete the very file this action is given.
    - id: src
      shell: bash
      run: |
        {
          echo 'script<<TLISP_EOF'
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
          echo 'TLISP_EOF'
        } >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script: ${{ steps.src.outputs.script }}
      env:
        API_KEY: ${{ inputs.api-key }}
        INPUT_FILE: ${{ inputs.input-file }}
        MODEL: ${{ inputs.model }}
        API_BASE: ${{ inputs.api-base }}
