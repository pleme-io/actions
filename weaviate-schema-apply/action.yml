name: 'pleme-io · weaviate-schema-apply'
description: 'Apply a Weaviate schema definition.'
branding: { icon: 'database', color: 'green' }

inputs:
  url:
    required: true
  api-key:
    required: true
  schema-file:
    required: true

outputs:
  applied:
    value: ${{ steps.run.outputs.applied }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/weaviate-schema-apply.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        URL_ARG: ${{ inputs.url }}
        API_KEY: ${{ inputs.api-key }}
        SCHEMA_FILE: ${{ inputs.schema-file }}
