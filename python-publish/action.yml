name: 'pleme-io · python-publish'
description: 'Publish a Python package to pypi.org via uv publish; skip if (name, version) already exists; sleep + retry on rate limit.'
branding:
  icon: 'upload'
  color: 'blue'

inputs:
  dry-run:
    description: "Build dist/ but don't upload"
    required: false
    default: "false"

outputs:
  shipped:
    value: ${{ steps.ship.outputs.shipped }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3

    - name: Build sdist + wheel
      shell: bash
      run: uv build

    - name: Load stdlib + run.tlisp
      id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/python-publish.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"

    - id: ship
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        # UV_PUBLISH_TOKEN read by uv publish. Substrate workflow
        # bridges org-level PYPI_API_TOKEN to UV_PUBLISH_TOKEN.
