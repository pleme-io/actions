name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manually re-runnable. Added because this workflow's two red jobs were both
  # fixed OUTSIDE this repo — the tlisp-lint failure by deleting a duplicate in
  # substrate-bump, and the doc-gen failure by unpicking a path-dep chain in
  # pleme-doc-gen and go-tool-synthesizer. With push/pull_request as the only
  # triggers there was no way to ask "is it green now?" without inventing a
  # commit here, which is a bad reason to touch a repo 315 consumers pull from.
  workflow_dispatch:

jobs:
  validate-action-yml:
    name: Validate every action.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check each action has an action.yml
        run: |
          set -euo pipefail
          for a in iac-forge substrate-bump nix-flake-check ansible-collection-build ansible-collection-publish spec-watch; do
            if [ -f "$a/action.yml" ]; then
              echo "$a OK"
            else
              echo "$a MISSING action.yml"
              exit 1
            fi
          done
      # Was a `python3 - <<'PY'` heredoc. It also exited 0 when the glob matched
      # nothing, so a collapsed checkout passed the gate having validated
      # nothing; tools/check-action-schema.tlisp floors the denominator and
      # exits 3 for that case instead.
      - name: Parse each action.yml as YAML and check required keys
        uses: ./tatara-script
        with:
          script-file: tools/check-action-schema.tlisp

  lint-tlisp:
    name: Lint every *.tlisp file (paren / string / comment balance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Self-host the lint action from the same repo's path so PRs
      # can be tested against their own changes without first
      # tagging a release. ./tlisp-lint runs six layers in tatara-lisp:
      # (1) paren/string/comment balance, (2) a parser dry-run, (3) the
      # semantic rule lint (git-mutation-discard et al. via
      # `tatara-script lint`), (4) stdlib shadowing, (5) re-typed stdlib
      # diagnostic literals, and (6) crash-certain forms — a named `let` or a
      # wrong-arity primitive call, neither of which fails at LOAD, so layers
      # 1-3 certify them clean. Layer 6 needs `python3` (as layer 1 already
      # does) and reads its arity table out of the running interpreter.
      # No extra shell here — the orchestration lives in run.tlisp.
      - uses: ./tlisp-lint

  tlisp-tests:
    name: Run every *.test.tlisp via tatara-script --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Discovers each <action>/run.test.tlisp, runs its (deftest ...) forms
      # against the real run.tlisp (TLISP_TEST=1 gates the unit's main), and
      # fails the gate on any failing assertion.
      #
      # ── ★ ARMED 2026-08-06. IT WAS continue-on-error UNTIL NOW ──────────
      # This job carried `continue-on-error: true`, and nothing `needs:` it,
      # so a failing tlisp test failed NOTHING. Measured on main the day it
      # was armed: THREE files were red and had been for some time.
      #
      #   ddl-gate         5/7  — the harness prepended only _tlisp-stdlib,
      #                           but ddl-gate's action.yml also cats
      #                           _tlisp-ddl, so the unit was tested as a
      #                           DIFFERENT PROGRAM than it ships as
      #   action-pipeline  0/N  — top-level (env-required "PIPELINE_SPEC")
      #                           aborts at LOAD, before the TLISP_TEST guard
      #                           that protects main. Zero deftests ran.
      #   cargo-run-bin    0/N  — same shape, BIN
      #
      # Note what the last two mean: "nothing ran" and "everything failed"
      # produced the same red, and the red produced the same green workflow.
      # A suite nothing gates on is a suite nothing protects. All 44 pass now.
      #
      # min-files is a FLOOR against the zero-denominator failure: discovery
      # matching nothing would otherwise log "all 0 file(s) passed" and exit 0.
      # 44 test files exist (2026-08-06). Raised 30 -> 42: the old floor sat 14
      # below reality, so a 32% collapse in discovery still passed the check
      # that exists to catch exactly that. Two files of slack, not fourteen.
      # Raise it as the suite grows.
      #
      # RE-MEASURED 2026-08-18 by running the harness locally: 58 files, all
      # green. The floor had drifted back to 16 below reality — the same gap the
      # note above was written to close, reopened by 14 suites landing without
      # anyone re-reading the floor they were supposed to raise. 42 -> 56, two
      # files of slack again. THE LESSON IS THE DRIFT, not the number: a floor
      # stated once and never re-measured is a ratchet that quietly unwinds, so
      # re-measure it whenever you add a suite rather than trusting this comment.
      - uses: ./tlisp-test
        with:
          min-files: "56"

  enforce-no-shell:
    name: Enforce ★★ NO-SHELL directive across action.yml files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./action-shell-lint
        with:
          threshold: "15"          # PR-fail when an action has > 15 shell lines outside the loader
          fail-on-violation: "true"

  enforce-no-runtime-install:
    name: Enforce hard rule -- no runtime tool installation (theory/NIX-HARDENING.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Existing debt is tracked in runtime-install-lint/baseline.txt and
      # reported every run (never silently accepted) -- only a NEW,
      # non-baselined violation fails the build. Graduating an entry out of
      # the baseline (converting the action to consume a Nix-hardened
      # image via a docker:// action) is the tracked path to zero.
      - uses: ./runtime-install-lint
        with:
          fail-on-violation: "true"

  banned-tools:
    name: Enforce banned external tools (skopeo -> doca)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # RATCHET, same discipline as runtime-install-lint above: the 4 known
      # skopeo call sites in this repo are listed in banned-tool-lint/baseline.txt
      # with a stated reason each (two retired actions with zero consumers, the
      # stdlib's superseded oci:skopeo-* helpers, and one pre-conversion test
      # fixture). Only a NEW call site fails. Verified by introducing one:
      # exit 1, naming the file. Target is zero, as runtime-install-lint reached.
      - uses: ./banned-tool-lint
        with:
          fail-on-violation: "true"

  enforce-output-contract:
    name: Enforce the two-boundary output contract (generated == committed)
    runs-on: ubuntu-latest
    # `continue-on-error: true` REMOVED here and on the step below, 2026-08-08.
    # It was set in both places, in a job whose own comment says "A failure here
    # is fixed by regenerating, never by relaxing the check" -- so the check was
    # relaxed twice, by the job that forbids relaxing it. The gate was RED at
    # HEAD (outer boundary: honeycomb-marker's `created`) and reported nothing,
    # and it is the gate that would have caught four permanently-empty outputs
    # added in the same week. A gate wired to continue-on-error is not a gate;
    # it is a log line. Flipped only AFTER making it green -- enabling a red
    # gate would just have moved the non-signal from "always passes" to "always
    # fails", which is the same vacuity wearing the other hat.
    steps:
      - uses: actions/checkout@v7
      # Self-hosted from its own path so a PR is gated by its own version of the
      # rule. Seven layers: inner drift, catalog drift, dynamic-spec
      # reconciliation both ways, outer boundary, ghost step, parser parity, and
      # a non-vacuity floor that FAILS a run whose scan matched nothing.
      #
      # This is the static complement to tatara-script/output-contract.tlisp.
      # That gate is per-run and per-branch -- it only sees the one code path a
      # given execution took, and it reads GITHUB_ACTION_PATH/action.yml, which
      # inside the exec step is tatara-script's OWN manifest. So it can prove
      # neither "every branch" nor "the wrapper forwards it". This job does both,
      # before anything runs.
      #
      # A failure here is fixed by regenerating, never by relaxing the check:
      #   MODE=write tatara-script <(cat _tlisp-stdlib/stdlib.tlisp output-contract-sync/run.tlisp)
      - uses: ./output-contract-sync
        with:
          mode: check
          fail-on-drift: "true"

  regenerate-catalog:
    name: Regenerate catalog + per-action docs via pleme-doc-gen (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # pleme-doc-gen is a PRIVATE repo, so the `cargo install --git` below
      # clones over authenticated https. Without this the job died at install
      # with "failed to authenticate when downloading repository" — which is
      # why this job was red, NOT anything about the catalog it renders. That
      # red had been standing since at least 2026-07-24 and was masking the
      # one genuine failure beside it (the tlisp-lint Layer 5 error, fixed in
      # b94d2c7).
      #
      # Local `./git-credentials` rather than `pleme-io/actions/…@main`, to
      # match the sibling jobs in this file and to exercise the checked-out
      # copy. BOT_PAT is an org secret with ALL-repo visibility and is already
      # used by this repo's auto-bump.yml.
      - uses: ./git-credentials
        with:
          bot-pat: ${{ secrets.BOT_PAT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pleme-doc-gen
        run: cargo install --locked --git https://github.com/pleme-io/pleme-doc-gen pleme-doc-gen
      # NOTE: this job CANNOT FAIL and therefore enforces nothing. It renders
      # into /tmp, never diffs against what is committed, and writes a step
      # summary carrying HARDCODED counts ("192 per-action README.md" in a repo
      # with 338 action dirs). Left in place because it is the only thing
      # exercising pleme-doc-gen, and labelled rather than deleted so nobody
      # reads its green tick as evidence the catalog is current. The
      # enforce-output-contract job above is the one that actually diffs
      # generated against committed. Closing this properly needs a
      # `pleme-doc-gen check` subcommand -- and the `cargo install --git` above
      # is itself a runtime tool install in the repo that ships
      # runtime-install-lint, so it needs a pinned path in the same change.
      - name: Regenerate (advisory only -- does not gate)
        run: |
          pleme-doc-gen all --patterns-out /tmp/patterns-generated.nix
          lines=$(wc -l < /tmp/patterns-generated.nix)
          actions=$(grep -c 'uses = "pleme-io' /tmp/patterns-generated.nix)
          echo "## Catalog + docs preview (ADVISORY -- this job cannot fail)" >> "$GITHUB_STEP_SUMMARY"
          echo "- patterns-full.nix: $lines lines covering $actions actions" >> "$GITHUB_STEP_SUMMARY"
          echo "- per-action README.md regenerated in-place" >> "$GITHUB_STEP_SUMMARY"
          echo "- root README.md catalog index regenerated" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sync substrate: \`cp /tmp/patterns-generated.nix substrate/lib/release/patterns-full.nix\`" >> "$GITHUB_STEP_SUMMARY"

  smoke-spec-watch:
    name: Smoke — spec-watch (pure shell, no upstream dep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: First run (no cache) — changed=true
        id: first
        uses: ./spec-watch
        with:
          upstream-url: https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/README.md
          cache-file: /tmp/spec-watch-cache
      - name: Verify first run reports changed
        env:
          CHANGED: ${{ steps.first.outputs.changed }}
          NEW_SHA: ${{ steps.first.outputs.new-sha }}
        run: |
          set -euo pipefail
          [ "$CHANGED" = "true" ] || { echo "expected changed=true got $CHANGED"; exit 1; }
          [ -n "$NEW_SHA" ] || { echo "expected non-empty new-sha"; exit 1; }
          echo "$NEW_SHA" > /tmp/spec-watch-cache
      - name: Second run (cache primed) — changed=false
        id: second
        uses: ./spec-watch
        with:
          upstream-url: https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/README.md
          cache-file: /tmp/spec-watch-cache
      - name: Verify second run reports unchanged
        env:
          CHANGED: ${{ steps.second.outputs.changed }}
        run: |
          [ "$CHANGED" = "false" ] || { echo "expected changed=false got $CHANGED"; exit 1; }

  exec-arg-budget:
    name: No action inlines more tlisp than exec can carry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Self-hosted from this repo's own path, like tlisp-lint above, so a PR is
      # tested against its own changes without tagging a release first.
      #
      # This gate exists because the ceiling is SHARED and SHRINKING: stdlib.tlisp
      # is 118414 bytes of the 131072 an exec arg may hold, so every action that
      # inlines has 12657 left and every byte added to the stdlib takes from all
      # 300 of them at once. When one goes over, bash never starts, nothing
      # tlisp-related is logged, and "Argument list too long" is attributed to the
      # action rather than to the commit that moved the ceiling.
      #
      # Measured live 2026-08-12 (hardened-images run 31602346297): zot-pull-scan
      # was 4002 bytes over, its mirror leg died, and the admission step then
      # reported result=/severity=/vuln-count= all EMPTY — fail-closed, but the
      # stated reason was a scan that never ran.
      - uses: ./exec-arg-budget-lint
