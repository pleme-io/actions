name: 'pleme-io · cloudflare-d1-query'
description: 'Execute SQL against a Cloudflare D1 database.'
branding: { icon: 'database', color: 'orange' }

inputs:
  database-name:
    required: true
  sql:
    required: true

outputs:
  rows-affected:
    value: ${{ steps.run.outputs.rows-affected }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/cloudflare-d1-query.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        DATABASE_NAME: ${{ inputs.database-name }}
        SQL: ${{ inputs.sql }}
