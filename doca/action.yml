# pleme-io/actions/doca — typed OCI artifact manager (push / transfer / inspect /
# tag / list). Binary: oci-push, exposed as the substrate flake app `oci-push`
# and invoked via `nix run github:pleme-io/substrate#oci-push`.
#
# NO-SHELL: the run step has NO conditionals, NO loops, NO flag-mapping. Every
# input is surfaced as an `INPUT_*` env var; the oci-push binary reads `INPUT_*`
# as the fallback when a CLI flag is absent (flag wins; env is fallback). The
# action never branches on which inputs are set — it passes them all as env and
# lets the typed binary decide. `operation` is the sole positional arg.
#
# Dependency-free / no bootstrap deadlock: a composite action whose only runtime
# dependency is the Nix installer + `nix run …#oci-push`. It does NOT package or
# run a pre-built pleme-io image, so the tool that publishes the fleet's first
# images can itself run through this action on a clean runner (pre-bootstrap-safe
# per the AUTO-RELEASE directive).
name: 'pleme-io · doca'
description: 'Typed OCI artifact manager (push / transfer / inspect / tag / list) via nix run github:pleme-io/substrate#oci-push. Inputs surfaced as INPUT_* env; the binary reads them as flag fallbacks — no shell flag-mapping.'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  operation:
    description: "Operation: push | transfer | inspect | pull | tag | list | resolve | delete. Sole positional arg."
    required: true
  registry:
    description: "Destination registry host (push). Flag: --registry. Env: INPUT_REGISTRY."
    required: false
    default: ""
  image:
    description: "Image repository/name within the registry (push). Flag: --image. Env: INPUT_IMAGE."
    required: false
    default: ""
  tag:
    description: "Primary tag to apply (push). Flag: --tag. Env: INPUT_TAG."
    required: false
    default: ""
  additional-tags:
    description: "Space-separated extra tags applied alongside --tag (push). Flag: --additional-tags. Env: INPUT_ADDITIONAL_TAGS."
    required: false
    default: ""
  tarball:
    description: "Path to the local docker-archive tarball to push (push). Flag: --tarball. Env: INPUT_TARBALL."
    required: false
    default: ""
  backend:
    description: "Push backend: native (pure-Rust oci-client, default) | skopeo. Flag: --backend. Env: INPUT_BACKEND."
    required: false
    default: ""
  dest-user:
    description: "Destination registry username (push / transfer). Flag: --dest-user. Env: INPUT_DEST_USER."
    required: false
    default: ""
  dest-pass:
    description: "Destination registry password/token — pass via a secret (push / transfer). Flag: --dest-pass. Env: INPUT_DEST_PASS."
    required: false
    default: ""
  src:
    description: "Source reference for a transfer (e.g. docker.io/library/alpine:3.20). Flag: --src. Env: INPUT_SRC."
    required: false
    default: ""
  dest:
    description: "Destination reference for a transfer. Flag: --dest. Env: INPUT_DEST."
    required: false
    default: ""
  src-user:
    description: "Source registry username (transfer). Flag: --src-user. Env: INPUT_SRC_USER."
    required: false
    default: ""
  src-pass:
    description: "Source registry password/token — pass via a secret (transfer). Flag: --src-pass. Env: INPUT_SRC_PASS."
    required: false
    default: ""
  ref:
    description: "OCI reference to inspect / list / tag (e.g. ghcr.io/pleme-io/mado:latest). Flag: --ref. Env: INPUT_REF."
    required: false
    default: ""
  new-tag:
    description: "New tag to apply to an existing manifest (tag operation). Flag: --new-tag. Env: INPUT_NEW_TAG."
    required: false
    default: ""
  user:
    description: "Username for single-registry auth (inspect / list / tag). Flag: --user. Env: INPUT_USER."
    required: false
    default: ""
  pass:
    description: "Password/token for single-registry auth — pass via a secret. Flag: --pass. Env: INPUT_PASS."
    required: false
    default: ""

  # Added 2026-07-29. The binary has understood --dest-ca-cert and --insecure on
  # `push`/`inspect` for a while, and `list` gained them in the same change, but
  # none of the three was reachable through `with:` — so from a workflow's point
  # of view doca simply could not talk to a registry serving a self-signed
  # certificate. That is the common case for a cluster-internal scan-and-admit
  # registry, i.e. exactly where tag/digest discovery is most useful.
  dest-ca-cert:
    description: "Path to a PEM certificate to trust as an EXTRA root, for a registry with a self-signed cert (e.g. an in-cluster one). Real verification against a known cert — NOT a blanket accept-any-cert toggle, which is deliberately not exposed. Flag: --dest-ca-cert. Env: INPUT_DEST_CA_CERT."
    required: false
    default: ""
  insecure:
    description: "Force plain HTTP instead of HTTPS. An explicit escape hatch, never the default — prefer dest-ca-cert, which keeps verification on. Flag: --insecure. Env: INPUT_INSECURE."
    required: false
    default: ""
  exclude-tags:
    description: "resolve only: comma-separated tags to exclude from the candidate set. Use it to drop a rolling pointer that is no longer maintained -- such a tag is still a valid semver, so on a repo where it is the newest one it would otherwise win and publish older bytes under a fresh label. Flag: --exclude-tag (repeatable). Env: INPUT_EXCLUDE_TAGS."
    required: false
    default: ""
  require-prefix:
    description: "resolve only: fail unless the winning tag starts with this string (e.g. '1.0.'). Keeps a promotion that publishes into one release line from silently republishing a build from another. Flag: --require-prefix. Env: INPUT_REQUIRE_PREFIX."
    required: false
    default: ""
  out:
    description: "pull only: path to write the docker-archive tarball to. Flag: --out. Env: INPUT_OUT."
    required: false
    default: ""
  image-name:
    description: "pull only: repository name to record in the archive's RepoTags. An archive without RepoTags loads as a dangling image, so the caller must be able to name what it will load. Defaults to the source repository. Flag: --image-name. Env: INPUT_IMAGE_NAME."
    required: false
    default: ""
  image-tag:
    description: "pull only: tag to record in the archive's RepoTags. Flag: --image-tag. Env: INPUT_IMAGE_TAG."
    required: false
    default: ""
  arch:
    description: "pull only: architecture to select from a multi-arch index (e.g. amd64, arm64). EXPLICIT on purpose -- the default resolver picks the HOST platform, which silently makes the output runner-dependent. An index with no matching instance fails naming the platform. Flag: --arch. Env: INPUT_ARCH."
    required: false
    default: ""
  os:
    description: "pull only: OS to select from a multi-arch index. Defaults to linux. Flag: --os. Env: INPUT_OS."
    required: false
    default: ""
  digest-only:
    description: "inspect only: print just the immutable digest to stdout and nothing else, instead of the pretty manifest. Lets a caller resolve a mutable tag to a digest in one call and then copy by digest, so a tag that moves underneath cannot silently swap the bytes. Flag: --digest-only. Env: INPUT_DIGEST_ONLY."
    required: false
    default: ""

outputs:
  # `resolve` writes these to GITHUB_OUTPUT itself; a composite action must
  # DECLARE them or they stop at the action boundary and the caller sees
  # nothing -- written-but-unreadable, which is the same shape of defect as an
  # input nothing consumes. Empty for every other operation.
  tag:
    description: "resolve: the winning tag (numerically highest pure X.Y.Z after exclusions)."
    value: ${{ steps.doca.outputs.tag }}
  digest:
    description: "resolve: that tag's immutable digest. Copy by this rather than by the tag, so a tag that later moves cannot swap the bytes."
    value: ${{ steps.doca.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        # Upstream Nix so extra-conf is honored; sandbox=relaxed permits any
        # IFD in the substrate flake closure (consistent with image-push.yml).
        determinate: false
        extra-conf: |
          sandbox = relaxed

    - name: doca dispatch
      id: doca
      shell: bash
      run: nix run github:pleme-io/substrate#oci-push -- ${{ inputs.operation }}
      env:
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_ADDITIONAL_TAGS: ${{ inputs.additional-tags }}
        INPUT_TARBALL: ${{ inputs.tarball }}
        INPUT_BACKEND: ${{ inputs.backend }}
        INPUT_DEST_USER: ${{ inputs.dest-user }}
        INPUT_DEST_PASS: ${{ inputs.dest-pass }}
        INPUT_SRC: ${{ inputs.src }}
        INPUT_DEST: ${{ inputs.dest }}
        INPUT_SRC_USER: ${{ inputs.src-user }}
        INPUT_SRC_PASS: ${{ inputs.src-pass }}
        INPUT_REF: ${{ inputs.ref }}
        INPUT_NEW_TAG: ${{ inputs.new-tag }}
        INPUT_USER: ${{ inputs.user }}
        INPUT_PASS: ${{ inputs.pass }}
        INPUT_DEST_CA_CERT: ${{ inputs.dest-ca-cert }}
        INPUT_INSECURE: ${{ inputs.insecure }}
        INPUT_DIGEST_ONLY: ${{ inputs.digest-only }}
        INPUT_EXCLUDE_TAGS: ${{ inputs.exclude-tags }}
        INPUT_REQUIRE_PREFIX: ${{ inputs.require-prefix }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_IMAGE_NAME: ${{ inputs.image-name }}
        INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
        INPUT_ARCH: ${{ inputs.arch }}
        INPUT_OS: ${{ inputs.os }}
