name: 'pleme-io · selenium-grid-test'
description: 'Run Selenium tests against a Grid endpoint.'
branding: { icon: 'check-circle', color: 'green' }

inputs:
  hub-url:
    required: true
  test-command:
    required: true

outputs:
  passed:
    value: ${{ steps.run.outputs.passed }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/selenium-grid-test.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        HUB_URL: ${{ inputs.hub-url }}
        TEST_COMMAND: ${{ inputs.test-command }}
