name: 'pleme-io · buildah-build'
description: 'Build an OCI image with buildah (rootless alternative).'
branding: { icon: 'package', color: 'blue' }

inputs:
  dockerfile:
    required: false
    default: "Containerfile"
  tag:
    required: true

outputs:
  image-id:
    value: ${{ steps.run.outputs.image-id }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/buildah-build.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        TAG: ${{ inputs.tag }}
