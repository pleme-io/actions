name: 'pleme-io · kubectl-apply'
description: 'Apply k8s manifests + wait for rollout. Universal — works with any kubectl-reachable cluster.'
branding: { icon: 'check-circle', color: 'blue' }

inputs:
  manifests:
    description: "Path or glob to manifest file(s) / dir"
    required: true
  namespace:
    description: "Target namespace"
    required: false
    default: "default"
  wait:
    description: "Wait for rollout (deployment/statefulset/daemonset)"
    required: false
    default: "true"
  wait-timeout:
    description: "kubectl rollout status --timeout"
    required: false
    default: "300s"

outputs:
  applied-count:
    value: ${{ steps.apply.outputs.applied-count }}

runs:
  using: composite
  steps:
    - uses: azure/setup-kubectl@v4
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/kubectl-apply.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: apply
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        MANIFESTS: ${{ inputs.manifests }}
        NAMESPACE: ${{ inputs.namespace }}
        WAIT: ${{ inputs.wait }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
