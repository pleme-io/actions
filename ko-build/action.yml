name: 'pleme-io · ko-build'
description: 'Containerless Go image build + push via ko. No Dockerfile required.'
branding: { icon: 'package', color: 'blue' }

inputs:
  package:
    description: "Go package path (./cmd/myapp)"
    required: true
  repo:
    description: "Image repo (e.g. ghcr.io/pleme-io)"
    required: true
  platforms:
    required: false
    default: "linux/amd64,linux/arm64"
  push:
    required: false
    default: "true"

outputs:
  image:
    value: ${{ steps.run.outputs.image }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with: { go-version: "stable" }
    - uses: ko-build/setup-ko@v0.7
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/ko-build.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PACKAGE: ${{ inputs.package }}
        REPO_ARG: ${{ inputs.repo }}
        PLATFORMS: ${{ inputs.platforms }}
        PUSH: ${{ inputs.push }}
