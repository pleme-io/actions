name: 'pleme-io · go-build'
description: 'Build Go binaries with go build.'
branding: { icon: 'package', color: 'blue' }

inputs:
  packages:
    required: false
    default: "./..."
  output:
    required: false
    default: "./bin/"

outputs:
  binaries:
    value: ${{ steps.run.outputs.binaries }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/go-build.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        PACKAGES: ${{ inputs.packages }}
        OUTPUT_ARG: ${{ inputs.output }}
