name: 'pleme-io · gh-team-sync'
description: 'Reconcile GitHub team membership from a declarative JSON spec. Source-of-truth for org RBAC.'
branding: { icon: 'users', color: 'blue' }

inputs:
  spec-file:
    description: 'JSON spec: {"teams":{"<team>":{"members":["login",...]}}}'
    required: false
    default: ".github/teams.json"
  dry-run:
    description: 'Log the plan without mutating membership.'
    required: false
    default: "false"
  allow-empty-team:
    description: >-
      Permit a reconcile that removes EVERY current member of a team. Off by
      default: emptying a team is legal but is never something to do by
      accident, and the bash this action replaced would do it silently whenever
      a spec read returned nothing.
    required: false
    default: "false"

outputs:
  added-count:
    description: 'Memberships added (0 in dry-run).'
    value: ${{ steps.run.outputs.added-count }}
  removed-count:
    description: 'Memberships removed (0 in dry-run).'
    value: ${{ steps.run.outputs.removed-count }}
  failed-count:
    description: 'Operations that failed or were refused. Non-zero fails the step.'
    value: ${{ steps.run.outputs.failed-count }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
    # No `nix profile install ...#yq-go` and no nix-installer-action here any
    # more. The spec is JSON, which tatara-lisp parses natively, so the YAML
    # reader that forced a job-time install is gone rather than hardened --
    # closing a ★★ HERMETIC SUPPLY CHAIN violation and removing an UNPINNED
    # `DeterminateSystems/nix-installer-action@main` from the org's most
    # privileged action.
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/gh-team-sync.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        SPEC_FILE: ${{ inputs.spec-file }}
        DRY_RUN: ${{ inputs.dry-run }}
        ALLOW_EMPTY_TEAM: ${{ inputs.allow-empty-team }}
        GH_TOKEN: ${{ env.GH_ADMIN_TOKEN || github.token }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
