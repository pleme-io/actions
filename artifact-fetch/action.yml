name: 'pleme-io · artifact-fetch'
description: 'Fetch an artifact from a previous workflow run (cross-workflow handoff).'
branding: { icon: 'download', color: 'blue' }

inputs:
  workflow:
    required: true
  artifact-name:
    required: true
  target-dir:
    required: false
    default: "./artifacts"

outputs:
  fetched-path:
    value: ${{ steps.run.outputs.fetched-path }}

runs:
  using: composite
  steps:
    - id: src
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/artifact-fetch.tlisp"
        {
          # stdlib read in-checkout, at the SAME ref as the tlisp below -- never fetched.
          cat "${{ github.action_path }}/../_tlisp-stdlib/stdlib.tlisp"
          echo
          cat ${{ github.action_path }}/run.tlisp
        } > "$out"
        echo "script-file=$out" >> "$GITHUB_OUTPUT"
    - id: run
      uses: pleme-io/actions/tatara-script@main
      with:
        script-file: ${{ steps.src.outputs.script-file }}
      env:
        WORKFLOW: ${{ inputs.workflow }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        TARGET_DIR: ${{ inputs.target-dir }}
        RUN_ID: ${{ inputs.run-id }}
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
